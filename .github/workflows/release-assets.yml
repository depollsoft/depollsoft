name: Generate release assets
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to capture
        type: choice
        options: [pitchperfect, tagmaster]
        required: true
      platform:
        description: Store platform
        type: choice
        options: [ios, android]
        required: true
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      platform:
        type: string
        required: true
      source-sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  capture:
    # iOS simulator startup and captures need the standard Intel runner's 14 GB RAM.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26-intel' || 'ubuntu-latest' }}
    timeout-minutes: 90
    concurrency:
      group: release-capture-${{ inputs.app }}-${{ inputs.platform }}
      cancel-in-progress: false
    env:
      RELEASE_APP: ${{ inputs.app }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
      RELEASE_ANDROID_PORT: ${{ inputs.app == 'tagmaster' && '5560' || '5554' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Install capture dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install -r scripts/release/requirements.txt
      - name: Validate copy
        run: python3 scripts/release/release.py validate
      - name: Check live Tag Master catalog connectivity
        if: inputs.app == 'tagmaster'
        run: |
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            --retry 2 --retry-all-errors --retry-delay 5 \
            'https://www.barbershoptags.com/api.php?client=TagMaster&id=122&n=1' \
            --output /dev/null
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: inputs.platform == 'android'
        with:
          distribution: ${{ runner.os == 'macOS' && 'zulu' || 'temurin' }}
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        if: inputs.platform == 'android'
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Enable KVM for Android capture
        if: inputs.platform == 'android'
        run: |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules <<'RULE'
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          RULE
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Wear OS round
        if: inputs.platform == 'android' && inputs.app == 'pitchperfect'
        run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/release/emulator.py --name watch-round -- \
            "$RUNNER_TEMP/release-python/bin/python" scripts/release/wear.py \
            --serial emulator-5554 --shape round --output build/release/wear
      - name: Capture Wear OS square
        if: inputs.platform == 'android' && inputs.app == 'pitchperfect'
        run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/release/emulator.py --name watch-square -- \
            "$RUNNER_TEMP/release-python/bin/python" scripts/release/wear.py \
            --serial emulator-5554 --shape square --output build/release/wear
      - name: Capture Android phone and tablet
        if: inputs.platform == 'android'
        run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/release/emulator.py --name phone-tablet --port "$RELEASE_ANDROID_PORT" -- \
            "$RUNNER_TEMP/release-python/bin/python" scripts/release/capture.py \
            --app "$RELEASE_APP" --platform android --serial "emulator-$RELEASE_ANDROID_PORT" --wear-source build/release/wear \
            --output "build/release/assets/$RELEASE_APP/android"
      - name: Capture iPhone and iPad
        if: inputs.platform == 'ios'
        env:
          # Match ios.yml, including when the machine-wide xcode-select differs.
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/release/capture.py \
            --app "$RELEASE_APP" --platform ios --output "build/release/assets/$RELEASE_APP/ios"
      - name: Build screenshot gallery
        run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/release/review.py \
            --app "$RELEASE_APP" --platform "$RELEASE_PLATFORM" \
            --output "build/release/assets/$RELEASE_APP/$RELEASE_PLATFORM"
      - name: Export reviewed listing and any planned release notes
        run: |
          python3 scripts/release/release.py export --app "$RELEASE_APP" \
            --platform "$RELEASE_PLATFORM" --output "build/release/assets/$RELEASE_APP/$RELEASE_PLATFORM" --allow-unplanned
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ inputs.app }}-${{ inputs.platform }}
          path: build/release/assets/${{ inputs.app }}/${{ inputs.platform }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload failed Android capture diagnostics
        if: failure() && inputs.platform == 'android'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-capture-diagnostics-${{ inputs.app }}-${{ inputs.platform }}
          path: |
            build/release/emulator-logs/
            build/release/assets/${{ inputs.app }}/${{ inputs.platform }}/android-logcat.txt
          if-no-files-found: warn
          retention-days: 7
