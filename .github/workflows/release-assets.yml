name: Generate release assets
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to capture
        type: choice
        options: [pitchperfect, tagmaster]
        required: true
      platform:
        description: Store platform
        type: choice
        options: [ios, android]
        required: true
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      platform:
        type: string
        required: true
      source-sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    concurrency:
      group: release-capture-${{ github.run_id }}-${{ inputs.app }}-${{ inputs.platform }}
      cancel-in-progress: false
    env:
      RELEASE_APP: ${{ inputs.app }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Install capture dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install -r scripts/release/requirements.txt
      - name: Validate copy
        run: python3 scripts/release/release.py validate
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        if: inputs.platform == 'android'
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Enable emulator acceleration
        if: inputs.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Wear OS round
        if: inputs.platform == 'android' && inputs.app == 'pitchperfect'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          arch: x86_64
          target: android-wear
          profile: wearos_small_round
          avd-name: release-wear-round
          disk-size: 2048M
          emulator-boot-timeout: 300
          pre-emulator-launch-script: sed -i 's/hw.lcd.circular=no/hw.lcd.circular=yes/;s/hw.lcd.circular=false/hw.lcd.circular=true/' ~/.android/avd/release-wear-round.avd/config.ini
          disable-animations: true
          script: >-
            "$RUNNER_TEMP/release-python/bin/python" scripts/release/wear.py
            --serial emulator-5554 --shape round --output build/release/wear
      - name: Remove round watch emulator
        if: inputs.platform == 'android' && inputs.app == 'pitchperfect'
        run: avdmanager delete avd --name release-wear-round
      - name: Capture Wear OS square
        if: inputs.platform == 'android' && inputs.app == 'pitchperfect'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          arch: x86_64
          target: android-wear
          profile: wearos_square
          avd-name: release-wear-square
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: >-
            "$RUNNER_TEMP/release-python/bin/python" scripts/release/wear.py
            --serial emulator-5554 --shape square --output build/release/wear
      - name: Remove square watch emulator
        if: inputs.platform == 'android' && inputs.app == 'pitchperfect'
        run: avdmanager delete avd --name release-wear-square
      - name: Capture Android phone and tablet
        if: inputs.platform == 'android'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1600x2560 -dns-server 8.8.8.8
          script: >-
            "$RUNNER_TEMP/release-python/bin/python" scripts/release/capture.py
            --app "$RELEASE_APP" --platform android --serial emulator-5554 --wear-source build/release/wear
            --output "build/release/assets/$RELEASE_APP/android"
      - name: Capture iPhone and iPad
        if: inputs.platform == 'ios'
        run: |
          DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR
          "$RUNNER_TEMP/release-python/bin/python" scripts/release/capture.py \
            --app "$RELEASE_APP" --platform ios --output "build/release/assets/$RELEASE_APP/ios"
      - name: Compare with current store screenshots
        run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/release/review.py \
            --app "$RELEASE_APP" --platform "$RELEASE_PLATFORM" \
            --output "build/release/assets/$RELEASE_APP/$RELEASE_PLATFORM"
      - name: Export reviewed listing and any planned release notes
        run: |
          python3 scripts/release/release.py export --app "$RELEASE_APP" \
            --platform "$RELEASE_PLATFORM" --output "build/release/assets/$RELEASE_APP/$RELEASE_PLATFORM" --allow-unplanned
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ inputs.app }}-${{ inputs.platform }}
          path: build/release/assets/${{ inputs.app }}/${{ inputs.platform }}
          if-no-files-found: error
          retention-days: 30
