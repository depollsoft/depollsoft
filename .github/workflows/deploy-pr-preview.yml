# yamllint disable rule:line-length
name: Deploy PR Preview

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to deploy"
        required: true
        type: string
      source-sha:
        description: >-
          Specific PR commit SHA to deploy (defaults to current PR head)
        required: false
        default: ""
        type: string
      preview-build-number:
        description: "Preview build number associated with the requested SHA"
        required: false
        default: ""
        type: string
      request-comment-id:
        description: "Issue comment ID that requested the deploy"
        required: false
        default: ""
        type: string
      request-comment-at:
        description: >-
          Timestamp of the /deploy comment that requested the deploy
        required: false
        default: ""
        type: string
      request-comment-user:
        description: "GitHub login that requested the deploy"
        required: false
        default: ""
        type: string
      request-comment-url:
        description: "URL of the /deploy comment that requested the deploy"
        required: false
        default: ""
        type: string
      request-preview-comment-url:
        description: "URL of the sticky preview comment for the requested build"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-private
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate-pr:
    name: Validate PR source
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr-head-sha: ${{ steps.validate.outputs.pr-head-sha }}
      deploy-sha: ${{ steps.validate.outputs.deploy-sha }}
      pr-title: ${{ steps.validate.outputs.pr-title }}
    steps:
      - name: Validate PR is safe to deploy
        id: validate
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number('${{ inputs.pr-number }}');
            const requestedSourceSha = '${{ inputs.source-sha }}'.trim();
            const {data: pr} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed(
                `Refusing to deploy PR #${pullNumber} ` +
                  `from fork ${pr.head.repo?.full_name}. ` +
                  `Manual PR preview deploys require a branch in ` +
                  `${owner}/${repo}.`,
              );
              return;
            }

            let deploySha = pr.head.sha;
            if (requestedSourceSha) {
              const commits = await github.paginate(
                github.rest.pulls.listCommits,
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100,
                },
              );

              if (
                !commits.some((commit) => commit.sha === requestedSourceSha)
              ) {
                core.setFailed(
                  `Requested source SHA ${requestedSourceSha} ` +
                    `is not part of PR #${pullNumber}.`,
                );
                return;
              }

              deploySha = requestedSourceSha;
            }

            core.setOutput('pr-head-sha', pr.head.sha);
            core.setOutput('deploy-sha', deploySha);
            core.setOutput('pr-title', pr.title);

  compute-version:
    name: Compute Deploy Build
    runs-on: ubuntu-latest
    needs: validate-pr
    if: needs.validate-pr.result == 'success'
    permissions:
      issues: read
    outputs:
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - id: version
        env:
          REQUESTED_PREVIEW_BUILD_NUMBER: ${{ inputs.preview-build-number }}
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requestedBuildNumberText = (
              process.env.REQUESTED_PREVIEW_BUILD_NUMBER || ''
            ).trim();
            const requestedBuildNumber = /^\d+$/.test(requestedBuildNumberText)
              ? Number(requestedBuildNumberText)
              : 0;
            const currentBuildNumber = Math.floor(Date.now() / 1000 / 10);
            const statusMarker = '<!-- preview-deploy-status -->';
            const lookbackSince = new Date(
              Date.now() - 180 * 24 * 60 * 60 * 1000,
            ).toISOString();

            const readMeta = (body, key) => {
              const pattern = new RegExp(`<!-- ${key}:(.*?) -->`);
              return body.match(pattern)?.[1] ?? '';
            };

            const comments = await github.paginate(
              github.rest.issues.listCommentsForRepo,
              {
                owner,
                repo,
                per_page: 100,
                since: lookbackSince,
              },
            );

            let previousDeployBuildNumber = 0;
            for (const comment of comments) {
              if (!comment.body?.includes(statusMarker)) {
                continue;
              }

              const buildNumber = Number(
                readMeta(comment.body, 'preview-deploy-build-number'),
              );
              if (Number.isFinite(buildNumber)) {
                previousDeployBuildNumber = Math.max(
                  previousDeployBuildNumber,
                  buildNumber,
                );
              }
            }

            let buildNumber = Math.max(
              requestedBuildNumber,
              currentBuildNumber,
            );
            if (buildNumber <= previousDeployBuildNumber) {
              buildNumber = Math.max(
                currentBuildNumber,
                previousDeployBuildNumber + 1,
              );
            }

            core.setOutput('build-number', String(buildNumber));

  comment-start:
    name: Update PR deploy comment (start)
    runs-on: ubuntu-latest
    needs: [validate-pr, compute-version]
    if: needs.validate-pr.result == 'success'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Read helper code from this workflow's revision, never the requested PR SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/preview_deploy.cjs
          sparse-checkout-cone-mode: false

      - name: Mark deploy as running
        env:
          DEPLOY_INPUTS: ${{ toJSON(inputs) }}
          DEPLOY_SHA: ${{ needs.validate-pr.outputs.deploy-sha }}
          DEPLOY_BUILD_NUMBER: ${{ needs.compute-version.outputs.build-number }}
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {updateDeployComment} = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/preview_deploy.cjs`,
            );
            await updateDeployComment({
              github, context, inputs: JSON.parse(process.env.DEPLOY_INPUTS),
              validatedSha: process.env.DEPLOY_SHA,
              buildNumber: process.env.DEPLOY_BUILD_NUMBER,
              state: 'in_progress',
              status: '🔒 Lock acquired — deploying',
              androidStatus: '⏳ Deploying phone + Wear OS to Play Internal Testing',
              iosStatus: '⏳ Uploading to TestFlight',
              nextStep: '> Duplicate requests stay locked out while this deploy is queued or running.',
            });

  deploy-android:
    name: Deploy Android
    runs-on: ubuntu-latest
    needs: [validate-pr, compute-version, comment-start]
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.capture-source.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-pr.outputs.deploy-sha }}

      - name: Capture source SHA
        id: capture-source
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37.0 build-tools;36.0.0"

      - name: Isolate Ruby gems
        run: |
          mkdir -p "$RUNNER_TEMP/ruby-gems"
          echo "GEM_HOME=$RUNNER_TEMP/ruby-gems" >> "$GITHUB_ENV"
          echo "GEM_PATH=$RUNNER_TEMP/ruby-gems" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ruby-gems/bin" >> "$GITHUB_PATH"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: Android

      - name: Decode Android deploy credentials
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 scripts/release/credentials.py

      - name: Render private Play listing icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/python" -m pip install \
            -r scripts/release/requirements.txt
          "$RUNNER_TEMP/icons/bin/python" scripts/release/icons.py \
            --variant private \
            --output Android/build/private-listing/metadata/en-US/images/icon.png

      - name: Deploy Android private builds
        working-directory: Android
        env:
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: >-
            ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: >-
            ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          DEPOLLSOFT_PRIVATE_BUILD_NUMBER: >-
            ${{ needs.compute-version.outputs.build-number }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: >-
            ${{ env.PLAY_SERVICE_ACCOUNT_JSON_PATH }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: ruby -S bundle exec fastlane deploy_private

      - name: Clean up Android deploy credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-upload.jks" \
            "$RUNNER_TEMP/release-play.json"

  deploy-ios:
    name: Deploy iOS
    # Xcode 27.1, as iOS CI and releases build with (iPhone Duo layouts need its SDK).
    runs-on: xcode-27
    needs: [validate-pr, compute-version, comment-start]
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.capture-source.outputs.value }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-pr.outputs.deploy-sha }}

      - name: Capture source SHA
        id: capture-source
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          developer_dir=/Applications/Xcode_27.1.app/Contents/Developer
          if [ ! -d "$developer_dir" ]; then
            echo "Xcode 27.1 is not installed on this runner." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iOS

      - name: Cache SPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            iOS/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: deploy-spm-v2-${{ runner.os }}-${{ hashFiles('iOS/iOS.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            deploy-spm-v2-${{ runner.os }}-

      - name: Resolve SPM dependencies
        working-directory: iOS
        run: |
          for _ in 1 2; do
            xcodebuild -resolvePackageDependencies \
              -workspace iOS.xcworkspace \
              -scheme pitchperfect \
              -clonedSourcePackagesDirPath SourcePackages
            missing=0
            for artifact in \
              facebook-ios-sdk/FBSDKCoreKit/FBSDKCoreKit.xcframework \
              facebook-ios-sdk/FBSDKCoreKit_Basics/FBSDKCoreKit_Basics.xcframework \
              facebook-ios-sdk/FBAEMKit/FBAEMKit.xcframework \
              facebook-ios-sdk/FBSDKLoginKit/FBSDKLoginKit.xcframework \
              firebase-ios-sdk/FirebaseFirestoreInternal/FirebaseFirestoreInternal.xcframework \
              swift-package-manager-google-mobile-ads/GoogleMobileAds/GoogleMobileAds.xcframework \
              swift-package-manager-google-user-messaging-platform/UserMessagingPlatform/UserMessagingPlatform.xcframework \
              grpc-binary/grpc/grpc.xcframework \
              grpc-binary/grpcpp/grpcpp.xcframework \
              grpc-binary/openssl_grpc/openssl_grpc.xcframework \
              abseil-cpp-binary/absl/absl.xcframework; do
              if [ ! -f "SourcePackages/artifacts/$artifact/Info.plist" ]; then
                echo "Missing SPM binary artifact: $artifact"
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              exit 0
            fi
            echo "SPM binary artifacts are incomplete; resolving cleanly."
            rm -rf SourcePackages
          done
          echo "SPM binary artifacts are still missing after a clean resolve." >&2
          exit 1

      - name: Configure iOS signing repo auth
        working-directory: iOS
        env:
          MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
          MATCH_GIT_BASIC_AUTHORIZATION: >-
            ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_REPOSITORY_ARCHIVE_PART_1: >-
            ${{ secrets.MATCH_REPOSITORY_ARCHIVE_PART_1 }}
          MATCH_REPOSITORY_ARCHIVE_PART_2: >-
            ${{ secrets.MATCH_REPOSITORY_ARCHIVE_PART_2 }}
        run: |
          if [ -n "${MATCH_REPOSITORY_ARCHIVE_PART_1:-}" ] && \
            [ -n "${MATCH_REPOSITORY_ARCHIVE_PART_2:-}" ]; then
            repo_path="$RUNNER_TEMP/match-repository-$GITHUB_RUN_ID"
            archive_path="$RUNNER_TEMP/match-repository-$GITHUB_RUN_ID.tgz"
            rm -rf "$repo_path" "$archive_path"
            mkdir -p "$repo_path"
            python3 - <<'PY'
          import base64
          import os

          encoded = (
              os.environ["MATCH_REPOSITORY_ARCHIVE_PART_1"]
              + os.environ["MATCH_REPOSITORY_ARCHIVE_PART_2"]
          )
          with open(
              os.path.join(
                  os.environ["RUNNER_TEMP"],
                  f"match-repository-{os.environ['GITHUB_RUN_ID']}.tgz",
              ),
              "wb",
          ) as archive:
              archive.write(base64.b64decode(encoded, validate=True))
          PY
            tar -xzf "$archive_path" -C "$repo_path"
            git -C "$repo_path" init -b master
            git -C "$repo_path" config user.name "github-actions[bot]"
            git -C "$repo_path" config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$repo_path" config receive.denyCurrentBranch updateInstead
            git -C "$repo_path" add .
            git -C "$repo_path" commit -m "Restore encrypted signing assets"
            {
              echo "MATCH_REPOSITORY_PATH=$repo_path"
              echo "MATCH_REPOSITORY_ARCHIVE_PATH=$archive_path"
              echo "MATCH_GIT_URL=file://$repo_path"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -n "${MATCH_GIT_SSH_KEY:-}" ]; then
            key_path="$RUNNER_TEMP/match-git-key"
            printf '%s\n' "$MATCH_GIT_SSH_KEY" > "$key_path"
            chmod 600 "$key_path"
            mkdir -p ~/.ssh
            ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts
            ssh_opts="-o Hostname=ssh.github.com -p 443 -o IdentitiesOnly=yes"
            ssh_opts="$ssh_opts -o StrictHostKeyChecking=yes"
            git_ssh_command="ssh -i $key_path $ssh_opts"
            if GIT_SSH_COMMAND="$git_ssh_command" git ls-remote \
              git@github.com:depollsoft/certificates.git HEAD >/dev/null; then
              echo "GIT_SSH_COMMAND=$git_ssh_command" >> "$GITHUB_ENV"
              echo "MATCH_GIT_URL=git@github.com:depollsoft/certificates.git" \
                >> "$GITHUB_ENV"
              exit 0
            fi
            echo "SSH signing-repository authentication failed; trying HTTPS."
          fi

          if [ -z "${MATCH_GIT_BASIC_AUTHORIZATION:-}" ]; then
            echo "MATCH_GIT_SSH_KEY or MATCH_GIT_BASIC_AUTHORIZATION secret" \
              "must grant read access to the private signing repository."
            exit 1
          fi

          auth_url="$(python3 - <<'PY'
          import base64
          import binascii
          import os
          import urllib.parse

          def strip_basic_prefix(value):
              value = value.strip()
              lower = value.lower()
              for prefix in ("authorization: basic ", "basic "):
                  if lower.startswith(prefix):
                      return value[len(prefix):].strip()
              return value

          raw = strip_basic_prefix(os.environ["MATCH_GIT_BASIC_AUTHORIZATION"])

          try:
              decoded = base64.b64decode(raw, validate=True).decode("utf-8")
          except (binascii.Error, UnicodeDecodeError):
              decoded = ""
          decoded = strip_basic_prefix(decoded) if decoded else ""

          if ":" in decoded:
              credential = decoded
          elif ":" in raw:
              credential = raw
          else:
              credential = f"x-access-token:{raw}"

          username, password = credential.split(":", 1)
          username = urllib.parse.quote(username, safe="")
          password = urllib.parse.quote(password, safe="")
          print(
              f"https://{username}:{password}"
              "@github.com/depollsoft/certificates.git"
          )
          PY
          )"
          echo "::add-mask::$auth_url"
          echo "MATCH_GIT_URL=$auth_url" >> "$GITHUB_ENV"

      - name: Deploy iOS private builds
        working-directory: iOS
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          DEPOLLSOFT_PRIVATE_BUILD_NUMBER: >-
            ${{ needs.compute-version.outputs.build-number }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_FORCE_REGENERATE: ${{ secrets.MATCH_FORCE_REGENERATE }}
          TESTFLIGHT_TESTER_EMAIL: ${{ secrets.TESTFLIGHT_TESTER_EMAIL }}
          PR_NUMBER: ${{ inputs.pr-number }}
          PR_TITLE: ${{ needs.validate-pr.outputs.pr-title }}
        run: bundle exec fastlane deploy_private

      - name: Package refreshed iOS signing repository
        if: always()
        run: |
          if [ -d "${MATCH_REPOSITORY_PATH:-}" ]; then
            tar -C "$MATCH_REPOSITORY_PATH" --exclude=.git -czf \
              "$RUNNER_TEMP/refreshed-match-repository.tgz" .
          fi

      - name: Upload refreshed iOS signing repository
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refreshed-match-repository
          path: ${{ runner.temp }}/refreshed-match-repository.tgz
          if-no-files-found: ignore
          retention-days: 1

      - name: Clean up iOS signing repository
        if: always()
        run: |
          rm -rf "${MATCH_REPOSITORY_PATH:-}" \
            "${MATCH_REPOSITORY_ARCHIVE_PATH:-}" \
            "$RUNNER_TEMP/refreshed-match-repository.tgz"

  verify-pr-source:
    name: Verify PR source ref
    needs: [validate-pr, deploy-android, deploy-ios]
    if: >-
      needs.validate-pr.result == 'success' &&
      needs.deploy-android.result == 'success' &&
      needs.deploy-ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure deployed mobile builds used requested preview SHA
        env:
          EXPECTED_SHA: ${{ needs.validate-pr.outputs.deploy-sha }}
          ACTUAL_IOS_SHA: ${{ needs.deploy-ios.outputs.source-sha }}
          ACTUAL_ANDROID_SHA: ${{ needs.deploy-android.outputs.source-sha }}
        run: |
          if [ "$EXPECTED_SHA" != "$ACTUAL_ANDROID_SHA" ]; then
            echo "Expected deploy SHA:      $EXPECTED_SHA"
            echo "Actual Android deploy SHA: $ACTUAL_ANDROID_SHA"
            echo "Play internal deploy did not build from the requested" \
              "preview SHA for PR #${{ inputs.pr-number }}."
            exit 1
          fi

          if [ "$EXPECTED_SHA" != "$ACTUAL_IOS_SHA" ]; then
            echo "Expected deploy SHA: $EXPECTED_SHA"
            echo "Actual iOS deploy SHA: $ACTUAL_IOS_SHA"
            echo "TestFlight deploy did not build from the requested preview" \
              "SHA for PR #${{ inputs.pr-number }}."
            exit 1
          fi

          echo "Verified Android and iOS deploy source SHA matches" \
            "requested preview SHA: $EXPECTED_SHA"

  comment-finish:
    name: Update PR deploy comment (finish)
    runs-on: ubuntu-latest
    needs:
      - validate-pr
      - compute-version
      - comment-start
      - deploy-android
      - deploy-ios
      - verify-pr-source
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Read helper code from this workflow's revision, never the requested PR SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/preview_deploy.cjs
          sparse-checkout-cone-mode: false

      - name: Mark deploy as complete
        env:
          DEPLOY_INPUTS: ${{ toJSON(inputs) }}
          DEPLOY_SHA: ${{ needs.validate-pr.outputs.deploy-sha }}
          DEPLOY_BUILD_NUMBER: ${{ needs.compute-version.outputs.build-number }}
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const {updateDeployComment} = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/preview_deploy.cjs`,
            );
            const syncRequestCommentReaction = async (
              requestCommentId,
              targetReaction,
            ) => {
              if (!requestCommentId) {
                return;
              }

              const commentId = Number(requestCommentId);
              const reactions = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/comments' +
                  '/{comment_id}/reactions',
                {
                  owner,
                  repo,
                  comment_id: commentId,
                  per_page: 100,
                  headers: {accept: 'application/vnd.github+json'},
                },
              );
              const managedReactionContents = new Set(['eyes', 'rocket', '-1']);
              const botManagedReactions = reactions.filter(
                (reaction) =>
                  managedReactionContents.has(reaction.content) &&
                  reaction.user?.login === 'github-actions[bot]',
              );

              for (const reaction of botManagedReactions) {
                await github.request(
                  'DELETE /repos/{owner}/{repo}/issues/comments' +
                    '/{comment_id}/reactions/{reaction_id}',
                  {
                    owner,
                    repo,
                    comment_id: commentId,
                    reaction_id: reaction.id,
                    headers: {accept: 'application/vnd.github+json'},
                  },
                );
              }

              if (!targetReaction) {
                return;
              }

              await github.request(
                'POST /repos/{owner}/{repo}/issues/comments' +
                  '/{comment_id}/reactions',
                {
                  owner,
                  repo,
                  comment_id: commentId,
                  content: targetReaction,
                  headers: {accept: 'application/vnd.github+json'},
                },
              );
            };

            const statusForPlatform = (result, successLabel) => {
              switch (result) {
                case 'success':
                  return successLabel;
                case 'skipped':
                  return '⏭️ Skipped';
                case 'cancelled':
                  return '⛔ Cancelled';
                default:
                  return '❌ Failed';
              }
            };

            const validationResult = '${{ needs.validate-pr.result }}';
            const androidResult = '${{ needs.deploy-android.result }}';
            const iosResult = '${{ needs.deploy-ios.result }}';
            const verifyResult = '${{ needs.verify-pr-source.result }}';

            let state = 'failed';
            let status = '❌ Deploy failed';

            if (
              validationResult === 'success' &&
              androidResult === 'success' &&
              iosResult === 'success' &&
              verifyResult === 'success'
            ) {
              state = 'success';
              status =
                '✅ Deployed to TestFlight & Play Internal Testing ' +
                '(phone + Wear OS)';
            } else if (
              validationResult === 'cancelled' ||
              androidResult === 'cancelled' ||
              iosResult === 'cancelled'
            ) {
              state = 'cancelled';
              status = '⛔ Deploy cancelled';
            } else if (validationResult !== 'success') {
              status = '❌ PR validation failed';
            } else if (androidResult !== 'success' || iosResult !== 'success') {
              status = '❌ Build or store deploy failed';
            } else if (verifyResult !== 'success') {
              status =
                '❌ Deployed artifacts did not match the requested ' +
                'preview SHA';
            }

            let targetReaction = '';
            if (state === 'success') {
              targetReaction = 'rocket';
            } else if (state === 'failed') {
              targetReaction = '-1';
            }

            const androidPlatformStatus =
              validationResult !== 'success'
                ? '⏭️ Not started'
                : statusForPlatform(
                    androidResult,
                    '✅ Uploaded phone + Wear OS to Play Internal Testing',
                  );
            const iosPlatformStatus =
              validationResult !== 'success'
                ? '⏭️ Not started'
                : statusForPlatform(iosResult, '✅ Uploaded to TestFlight');

            const {requestCommentId} = await updateDeployComment({
              github, context, inputs: JSON.parse(process.env.DEPLOY_INPUTS),
              validatedSha: process.env.DEPLOY_SHA,
              buildNumber: process.env.DEPLOY_BUILD_NUMBER,
              state, status,
              androidStatus: androidPlatformStatus,
              iosStatus: iosPlatformStatus,
              nextStep: '> Add a new \`/deploy\` comment if you want to request another deploy.',
            });

            try {
              await syncRequestCommentReaction(
                requestCommentId,
                targetReaction,
              );
            } catch (error) {
              core.warning(
                `Failed to update deploy reaction: ${String(error)}`,
              );
            }
