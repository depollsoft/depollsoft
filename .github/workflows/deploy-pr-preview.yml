name: Deploy PR Preview

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to deploy"
        required: true
        type: string
      source-sha:
        description: >-
          Specific PR commit SHA to deploy (defaults to current PR head)
        required: false
        default: ""
        type: string
      preview-build-number:
        description: "Preview build number associated with the requested SHA"
        required: false
        default: ""
        type: string
      request-comment-id:
        description: "Issue comment ID that requested the deploy"
        required: false
        default: ""
        type: string
      request-comment-at:
        description: >-
          Timestamp of the /deploy comment that requested the deploy
        required: false
        default: ""
        type: string
      request-comment-user:
        description: "GitHub login that requested the deploy"
        required: false
        default: ""
        type: string
      request-comment-url:
        description: "URL of the /deploy comment that requested the deploy"
        required: false
        default: ""
        type: string
      request-preview-comment-url:
        description: "URL of the sticky preview comment for the requested build"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-private
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate-pr:
    name: Validate PR source
    runs-on: [self-hosted, Linux]
    permissions:
      pull-requests: read
    outputs:
      pr-head-sha: ${{ steps.validate.outputs.pr-head-sha }}
      deploy-sha: ${{ steps.validate.outputs.deploy-sha }}
      pr-title: ${{ steps.validate.outputs.pr-title }}
    steps:
      - name: Validate PR is safe to deploy
        id: validate
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number('${{ inputs.pr-number }}');
            const requestedSourceSha = '${{ inputs.source-sha }}'.trim();
            const {data: pr} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed(
                `Refusing to deploy PR #${pullNumber} ` +
                  `from fork ${pr.head.repo?.full_name}. ` +
                  `Manual PR preview deploys require a branch in ` +
                  `${owner}/${repo}.`,
              );
              return;
            }

            let deploySha = pr.head.sha;
            if (requestedSourceSha) {
              const commits = await github.paginate(
                github.rest.pulls.listCommits,
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100,
                },
              );

              if (
                !commits.some((commit) => commit.sha === requestedSourceSha)
              ) {
                core.setFailed(
                  `Requested source SHA ${requestedSourceSha} ` +
                    `is not part of PR #${pullNumber}.`,
                );
                return;
              }

              deploySha = requestedSourceSha;
            }

            core.setOutput('pr-head-sha', pr.head.sha);
            core.setOutput('deploy-sha', deploySha);
            core.setOutput('pr-title', pr.title);

  compute-version:
    name: Compute Deploy Build
    runs-on: [self-hosted, Linux]
    needs: validate-pr
    if: needs.validate-pr.result == 'success'
    permissions:
      issues: read
    outputs:
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - id: version
        env:
          REQUESTED_PREVIEW_BUILD_NUMBER: ${{ inputs.preview-build-number }}
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requestedBuildNumberText = (
              process.env.REQUESTED_PREVIEW_BUILD_NUMBER || ''
            ).trim();
            const requestedBuildNumber = /^\d+$/.test(requestedBuildNumberText)
              ? Number(requestedBuildNumberText)
              : 0;
            const currentBuildNumber = Math.floor(Date.now() / 1000 / 10);
            const statusMarker = '<!-- preview-deploy-status -->';
            const lookbackSince = new Date(
              Date.now() - 180 * 24 * 60 * 60 * 1000,
            ).toISOString();

            const readMeta = (body, key) => {
              const pattern = new RegExp(`<!-- ${key}:(.*?) -->`);
              return body.match(pattern)?.[1] ?? '';
            };

            const comments = await github.paginate(
              github.rest.issues.listCommentsForRepo,
              {
                owner,
                repo,
                per_page: 100,
                since: lookbackSince,
              },
            );

            let previousDeployBuildNumber = 0;
            for (const comment of comments) {
              if (!comment.body?.includes(statusMarker)) {
                continue;
              }

              const buildNumber = Number(
                readMeta(comment.body, 'preview-deploy-build-number'),
              );
              if (Number.isFinite(buildNumber)) {
                previousDeployBuildNumber = Math.max(
                  previousDeployBuildNumber,
                  buildNumber,
                );
              }
            }

            let buildNumber = Math.max(
              requestedBuildNumber,
              currentBuildNumber,
            );
            if (buildNumber <= previousDeployBuildNumber) {
              buildNumber = Math.max(
                currentBuildNumber,
                previousDeployBuildNumber + 1,
              );
            }

            core.setOutput('build-number', String(buildNumber));

  comment-start:
    name: Update PR deploy comment (start)
    runs-on: [self-hosted, Linux]
    needs: [validate-pr, compute-version]
    if: needs.validate-pr.result == 'success'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark deploy as running
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number('${{ inputs.pr-number }}');
            const runUrl =
              `https://github.com/${owner}/${repo}` +
              `/actions/runs/${context.runId}`;
            const previewMarker =
              '<!-- Sticky Pull Request Commentpreview-build -->';
            const statusMarker = '<!-- preview-deploy-status -->';

            const readMeta = (body, key) => {
              const pattern = new RegExp(`<!-- ${key}:(.*?) -->`);
              return body.match(pattern)?.[1] ?? '';
            };

            const findStatusComment = (comments, targetRequestKey) =>
              [...comments].reverse().find(
                (comment) =>
                  comment.body?.includes(statusMarker) &&
                  readMeta(comment.body, 'preview-deploy-request-key') ===
                    targetRequestKey,
              );

            const resolvePreviewCommentUrl = ({
              comments,
              deploySha,
              fallbackUrl,
            }) => {
              const latestPreviewComment = [...comments]
                .reverse()
                .find((comment) => {
                  if (!comment.body?.includes(previewMarker)) {
                    return false;
                  }

                  if (!deploySha) {
                    return true;
                  }

                  return (
                    readMeta(comment.body, 'preview-build-source-sha') ===
                    deploySha
                  );
                });

              return latestPreviewComment?.html_url ?? fallbackUrl;
            };

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            const requestCommentIdInput =
              '${{ inputs.request-comment-id }}'.trim();
            const requestKey = requestCommentIdInput
              ? `comment-${requestCommentIdInput}`
              : `workflow-${context.runId}`;
            const existing = findStatusComment(comments, requestKey);
            const existingBody = existing?.body ?? '';

            const requestedBy =
              '${{ inputs.request-comment-user }}' ||
              readMeta(existingBody, 'preview-deploy-requested-by') ||
              '${{ github.actor }}';
            const requestedAt =
              '${{ inputs.request-comment-at }}' ||
              readMeta(existingBody, 'preview-deploy-requested-at');
            const requestCommentId =
              requestCommentIdInput ||
              readMeta(existingBody, 'preview-deploy-last-command-comment-id');
            const requestCommentUrl =
              '${{ inputs.request-comment-url }}' ||
              readMeta(existingBody, 'preview-deploy-request-comment-url');
            const requestedPreviewCommentUrl =
              '${{ inputs.request-preview-comment-url }}' ||
              readMeta(existingBody, 'preview-deploy-preview-comment-url');
            const requestedPreviewBuildNumber =
              '${{ inputs.preview-build-number }}' ||
              readMeta(existingBody, 'preview-deploy-requested-build-number');
            const deploySha =
              '${{ needs.validate-pr.outputs.deploy-sha }}' ||
              readMeta(existingBody, 'preview-deploy-source-sha') ||
              '${{ inputs.source-sha }}';
            const deployBuildNumber =
              '${{ needs.compute-version.outputs.build-number }}' ||
              readMeta(existingBody, 'preview-deploy-build-number');
            const previewCommentUrl = resolvePreviewCommentUrl({
              comments,
              deploySha,
              fallbackUrl: requestedPreviewCommentUrl,
            });
            const requestDetails = requestCommentId
              ? `@${requestedBy} via \`/deploy\` comment`
              : `@${requestedBy} via workflow dispatch`;
            const buildNumberNote =
              requestedPreviewBuildNumber &&
              deployBuildNumber &&
              requestedPreviewBuildNumber !== deployBuildNumber
                ? '> Deploy build number was bumped to preserve ' +
                  'monotonic store build numbers.'
                : null;

            const body = [
              '## 🚀 Preview Deploy',
              '',
              '| | Details |',
              '|---|---|',
              '| **Status** | 🔒 Lock acquired — deploying |',
              `| **Requested by** | ${requestDetails} |`,
              deploySha ? `| **Preview SHA** | \`${deploySha}\` |` : null,
              requestedPreviewBuildNumber
                ? '| **Requested Preview Build** | ' +
                  `\`${requestedPreviewBuildNumber}\` |`
                : null,
              deployBuildNumber
                ? `| **Deploy Build** | \`${deployBuildNumber}\` |`
                : null,
              '| **Android Status** | ⏳ Deploying to Play Internal Testing |',
              '| **iOS Status** | ⏳ Uploading to TestFlight |',
              requestCommentUrl
                ? '| **Request** | ' +
                  `[View /deploy comment](${requestCommentUrl}) |`
                : null,
              previewCommentUrl
                ? '| **Preview Comment** | ' +
                  `[View preview artifacts](${previewCommentUrl}) |`
                : null,
              requestedAt ? `| **Requested at** | ${requestedAt} |` : null,
              `| **Workflow** | [View deploy run](${runUrl}) |`,
              '',
              buildNumberNote,
              '> Duplicate requests stay locked out while this deploy is ' +
                'queued or running.',
              statusMarker,
              '<!-- preview-deploy-state:in_progress -->',
              '<!-- preview-deploy-last-command-comment-id:' +
                `${requestCommentId} -->`,
              `<!-- preview-deploy-request-key:${requestKey} -->`,
              `<!-- preview-deploy-requested-by:${requestedBy} -->`,
              `<!-- preview-deploy-requested-at:${requestedAt} -->`,
              '<!-- preview-deploy-request-comment-url:' +
                `${requestCommentUrl} -->`,
              '<!-- preview-deploy-preview-comment-url:' +
                `${previewCommentUrl} -->`,
              `<!-- preview-deploy-workflow-url:${runUrl} -->`,
              `<!-- preview-deploy-source-sha:${deploySha} -->`,
              `<!-- preview-deploy-build-number:${deployBuildNumber} -->`,
              '<!-- preview-deploy-requested-build-number:' +
                `${requestedPreviewBuildNumber} -->`,
            ]
              .filter(Boolean)
              .join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

  deploy-android:
    name: Deploy Android
    runs-on: [self-hosted, Linux]
    needs: [validate-pr, compute-version, comment-start]
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.capture-source.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-pr.outputs.deploy-sha }}
          submodules: recursive

      - name: Capture source SHA
        id: capture-source
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;36.0.0"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: Android

      - name: Decode Android deploy credentials
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          export ANDROID_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          play_json_path="$RUNNER_TEMP/play-service-account.json"
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="$play_json_path"
          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import sys

          keystore = os.environ.get("ANDROID_UPLOAD_KEYSTORE", "").strip()
          if not keystore:
              print("ANDROID_UPLOAD_KEYSTORE secret is empty.", file=sys.stderr)
              sys.exit(1)

          try:
              keystore_bytes = base64.b64decode(
                  "".join(keystore.split()),
                  validate=True,
              )
          except binascii.Error:
              print(
                  "ANDROID_UPLOAD_KEYSTORE must be valid base64.",
                  file=sys.stderr,
              )
              sys.exit(1)

          with open(os.environ["ANDROID_UPLOAD_KEYSTORE_PATH"], "wb") as handle:
              handle.write(keystore_bytes)

          raw = os.environ.get("PLAY_SERVICE_ACCOUNT_JSON", "").strip()
          if not raw:
              print(
                  "PLAY_SERVICE_ACCOUNT_JSON secret is empty.",
                  file=sys.stderr,
              )
              sys.exit(1)

          parsed = None
          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError:
              try:
                  decoded = base64.b64decode(raw).decode("utf-8")
                  parsed = json.loads(decoded)
              except (binascii.Error, UnicodeDecodeError, json.JSONDecodeError):
                  print(
                      "PLAY_SERVICE_ACCOUNT_JSON must contain raw JSON or "
                      "base64-encoded JSON.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          output_path = os.environ["PLAY_SERVICE_ACCOUNT_JSON_PATH"]
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump(parsed, handle)
          PY
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$ANDROID_UPLOAD_KEYSTORE_PATH" \
            >> "$GITHUB_ENV"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$play_json_path" \
            >> "$GITHUB_ENV"

      - name: Deploy Android private builds
        working-directory: Android
        env:
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: >-
            ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: >-
            ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          DEPOLLSOFT_PRIVATE_BUILD_NUMBER: >-
            ${{ needs.compute-version.outputs.build-number }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: >-
            ${{ env.PLAY_SERVICE_ACCOUNT_JSON_PATH }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: bundle exec fastlane deploy_private

      - name: Clean up Android deploy credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/upload-keystore.jks" \
            "$RUNNER_TEMP/play-service-account.json"

  deploy-ios:
    name: Deploy iOS
    runs-on: [self-hosted, macOS]
    needs: [validate-pr, compute-version, comment-start]
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.capture-source.outputs.value }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-pr.outputs.deploy-sha }}
          submodules: recursive

      - name: Capture source SHA
        id: capture-source
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          developer_dir=/Applications/Xcode.app/Contents/Developer
          if [ ! -d "$developer_dir" ]; then
            developer_dir="$(xcode-select -p 2>/dev/null || true)"
          fi
          if [ -z "$developer_dir" ] || [ ! -d "$developer_dir" ]; then
            echo "No usable Xcode installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iOS

      - name: Install CocoaPods
        working-directory: iOS
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: pod install"
            if bundle exec pod install; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Configure iOS signing repo auth
        working-directory: iOS
        env:
          MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
          MATCH_GIT_BASIC_AUTHORIZATION: >-
            ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -n "${MATCH_GIT_SSH_KEY:-}" ]; then
            key_path="$RUNNER_TEMP/match-git-key"
            printf '%s\n' "$MATCH_GIT_SSH_KEY" > "$key_path"
            chmod 600 "$key_path"
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            ssh_opts="-o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            echo "GIT_SSH_COMMAND=ssh -i $key_path $ssh_opts" >> "$GITHUB_ENV"
            echo "MATCH_GIT_URL=git@github.com:depollsoft/certificates.git" \
              >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "${MATCH_GIT_BASIC_AUTHORIZATION:-}" ]; then
            echo "MATCH_GIT_SSH_KEY or MATCH_GIT_BASIC_AUTHORIZATION secret" \
              "is required to clone the private signing repository."
            exit 1
          fi

          auth_url="$(python3 - <<'PY'
          import base64
          import binascii
          import os
          import urllib.parse

          def strip_basic_prefix(value):
              value = value.strip()
              lower = value.lower()
              for prefix in ("authorization: basic ", "basic "):
                  if lower.startswith(prefix):
                      return value[len(prefix):].strip()
              return value

          raw = strip_basic_prefix(os.environ["MATCH_GIT_BASIC_AUTHORIZATION"])

          try:
              decoded = base64.b64decode(raw, validate=True).decode("utf-8")
          except (binascii.Error, UnicodeDecodeError):
              decoded = ""
          decoded = strip_basic_prefix(decoded) if decoded else ""

          if ":" in decoded:
              credential = decoded
          elif ":" in raw:
              credential = raw
          else:
              credential = f"x-access-token:{raw}"

          username, password = credential.split(":", 1)
          username = urllib.parse.quote(username, safe="")
          password = urllib.parse.quote(password, safe="")
          print(
              f"https://{username}:{password}"
              "@github.com/depollsoft/certificates.git"
          )
          PY
          )"
          echo "::add-mask::$auth_url"
          echo "MATCH_GIT_URL=$auth_url" >> "$GITHUB_ENV"

      - name: Deploy iOS private builds
        working-directory: iOS
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          DEPOLLSOFT_PRIVATE_BUILD_NUMBER: >-
            ${{ needs.compute-version.outputs.build-number }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          PR_NUMBER: ${{ inputs.pr-number }}
          PR_TITLE: ${{ needs.validate-pr.outputs.pr-title }}
        run: bundle exec fastlane deploy_private

  verify-pr-source:
    name: Verify PR source ref
    needs: [validate-pr, deploy-android, deploy-ios]
    if: >-
      needs.validate-pr.result == 'success' &&
      needs.deploy-android.result == 'success' &&
      needs.deploy-ios.result == 'success'
    runs-on: [self-hosted, Linux]
    steps:
      - name: Ensure deployed mobile builds used requested preview SHA
        env:
          EXPECTED_SHA: ${{ needs.validate-pr.outputs.deploy-sha }}
          ACTUAL_IOS_SHA: ${{ needs.deploy-ios.outputs.source-sha }}
          ACTUAL_ANDROID_SHA: ${{ needs.deploy-android.outputs.source-sha }}
        run: |
          if [ "$EXPECTED_SHA" != "$ACTUAL_ANDROID_SHA" ]; then
            echo "Expected deploy SHA:      $EXPECTED_SHA"
            echo "Actual Android deploy SHA: $ACTUAL_ANDROID_SHA"
            echo "Play internal deploy did not build from the requested" \
              "preview SHA for PR #${{ inputs.pr-number }}."
            exit 1
          fi

          if [ "$EXPECTED_SHA" != "$ACTUAL_IOS_SHA" ]; then
            echo "Expected deploy SHA: $EXPECTED_SHA"
            echo "Actual iOS deploy SHA: $ACTUAL_IOS_SHA"
            echo "TestFlight deploy did not build from the requested preview" \
              "SHA for PR #${{ inputs.pr-number }}."
            exit 1
          fi

          echo "Verified Android and iOS deploy source SHA matches" \
            "requested preview SHA: $EXPECTED_SHA"

  comment-finish:
    name: Update PR deploy comment (finish)
    runs-on: [self-hosted, Linux]
    needs:
      - validate-pr
      - compute-version
      - comment-start
      - deploy-android
      - deploy-ios
      - verify-pr-source
    if: always()
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark deploy as complete
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number('${{ inputs.pr-number }}');
            const runUrl =
              `https://github.com/${owner}/${repo}` +
              `/actions/runs/${context.runId}`;
            const previewMarker =
              '<!-- Sticky Pull Request Commentpreview-build -->';
            const statusMarker = '<!-- preview-deploy-status -->';

            const readMeta = (body, key) => {
              const pattern = new RegExp(`<!-- ${key}:(.*?) -->`);
              return body.match(pattern)?.[1] ?? '';
            };

            const findStatusComment = (comments, targetRequestKey) =>
              [...comments].reverse().find(
                (comment) =>
                  comment.body?.includes(statusMarker) &&
                  readMeta(comment.body, 'preview-deploy-request-key') ===
                    targetRequestKey,
              );

            const resolvePreviewCommentUrl = ({
              comments,
              deploySha,
              fallbackUrl,
            }) => {
              const latestPreviewComment = [...comments]
                .reverse()
                .find((comment) => {
                  if (!comment.body?.includes(previewMarker)) {
                    return false;
                  }

                  if (!deploySha) {
                    return true;
                  }

                  return (
                    readMeta(comment.body, 'preview-build-source-sha') ===
                    deploySha
                  );
                });

              return latestPreviewComment?.html_url ?? fallbackUrl;
            };

            const syncRequestCommentReaction = async (
              requestCommentId,
              targetReaction,
            ) => {
              if (!requestCommentId) {
                return;
              }

              const commentId = Number(requestCommentId);
              const reactions = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/comments' +
                  '/{comment_id}/reactions',
                {
                  owner,
                  repo,
                  comment_id: commentId,
                  per_page: 100,
                  headers: {accept: 'application/vnd.github+json'},
                },
              );
              const managedReactionContents = new Set(['eyes', 'rocket', '-1']);
              const botManagedReactions = reactions.filter(
                (reaction) =>
                  managedReactionContents.has(reaction.content) &&
                  reaction.user?.login === 'github-actions[bot]',
              );

              for (const reaction of botManagedReactions) {
                await github.request(
                  'DELETE /repos/{owner}/{repo}/issues/comments' +
                    '/{comment_id}/reactions/{reaction_id}',
                  {
                    owner,
                    repo,
                    comment_id: commentId,
                    reaction_id: reaction.id,
                    headers: {accept: 'application/vnd.github+json'},
                  },
                );
              }

              if (!targetReaction) {
                return;
              }

              await github.request(
                'POST /repos/{owner}/{repo}/issues/comments' +
                  '/{comment_id}/reactions',
                {
                  owner,
                  repo,
                  comment_id: commentId,
                  content: targetReaction,
                  headers: {accept: 'application/vnd.github+json'},
                },
              );
            };

            const statusForPlatform = (result, successLabel) => {
              switch (result) {
                case 'success':
                  return successLabel;
                case 'skipped':
                  return '⏭️ Skipped';
                case 'cancelled':
                  return '⛔ Cancelled';
                default:
                  return '❌ Failed';
              }
            };

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            const requestCommentIdInput =
              '${{ inputs.request-comment-id }}'.trim();
            const requestKey = requestCommentIdInput
              ? `comment-${requestCommentIdInput}`
              : `workflow-${context.runId}`;
            const existing = findStatusComment(comments, requestKey);
            const existingBody = existing?.body ?? '';

            const requestedBy =
              '${{ inputs.request-comment-user }}' ||
              readMeta(existingBody, 'preview-deploy-requested-by') ||
              '${{ github.actor }}';
            const requestedAt =
              '${{ inputs.request-comment-at }}' ||
              readMeta(existingBody, 'preview-deploy-requested-at');
            const requestCommentId =
              requestCommentIdInput ||
              readMeta(existingBody, 'preview-deploy-last-command-comment-id');
            const requestCommentUrl =
              '${{ inputs.request-comment-url }}' ||
              readMeta(existingBody, 'preview-deploy-request-comment-url');
            const requestedPreviewCommentUrl =
              '${{ inputs.request-preview-comment-url }}' ||
              readMeta(existingBody, 'preview-deploy-preview-comment-url');
            const requestedPreviewBuildNumber =
              '${{ inputs.preview-build-number }}' ||
              readMeta(existingBody, 'preview-deploy-requested-build-number');
            const deploySha =
              '${{ needs.validate-pr.outputs.deploy-sha }}' ||
              readMeta(existingBody, 'preview-deploy-source-sha') ||
              '${{ inputs.source-sha }}';
            const deployBuildNumber =
              '${{ needs.compute-version.outputs.build-number }}' ||
              readMeta(existingBody, 'preview-deploy-build-number');
            const previewCommentUrl = resolvePreviewCommentUrl({
              comments,
              deploySha,
              fallbackUrl: requestedPreviewCommentUrl,
            });
            const requestDetails = requestCommentId
              ? `@${requestedBy} via \`/deploy\` comment`
              : `@${requestedBy} via workflow dispatch`;
            const buildNumberNote =
              requestedPreviewBuildNumber &&
              deployBuildNumber &&
              requestedPreviewBuildNumber !== deployBuildNumber
                ? '> Deploy build number was bumped to preserve ' +
                  'monotonic store build numbers.'
                : null;

            const validationResult = '${{ needs.validate-pr.result }}';
            const androidResult = '${{ needs.deploy-android.result }}';
            const iosResult = '${{ needs.deploy-ios.result }}';
            const verifyResult = '${{ needs.verify-pr-source.result }}';

            let state = 'failed';
            let status = '❌ Deploy failed';

            if (
              validationResult === 'success' &&
              androidResult === 'success' &&
              iosResult === 'success' &&
              verifyResult === 'success'
            ) {
              state = 'success';
              status = '✅ Deployed to TestFlight & Play Internal Testing';
            } else if (
              validationResult === 'cancelled' ||
              androidResult === 'cancelled' ||
              iosResult === 'cancelled'
            ) {
              state = 'cancelled';
              status = '⛔ Deploy cancelled';
            } else if (validationResult !== 'success') {
              status = '❌ PR validation failed';
            } else if (androidResult !== 'success' || iosResult !== 'success') {
              status = '❌ Build or store deploy failed';
            } else if (verifyResult !== 'success') {
              status =
                '❌ Deployed artifacts did not match the requested ' +
                'preview SHA';
            }

            let targetReaction = '';
            if (state === 'success') {
              targetReaction = 'rocket';
            } else if (state === 'failed') {
              targetReaction = '-1';
            }

            const androidPlatformStatus =
              validationResult !== 'success'
                ? '⏭️ Not started'
                : statusForPlatform(
                    androidResult,
                    '✅ Uploaded to Play Internal Testing',
                  );
            const iosPlatformStatus =
              validationResult !== 'success'
                ? '⏭️ Not started'
                : statusForPlatform(iosResult, '✅ Uploaded to TestFlight');

            const body = [
              '## 🚀 Preview Deploy',
              '',
              '| | Details |',
              '|---|---|',
              `| **Status** | ${status} |`,
              `| **Requested by** | ${requestDetails} |`,
              deploySha ? `| **Preview SHA** | \`${deploySha}\` |` : null,
              requestedPreviewBuildNumber
                ? '| **Requested Preview Build** | ' +
                  `\`${requestedPreviewBuildNumber}\` |`
                : null,
              deployBuildNumber
                ? `| **Deploy Build** | \`${deployBuildNumber}\` |`
                : null,
              `| **Android Status** | ${androidPlatformStatus} |`,
              `| **iOS Status** | ${iosPlatformStatus} |`,
              requestCommentUrl
                ? '| **Request** | ' +
                  `[View /deploy comment](${requestCommentUrl}) |`
                : null,
              previewCommentUrl
                ? '| **Preview Comment** | ' +
                  `[View preview artifacts](${previewCommentUrl}) |`
                : null,
              requestedAt ? `| **Requested at** | ${requestedAt} |` : null,
              `| **Workflow** | [View deploy run](${runUrl}) |`,
              '',
              buildNumberNote,
              '> Add a new `/deploy` comment if you want to request ' +
                'another deploy.',
              statusMarker,
              `<!-- preview-deploy-state:${state} -->`,
              '<!-- preview-deploy-last-command-comment-id:' +
                `${requestCommentId} -->`,
              `<!-- preview-deploy-request-key:${requestKey} -->`,
              `<!-- preview-deploy-requested-by:${requestedBy} -->`,
              `<!-- preview-deploy-requested-at:${requestedAt} -->`,
              '<!-- preview-deploy-request-comment-url:' +
                `${requestCommentUrl} -->`,
              '<!-- preview-deploy-preview-comment-url:' +
                `${previewCommentUrl} -->`,
              `<!-- preview-deploy-workflow-url:${runUrl} -->`,
              `<!-- preview-deploy-source-sha:${deploySha} -->`,
              `<!-- preview-deploy-build-number:${deployBuildNumber} -->`,
              '<!-- preview-deploy-requested-build-number:' +
                `${requestedPreviewBuildNumber} -->`,
            ]
              .filter(Boolean)
              .join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

            try {
              await syncRequestCommentReaction(
                requestCommentId,
                targetReaction,
              );
            } catch (error) {
              core.warning(
                `Failed to update deploy reaction: ${String(error)}`,
              );
            }
