name: PR App Screenshots

permissions:
  contents: read
  pull-requests: write

on:
  # Run on every push to a PR (same triggers as android.yml and ios.yml)
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - 'iOS/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'
      - 'iOS/**'
  workflow_dispatch:

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      android-pitchperfect: ${{ steps.changes.outputs.android-pitchperfect }}
      android-tagmaster: ${{ steps.changes.outputs.android-tagmaster }}
      ios-pitchperfect: ${{ steps.changes.outputs.ios-pitchperfect }}
      ios-tagmaster: ${{ steps.changes.outputs.ios-tagmaster }}
      any-android: ${{ steps.changes.outputs.any-android }}
      any-ios: ${{ steps.changes.outputs.any-ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android-pitchperfect:
              - 'Android/PitchPerfect/**'
              - 'Android/PitchPerfectLib/**'
              - 'Android/Bindroid/**'
              - 'Android/DepollSoftCommon/**'
            android-tagmaster:
              - 'Android/TagMaster/**'
              - 'Android/Bindroid/**'
              - 'Android/DepollSoftCommon/**'
            ios-pitchperfect:
              - 'iOS/pitchperfect/**'
              - 'iOS/depolllib/**'
            ios-tagmaster:
              - 'iOS/tagmaster/**'
              - 'iOS/depolllib/**'
            any-android:
              - 'Android/**'
            any-ios:
              - 'iOS/**'

  android-screenshots:
    name: Android Screenshots
    needs: detect-changes
    if: needs.detect-changes.outputs.any-android == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45

    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0 emulator system-images;android-30;google_apis;arm64-v8a system-images;android-30;google_apis;x86_64'

      - name: Accept SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-screenshots-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-screenshots-${{ runner.os }}-

      - name: Build apps
        env:
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
        run: |
          APPS_TO_BUILD=""
          if [[ "${{ needs.detect-changes.outputs.android-pitchperfect }}" == "true" ]]; then
            APPS_TO_BUILD="$APPS_TO_BUILD :PitchPerfect:assembleDebug"
          fi
          if [[ "${{ needs.detect-changes.outputs.android-tagmaster }}" == "true" ]]; then
            APPS_TO_BUILD="$APPS_TO_BUILD :TagMaster:assembleDebug"
          fi
          if [[ -z "$APPS_TO_BUILD" ]]; then
            # If only shared libs changed, build both apps
            APPS_TO_BUILD=":PitchPerfect:assembleDebug :TagMaster:assembleDebug"
          fi
          ./gradlew $APPS_TO_BUILD --stacktrace --build-cache --console=plain --no-daemon

      - name: Ensure ADB is healthy
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "${SDK_ROOT}/platform-tools/adb" kill-server 2>/dev/null || true
          pkill -9 -f "adb" 2>/dev/null || true
          sleep 2
          for _ in 1 2 3; do
            if lsof -ti tcp:5037 >/dev/null 2>&1; then
              lsof -ti tcp:5037 | xargs kill -9 2>/dev/null || true
              sleep 1
            fi
          done
          "${SDK_ROOT}/platform-tools/adb" start-server
          "${SDK_ROOT}/platform-tools/adb" devices

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GRADLE_OPTS: "-Xmx2g"
        with:
          api-level: 30
          arch: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
          target: google_apis
          force-avd-creation: false
          avd-name: ci-screenshots-${{ runner.arch }}
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          working-directory: Android
          script: |
            set -euo pipefail
            
            # Wait for boot
            adb wait-for-device
            for i in $(seq 1 90); do
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = "1" ]; then break; fi
              sleep 1
            done
            
            # Dismiss lock screen
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell input keyevent 82 || true
            adb shell wm dismiss-keyguard || true
            
            mkdir -p screenshots
            
            # Screenshot PitchPerfect if changed
            if [[ "${{ needs.detect-changes.outputs.android-pitchperfect }}" == "true" ]] || \
               [[ "${{ needs.detect-changes.outputs.android-tagmaster }}" != "true" ]]; then
              APK_PATH=$(find PitchPerfect/build/outputs/apk/debug -name "*.apk" | head -1)
              if [[ -n "$APK_PATH" ]]; then
                echo "Installing PitchPerfect..."
                adb install -r "$APK_PATH"
                
                # Launch app
                PACKAGE="com.depollsoft.pitchperfect"
                ACTIVITY=$(adb shell cmd package resolve-activity --brief "$PACKAGE" | tail -1)
                adb shell am start -n "$ACTIVITY" || adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
                
                # Wait for app to render
                sleep 8
                
                # Take screenshot
                adb exec-out screencap -p > screenshots/android-pitchperfect.png
                echo "Captured PitchPerfect screenshot"
              fi
            fi
            
            # Screenshot TagMaster if changed
            if [[ "${{ needs.detect-changes.outputs.android-tagmaster }}" == "true" ]] || \
               [[ "${{ needs.detect-changes.outputs.android-pitchperfect }}" != "true" ]]; then
              APK_PATH=$(find TagMaster/build/outputs/apk/debug -name "*.apk" | head -1)
              if [[ -n "$APK_PATH" ]]; then
                echo "Installing TagMaster..."
                adb install -r "$APK_PATH"
                
                # Launch app
                PACKAGE="com.depollsoft.tagmaster"
                ACTIVITY=$(adb shell cmd package resolve-activity --brief "$PACKAGE" | tail -1)
                adb shell am start -n "$ACTIVITY" || adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
                
                # Wait for app to render
                sleep 8
                
                # Take screenshot
                adb exec-out screencap -p > screenshots/android-tagmaster.png
                echo "Captured TagMaster screenshot"
              fi
            fi
            
            ls -la screenshots/

      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: Android/screenshots/*.png
          retention-days: 7
          if-no-files-found: warn

  ios-screenshots:
    name: iOS Screenshots
    needs: detect-changes
    if: needs.detect-changes.outputs.any-ios == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45

    defaults:
      run:
        working-directory: iOS

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        id: select_xcode
        run: |
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            XCODE_PATH="/Applications/Xcode_16.3.app"
          elif [ -d "/Applications/Xcode_16.app" ]; then
            XCODE_PATH="/Applications/Xcode_16.app"
          elif [ -d "/Applications/Xcode.app" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          else
            echo "No Xcode installation found!"
            exit 1
          fi
          DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> $GITHUB_ENV
          echo "Selected Xcode: $XCODE_PATH"

      - name: Get iOS Simulator
        id: simulator
        run: |
          SIMULATOR_INFO=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = data.get('devices', {})
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for device in devices[runtime]:
                if 'iPhone' in device['name'] and device['isAvailable']:
                  parts = runtime.split('iOS-')[-1].split('-')
                  ios_version = '.'.join(parts)
                  print(f\"{device['udid']}|{device['name']}|{ios_version}\")
                  sys.exit(0)
          ")
          UDID=$(echo "$SIMULATOR_INFO" | cut -d'|' -f1)
          NAME=$(echo "$SIMULATOR_INFO" | cut -d'|' -f2)
          VERSION=$(echo "$SIMULATOR_INFO" | cut -d'|' -f3)
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "destination=platform=iOS Simulator,id=$UDID" >> $GITHUB_OUTPUT
          echo "Using simulator: $NAME (iOS $VERSION)"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: iOS/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: |
          if [ ! -d "Pods" ] || [ "Podfile.lock" -nt "Pods/Manifest.lock" ]; then
            pod install --repo-update
          else
            echo "Pods are up to date"
          fi

      - name: Build apps
        run: |
          mkdir -p screenshots
          
          # Build PitchPerfect if changed
          if [[ "${{ needs.detect-changes.outputs.ios-pitchperfect }}" == "true" ]] || \
             [[ "${{ needs.detect-changes.outputs.ios-tagmaster }}" != "true" ]]; then
            echo "Building PitchPerfect..."
            xcodebuild build \
              -workspace iOS.xcworkspace \
              -scheme pitchperfect \
              -destination "${{ steps.simulator.outputs.destination }}" \
              -configuration Debug \
              -derivedDataPath DerivedData/pitchperfect \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty || true
          fi
          
          # Build TagMaster if changed
          if [[ "${{ needs.detect-changes.outputs.ios-tagmaster }}" == "true" ]] || \
             [[ "${{ needs.detect-changes.outputs.ios-pitchperfect }}" != "true" ]]; then
            echo "Building TagMaster..."
            xcodebuild build \
              -workspace iOS.xcworkspace \
              -scheme tagmaster \
              -destination "${{ steps.simulator.outputs.destination }}" \
              -configuration Debug \
              -derivedDataPath DerivedData/tagmaster \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty || true
          fi

      - name: Boot simulator and take screenshots
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          
          # Boot simulator
          xcrun simctl boot "$UDID" 2>/dev/null || true
          
          # Wait for simulator to be ready
          echo "Waiting for simulator to boot..."
          for i in $(seq 1 60); do
            STATE=$(xcrun simctl list devices | grep "$UDID" | grep -o "(Booted)" || true)
            if [ -n "$STATE" ]; then
              echo "Simulator booted after ${i}s"
              break
            fi
            sleep 1
          done
          sleep 5
          
          # Screenshot PitchPerfect if changed
          if [[ "${{ needs.detect-changes.outputs.ios-pitchperfect }}" == "true" ]] || \
             [[ "${{ needs.detect-changes.outputs.ios-tagmaster }}" != "true" ]]; then
            APP_PATH=$(find DerivedData/pitchperfect -name "pitchperfect.app" -type d 2>/dev/null | head -1)
            if [[ -n "$APP_PATH" ]]; then
              echo "Installing PitchPerfect..."
              xcrun simctl install "$UDID" "$APP_PATH"
              
              echo "Launching PitchPerfect..."
              xcrun simctl launch "$UDID" com.depollsoft.pitchperfect || true
              
              sleep 8
              
              echo "Taking PitchPerfect screenshot..."
              xcrun simctl io "$UDID" screenshot screenshots/ios-pitchperfect.png
            fi
          fi
          
          # Screenshot TagMaster if changed
          if [[ "${{ needs.detect-changes.outputs.ios-tagmaster }}" == "true" ]] || \
             [[ "${{ needs.detect-changes.outputs.ios-pitchperfect }}" != "true" ]]; then
            APP_PATH=$(find DerivedData/tagmaster -name "tagmaster.app" -type d 2>/dev/null | head -1)
            if [[ -n "$APP_PATH" ]]; then
              echo "Installing TagMaster..."
              xcrun simctl install "$UDID" "$APP_PATH"
              
              echo "Launching TagMaster..."
              xcrun simctl launch "$UDID" com.depollsoft.tagmaster || true
              
              sleep 8
              
              echo "Taking TagMaster screenshot..."
              xcrun simctl io "$UDID" screenshot screenshots/ios-tagmaster.png
            fi
          fi
          
          # Shutdown simulator
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          
          ls -la screenshots/

      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: iOS/screenshots/*.png
          retention-days: 7
          if-no-files-found: warn

  post-comment:
    name: Post Screenshot Comment
    needs: [detect-changes, android-screenshots, ios-screenshots]
    if: always() && (needs.android-screenshots.result == 'success' || needs.ios-screenshots.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Find associated PR
        id: find_pr
        uses: actions/github-script@v7
        with:
          script: |
            // For pull_request events, use the PR number directly
            if (context.eventName === 'pull_request') {
              core.setOutput('pr_number', context.payload.pull_request.number);
              return;
            }
            
            // For push events, find PRs associated with this commit/branch
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`
            });
            
            if (pulls.length > 0) {
              core.setOutput('pr_number', pulls[0].number);
              console.log(`Found PR #${pulls[0].number} for branch`);
            } else {
              // Try to find PR by commit SHA
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha
              });
              
              const openPr = prs.find(pr => pr.state === 'open');
              if (openPr) {
                core.setOutput('pr_number', openPr.number);
                console.log(`Found PR #${openPr.number} for commit`);
              } else {
                console.log('No open PR found for this push');
                core.setOutput('pr_number', '');
              }
            }

      - name: Download Android screenshots
        if: needs.android-screenshots.result == 'success' && steps.find_pr.outputs.pr_number != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-screenshots
          path: screenshots/android

      - name: Download iOS screenshots
        if: needs.ios-screenshots.result == 'success' && steps.find_pr.outputs.pr_number != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-screenshots
          path: screenshots/ios

      - name: Generate comment
        if: steps.find_pr.outputs.pr_number != ''
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const screenshots = [];
            const screenshotsDir = 'screenshots';
            
            // Helper to find screenshots recursively
            function findScreenshots(dir) {
              if (!fs.existsSync(dir)) return;
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat.isDirectory()) {
                  findScreenshots(filePath);
                } else if (file.endsWith('.png')) {
                  screenshots.push({
                    name: file.replace('.png', ''),
                    path: filePath
                  });
                }
              }
            }
            
            findScreenshots(screenshotsDir);
            
            if (screenshots.length === 0) {
              console.log('No screenshots found');
              core.setOutput('has_screenshots', 'false');
              return;
            }
            
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            let markdown = '## 📸 App Screenshots\n\n';
            markdown += `Screenshots captured from apps running in simulator/emulator.\n`;
            markdown += `[View full artifacts](${artifactUrl})\n\n`;
            
            // Group by platform
            const androidShots = screenshots.filter(s => s.name.startsWith('android-'));
            const iosShots = screenshots.filter(s => s.name.startsWith('ios-'));
            
            if (androidShots.length > 0) {
              markdown += '### Android (Emulator)\n\n';
              markdown += '| ' + androidShots.map(s => s.name.replace('android-', '')).join(' | ') + ' |\n';
              markdown += '| ' + androidShots.map(() => ':---:').join(' | ') + ' |\n';
              markdown += '| ' + androidShots.map(s => `[📱 View](${artifactUrl})`).join(' | ') + ' |\n\n';
            }
            
            if (iosShots.length > 0) {
              markdown += '### iOS (Simulator)\n\n';
              markdown += '| ' + iosShots.map(s => s.name.replace('ios-', '')).join(' | ') + ' |\n';
              markdown += '| ' + iosShots.map(() => ':---:').join(' | ') + ' |\n';
              markdown += '| ' + iosShots.map(s => `[📱 View](${artifactUrl})`).join(' | ') + ' |\n\n';
            }
            
            markdown += `\n---\n*Workflow run: ${context.runId} | Commit: ${context.sha.substring(0, 7)}*`;
            
            core.setOutput('has_screenshots', 'true');
            core.setOutput('comment_body', markdown);
            
            console.log('Generated comment markdown');
            console.log(`Found ${screenshots.length} screenshots`);

      - name: Find existing comment
        if: steps.generate.outputs.has_screenshots == 'true'
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ steps.find_pr.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## 📸 App Screenshots'

      - name: Create or update comment
        if: steps.generate.outputs.has_screenshots == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ steps.find_pr.outputs.pr_number }}
          body: ${{ steps.generate.outputs.comment_body }}
          edit-mode: replace
