name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: Android

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The 'coverage' task is a custom aggregate task defined in the root build.gradle.
      # It runs 'jacocoTestCoverageVerification' and 'jacocoTestReport' for all modules,
      # enforcing 85% coverage via Jacoco.
      - name: Run unit tests with coverage
        run: ./gradlew coverage --stacktrace

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage-reports
          path: |
            Android/**/build/reports/jacoco/
            Android/**/build/reports/tests/
          retention-days: 14

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Android Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for report in $(find . -path "*/build/reports/jacoco/jacocoTestReport/html/index.html" 2>/dev/null); do
            module=$(echo $report | sed 's|./\(.*\)/build/.*|\1|')
            echo "- **$module**: Coverage report generated" >> $GITHUB_STEP_SUMMARY
          done

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Android/**/build/outputs/apk/debug/*.apk
          retention-days: 7
