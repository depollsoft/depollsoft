# yamllint disable rule:line-length
name: Android CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
      - "scripts/ci/android_sdk.py"
      - "scripts/ci/changed_apps.py"
  pull_request:
    branches:
      - main
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
      - "scripts/ci/android_sdk.py"
      - "scripts/ci/changed_apps.py"
  workflow_dispatch:
  schedule:
    # Weekly, not nightly: the schedule only adds the JaCoCo/Codecov report,
    # and coverage cannot move on a day with no commits.
    - cron: "0 3 * * 1"

# Serialize runs per branch. Superseded PR pushes are cancelled so a rapid
# series of pushes does not queue one full run per push. Pushes to main and
# scheduled runs are never cancelled, so their results stay complete.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number
    || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: Android

jobs:
  # Which apps this change touches (scripts/ci/changed_apps.py). A file under
  # an app's own module selects that app; anything else under Android/ is
  # shared code and selects both. Manual and scheduled runs select both.
  changes:
    name: Select changed Android apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: .
    outputs:
      any: ${{ steps.changes.outputs.android-any }}
      shared: ${{ steps.changes.outputs.android-shared }}
      modules: ${{ steps.changes.outputs.android-ci-modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            scripts/release/tests
      - name: Verify the selector
        run: python3 -m unittest scripts.release.tests.test_changed_apps
      - name: Select apps
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/changed_apps.py

  test:
    name: Android Unit Tests & Coverage
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: changes
    # This is the required check. A skipped required job counts as passing,
    # so it must not be skipped just because the selection failed: it runs
    # (and fails below) unless a successful selection found no Android work.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.result != 'success' || needs.changes.outputs.any == 'true')
    timeout-minutes: 45

    steps:
      - name: Require a successful app selection
        if: needs.changes.result != 'success'
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::Selecting changed apps ended with '$CHANGES_RESULT'; refusing to skip Android tests."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Check installed Android SDK
        id: android-sdk
        run: python3 ../scripts/ci/android_sdk.py

      - name: Install missing Android SDK packages
        if: steps.android-sdk.outputs.available != 'true' && steps.android-sdk.outputs.manager == 'true'
        timeout-minutes: 5
        run: python3 ../scripts/ci/android_sdk.py --install

      - name: Set up Android SDK
        if: steps.android-sdk.outputs.available != 'true' && steps.android-sdk.outputs.manager != 'true'
        timeout-minutes: 5
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools platforms;android-35 platforms;android-37.0
            build-tools;36.0.0

      - name: Verify Android SDK
        run: python3 ../scripts/ci/android_sdk.py --require

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Cache Gradle dependencies and wrapper for faster builds, and the Android
      # runtime jars Robolectric downloads into the Maven local repository.
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: >-
            gradle-unit-${{ runner.os }}-${{ hashFiles('**/*.gradle*',
            '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-unit-${{ runner.os }}-

      # One Gradle invocation. --no-daemon means every extra ./gradlew call
      # pays another JVM start and another full configuration phase, so the
      # unit tests, the coverage report and the release compile checks all go
      # into a single task list.
      #
      # Shared code runs every module's unit tests (the root alias covers the
      # libraries too); app-only changes run just the selected apps' modules
      # and compile just their release variants.
      #
      # For each selected app module, verifyRoborazziDebug runs that module's
      # unit tests once with the screenshot goldens compared (without it the
      # captures are skipped), and compileDebugAndroidTestKotlin compiles the
      # device-only tests and the store screenshot capture, which no job runs.
      - name: Run unit tests and compile production variants
        env:
          # Increase Gradle memory for containerized runners
          GRADLE_OPTS: >-
            -Xmx2g -XX:MaxMetaspaceSize=512m
            -XX:+HeapDumpOnOutOfMemoryError
          EVENT_NAME: ${{ github.event_name }}
          SHARED: ${{ needs.changes.outputs.shared }}
          MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          set -euo pipefail
          read -ra modules <<< "$MODULES"
          tasks=()
          if [[ "$SHARED" == true ]]; then
            tasks+=(testDebugUnitTest)
          else
            for module in "${modules[@]}"; do
              tasks+=(":$module:testDebugUnitTest")
            done
          fi
          for module in "${modules[@]}"; do
            case "$module" in
              # The license stub has no sources, so it has no Kotlin compile task.
              PitchPerfectLicense)
                tasks+=(":$module:compileReleaseJavaWithJavac") ;;
              *)
                tasks+=(":$module:compileReleaseKotlin") ;;
            esac
            case "$module" in
              PitchPerfect|TagMaster)
                tasks+=(":$module:verifyRoborazziDebug" ":$module:compileDebugAndroidTestKotlin") ;;
              PitchPerfectWear)
                tasks+=(":$module:verifyRoborazziDebug") ;;
            esac
          done
          echo "Gradle tasks: ${tasks[*]}"
          # Coverage only feeds the scheduled/manual Codecov upload.
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tasks+=(jacocoTestReport)
          fi
          ./gradlew "${tasks[@]}" \
            --stacktrace --build-cache --console=plain --no-daemon --no-parallel

      - name: Collect coverage + test metrics
        if: always()
        id: metrics
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          # We are running with defaults.run.working-directory: Android
          jacoco_paths = sorted(glob.glob(
            '**/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml',
            recursive=True))
          junit_paths = sorted(glob.glob(
            '**/build/test-results/testDebugUnitTest/*.xml', recursive=True))

          total_tests = total_failures = total_errors = total_skipped = 0
          for p in junit_paths:
            try:
              root = ET.parse(p).getroot()
            except Exception:
              continue
            # JUnit may be <testsuite> or <testsuites>
            if root.tag == 'testsuite':
              suites = [root]
            elif root.tag == 'testsuites':
              suites = list(root.findall('testsuite'))
            else:
              suites = []
            for s in suites:
              total_tests += int(s.attrib.get('tests', 0))
              total_failures += int(s.attrib.get('failures', 0))
              total_errors += int(s.attrib.get('errors', 0))
              total_skipped += int(s.attrib.get('skipped', 0))

          covered = missed = 0
          for p in jacoco_paths:
            try:
              root = ET.parse(p).getroot()
            except Exception:
              continue
            for c in root.findall('.//counter'):
              if c.attrib.get('type') == 'LINE':
                missed += int(c.attrib.get('missed', 0))
                covered += int(c.attrib.get('covered', 0))
          total_lines = covered + missed
          coverage_pct = (covered / total_lines * 100.0) if total_lines else 0.0

          # Codecov action runs from repo root; prefix paths with Android/
          codecov_files = ','.join(['Android/' + p for p in jacoco_paths])

          out_path = os.environ['GITHUB_OUTPUT']
          with open(out_path, 'a') as f:
            f.write(f"jacoco_count={len(jacoco_paths)}\n")
            f.write(f"junit_count={len(junit_paths)}\n")
            f.write(f"tests_total={total_tests}\n")
            f.write(f"tests_failures={total_failures}\n")
            f.write(f"tests_errors={total_errors}\n")
            f.write(f"tests_skipped={total_skipped}\n")
            f.write(f"line_coverage_pct={coverage_pct:.2f}\n")
            f.write(f"codecov_files={codecov_files}\n")

          summary_lines = []
          summary_lines.append('## Android — Unit tests & coverage')
          summary_lines.append('')
          summary_lines.append(f"- JUnit files: {len(junit_paths)}")
          summary_lines.append(
            f"- Tests: {total_tests} (failures: {total_failures}, "
            f"errors: {total_errors}, skipped: {total_skipped})")
          summary_lines.append(f"- JaCoCo XML files: {len(jacoco_paths)}")
          summary_lines.append(
            f"- Line coverage (sum of reports): {coverage_pct:.2f}%")
          summary_lines.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
            s.write('\n'.join(summary_lines) + '\n')
          PY

      - name: Upload coverage to Codecov
        if: steps.metrics.outputs.jacoco_count != '0'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        continue-on-error: true
        timeout-minutes: 5
        with:
          files: ${{ steps.metrics.outputs.codecov_files }}
          flags: android
          name: android-coverage
          fail_ci_if_error: false

      - name: Publish unit test results (PR check)
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Android Unit Tests
          path: Android/**/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-test-results
          path: Android/**/build/test-results/
          retention-days: 7

      # When a golden no longer matches, Roborazzi writes the actual image and a
      # side-by-side comparison next to it; keep them so the change can be seen.
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-screenshot-differences
          path: |
            Android/**/src/test/screenshots/*_compare.png
            Android/**/src/test/screenshots/*_actual.png
            Android/**/build/test-results/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-unit-coverage
          path: Android/**/build/reports/jacoco/
          retention-days: 7

# Removed: the `instrumented-tests` (Espresso/connectedAndroidTest on an
# emulator) and `coverage-summary` jobs.
#
# The instrumented job had failed on every scheduled run for weeks at the
# "Enable KVM for emulator" step, so the Espresso suites had not actually run
# anywhere, and "Publish instrumented test results" then failed on empty
# results. The androidTest suites are being migrated to Robolectric unit tests,
# which this workflow already runs via `testDebugUnitTest`. `coverage-summary`
# existed only to merge unit and instrumented coverage and reduces to the unit
# numbers the `test` job already reports.
#
# The Espresso suites that job existed for now run on the JVM under Robolectric
# in Android/{PitchPerfect,TagMaster}/src/test, via `testDebugUnitTest` above.
# What remains in src/androidTest is a small device-only residue (native
# pointer drags, IME window geometry, PdfRenderer, store-screenshot capture and
# the FirebaseUI bytecode-patch check). The test job compiles it but nothing
# runs it; it has to be run on a device or emulator by hand.
