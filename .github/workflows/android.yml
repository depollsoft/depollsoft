name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: Android

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download ARM64 AAPT2 binary
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-aapt2-arm64.yml
          name: aapt2-arm64-linux
          path: ~/.android-aapt2-arm64
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Set up custom AAPT2 for ARM64
        run: |
          if [ -f ~/.android-aapt2-arm64/aapt2-arm64-linux ]; then
            mkdir -p ~/.android-aapt2
            cp ~/.android-aapt2-arm64/aapt2-arm64-linux ~/.android-aapt2/aapt2
            chmod +x ~/.android-aapt2/aapt2
            echo "ANDROID_AAPT2_PATH=$HOME/.android-aapt2/aapt2" >> $GITHUB_ENV
            echo "Using custom ARM64 AAPT2 from: $HOME/.android-aapt2/aapt2"
            file ~/.android-aapt2/aapt2
          else
            echo "No ARM64 AAPT2 found, will try to use default (may fail on ARM64)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('Android/**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure AAPT2 path
        run: |
          if [ -n "$ANDROID_AAPT2_PATH" ]; then
            echo "android.aapt2ExecutablePath=$ANDROID_AAPT2_PATH" >> gradle.properties
            echo "Configured gradle.properties with custom AAPT2 path"
            cat gradle.properties
          fi

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport --stacktrace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: Android/**/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          name: android-coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: Android/**/build/test-results/
          retention-days: 7

  build:
    name: Build Debug APK
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download ARM64 AAPT2 binary
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-aapt2-arm64.yml
          name: aapt2-arm64-linux
          path: ~/.android-aapt2-arm64
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Set up custom AAPT2 for ARM64
        run: |
          if [ -f ~/.android-aapt2-arm64/aapt2-arm64-linux ]; then
            mkdir -p ~/.android-aapt2
            cp ~/.android-aapt2-arm64/aapt2-arm64-linux ~/.android-aapt2/aapt2
            chmod +x ~/.android-aapt2/aapt2
            echo "ANDROID_AAPT2_PATH=$HOME/.android-aapt2/aapt2" >> $GITHUB_ENV
            echo "Using custom ARM64 AAPT2 from: $HOME/.android-aapt2/aapt2"
            file ~/.android-aapt2/aapt2
          else
            echo "No ARM64 AAPT2 found, will try to use default (may fail on ARM64)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('Android/**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure AAPT2 path
        run: |
          if [ -n "$ANDROID_AAPT2_PATH" ]; then
            echo "android.aapt2ExecutablePath=$ANDROID_AAPT2_PATH" >> gradle.properties
            cat gradle.properties
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Android/**/build/outputs/apk/debug/*.apk
          retention-days: 7
