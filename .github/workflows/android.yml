name: Android CI

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: Android

jobs:
  test:
    name: Android Unit Tests & Coverage
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Repair Android SDK (self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME not set" >&2
            exit 1
          fi

          # Some self-hosted runners end up with a partially installed build-tools;35.0.0
          # which can break AGP even if we request 34.0.0.
          if [[ -d "${SDK_ROOT}/build-tools/35.0.0" ]]; then
            echo "Removing possibly corrupted build-tools;35.0.0 at ${SDK_ROOT}/build-tools/35.0.0"
            rm -rf "${SDK_ROOT}/build-tools/35.0.0"
          fi
          (yes | sdkmanager --uninstall "build-tools;35.0.0") >/dev/null 2>&1 || true

          (yes | sdkmanager --licenses) >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests with coverage
        env:
          # Increase Gradle memory for containerized runners
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew testDebugUnitTest jacocoTestReport --stacktrace --no-daemon

      - name: Collect coverage + test metrics
        if: always()
        id: metrics
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          # We are running with defaults.run.working-directory: Android
          jacoco_paths = sorted(glob.glob('**/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml', recursive=True))
          junit_paths = sorted(glob.glob('**/build/test-results/testDebugUnitTest/*.xml', recursive=True))

          total_tests = total_failures = total_errors = total_skipped = 0
          for p in junit_paths:
            try:
              root = ET.parse(p).getroot()
            except Exception:
              continue
            # JUnit may be <testsuite> or <testsuites>
            if root.tag == 'testsuite':
              suites = [root]
            elif root.tag == 'testsuites':
              suites = list(root.findall('testsuite'))
            else:
              suites = []
            for s in suites:
              total_tests += int(s.attrib.get('tests', 0))
              total_failures += int(s.attrib.get('failures', 0))
              total_errors += int(s.attrib.get('errors', 0))
              total_skipped += int(s.attrib.get('skipped', 0))

          covered = missed = 0
          for p in jacoco_paths:
            try:
              root = ET.parse(p).getroot()
            except Exception:
              continue
            for c in root.findall('.//counter'):
              if c.attrib.get('type') == 'LINE':
                missed += int(c.attrib.get('missed', 0))
                covered += int(c.attrib.get('covered', 0))
          total_lines = covered + missed
          coverage_pct = (covered / total_lines * 100.0) if total_lines else 0.0

          # Codecov action runs from repo root; prefix paths with Android/
          codecov_files = ','.join(['Android/' + p for p in jacoco_paths])

          out_path = os.environ['GITHUB_OUTPUT']
          with open(out_path, 'a') as f:
            f.write(f"jacoco_count={len(jacoco_paths)}\n")
            f.write(f"junit_count={len(junit_paths)}\n")
            f.write(f"tests_total={total_tests}\n")
            f.write(f"tests_failures={total_failures}\n")
            f.write(f"tests_errors={total_errors}\n")
            f.write(f"tests_skipped={total_skipped}\n")
            f.write(f"line_coverage_pct={coverage_pct:.2f}\n")
            f.write(f"codecov_files={codecov_files}\n")

          summary_lines = []
          summary_lines.append('## Android — Unit tests & coverage')
          summary_lines.append('')
          summary_lines.append(f"- JUnit files: {len(junit_paths)}")
          summary_lines.append(f"- Tests: {total_tests} (failures: {total_failures}, errors: {total_errors}, skipped: {total_skipped})")
          summary_lines.append(f"- JaCoCo XML files: {len(jacoco_paths)}")
          summary_lines.append(f"- Line coverage (sum of reports): {coverage_pct:.2f}%")
          summary_lines.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
            s.write('\n'.join(summary_lines) + '\n')
          PY

      - name: Upload coverage to Codecov
        if: steps.metrics.outputs.jacoco_count != '0'
        uses: codecov/codecov-action@v4
        with:
          files: \${{ steps.metrics.outputs.codecov_files }}
          flags: android
          name: android-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Publish unit test results (PR check)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Android Unit Tests
          path: Android/**/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: Android/**/build/test-results/
          retention-days: 7

      - name: Upload unit test coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-coverage
          path: Android/**/build/reports/jacoco/
          retention-days: 7

  instrumented-tests:
    name: Android UI/Instrumented Tests
    # Use ubuntu-24.04 for better KVM performance (4 cores vs 2)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable KVM for emulator (Linux only)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 emulator system-images;android-30;google_apis;arm64-v8a system-images;android-30;google_apis;x86_64'

      - name: Repair Android SDK (self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME not set" >&2
            exit 1
          fi

          if [[ -d "${SDK_ROOT}/build-tools/35.0.0" ]]; then
            echo "Removing possibly corrupted build-tools;35.0.0 at ${SDK_ROOT}/build-tools/35.0.0"
            rm -rf "${SDK_ROOT}/build-tools/35.0.0"
          fi
          (yes | sdkmanager --uninstall "build-tools;35.0.0") >/dev/null 2>&1 || true

          (yes | sdkmanager --licenses) >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Cache Gradle dependencies and wrapper
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-instrumented-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-instrumented-${{ runner.os }}-

      # Cache AVD for faster emulator startup
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-${{ runner.arch }}-${{ runner.os }}

      - name: Clean stale AVD (self-hosted)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME="ci-api30-googleapis-${{ runner.arch }}"
          AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          echo "AVD_HOME=${AVD_HOME}"
          echo "Cleaning AVD name: ${AVD_NAME}"
          rm -rf "${AVD_HOME}/${AVD_NAME}.avd" || true
          rm -f "${AVD_HOME}/${AVD_NAME}.ini" || true

      - name: Ensure ADB is healthy (self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME not set" >&2
            exit 1
          fi

          # Self-hosted runners can end up with a stuck adb server which breaks
          # emulator boot detection ("Unable to connect to adb daemon on port: 5037").
          echo "Stopping any existing ADB server..."
          "${SDK_ROOT}/platform-tools/adb" kill-server 2>/dev/null || true
          
          # Aggressively kill any lingering adb processes
          echo "Killing lingering adb processes..."
          pkill -9 -f "adb" 2>/dev/null || true
          
          # Wait for processes to die and port to be released
          sleep 2
          
          # Kill anything still holding port 5037
          for _ in 1 2 3; do
            if lsof -ti tcp:5037 >/dev/null 2>&1; then
              echo "Port 5037 still in use, killing processes..."
              lsof -ti tcp:5037 | xargs kill -9 2>/dev/null || true
              sleep 1
            else
              break
            fi
          done
          
          # Clean up adb state files
          rm -f "$HOME/.android/adb"* 2>/dev/null || true
          
          # Final check - if port is still busy, wait longer
          if lsof -ti tcp:5037 >/dev/null 2>&1; then
            echo "Port 5037 still busy after cleanup, waiting..."
            sleep 5
          fi
          
          echo "Starting fresh ADB server..."
          "${SDK_ROOT}/platform-tools/adb" start-server
          "${SDK_ROOT}/platform-tools/adb" devices

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
          target: google_apis
          force-avd-creation: true
          avd-name: ci-api30-googleapis-${{ runner.arch }}
          emulator-boot-timeout: 1800
          # On macOS runners, Vulkan/SwiftShader can wedge the device/adb.
          # Disable Vulkan and use software GPU to keep it stable.
          # Allow snapshot save here so the AVD cache is populated for future runs.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."
          working-directory: Android

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
        with:
          api-level: 30
          arch: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
          target: google_apis
          force-avd-creation: false
          avd-name: ci-api30-googleapis-${{ runner.arch }}
          emulator-boot-timeout: 1800
          # Load from snapshot but don't save changes after tests (faster shutdown)
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save -feature -Vulkan
          disable-animations: true
          working-directory: Android
          script: |
            set -euo pipefail

            "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platform-tools/adb" wait-for-device
            "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platform-tools/adb" shell wm dismiss-keyguard || true
            "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platform-tools/adb" shell settings put global stay_on_while_plugged_in 3 || true
            "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platform-tools/adb" shell svc power stayon true || true
            "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platform-tools/adb" shell settings put global window_animation_scale 0 || true
            "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platform-tools/adb" shell settings put global transition_animation_scale 0 || true
            "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platform-tools/adb" shell settings put global animator_duration_scale 0 || true

            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.coverage=true --build-cache --stacktrace
            ./gradlew createDebugAndroidTestCoverageReport --stacktrace

      - name: Collect instrumented test results
        if: always()
        id: instr_metrics
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          # Already in Android directory due to defaults.run.working-directory
          # Connected device test results location
          junit_paths = sorted(glob.glob('**/build/outputs/androidTest-results/connected/**/*.xml', recursive=True))

          total_tests = total_failures = total_errors = total_skipped = 0
          for p in junit_paths:
            try:
              root = ET.parse(p).getroot()
            except Exception:
              continue
            if root.tag == 'testsuite':
              suites = [root]
            elif root.tag == 'testsuites':
              suites = list(root.findall('testsuite'))
            else:
              suites = []
            for s in suites:
              total_tests += int(s.attrib.get('tests', 0))
              total_failures += int(s.attrib.get('failures', 0))
              total_errors += int(s.attrib.get('errors', 0))
              total_skipped += int(s.attrib.get('skipped', 0))

          # Collect instrumented test coverage from JaCoCo reports
          # Coverage reports are generated in build/reports/coverage/androidTest/debug/
          coverage_paths = sorted(glob.glob('**/build/reports/coverage/androidTest/debug/report.xml', recursive=True))
          covered = missed = 0
          for p in coverage_paths:
            try:
              root = ET.parse(p).getroot()
            except Exception:
              continue
            for c in root.findall('.//counter'):
              if c.attrib.get('type') == 'LINE':
                missed += int(c.attrib.get('missed', 0))
                covered += int(c.attrib.get('covered', 0))
          total_lines = covered + missed
          coverage_pct = (covered / total_lines * 100.0) if total_lines else 0.0

          out_path = os.environ['GITHUB_OUTPUT']
          with open(out_path, 'a') as f:
            f.write(f"instr_tests_total={total_tests}\n")
            f.write(f"instr_tests_failures={total_failures}\n")
            f.write(f"instr_tests_errors={total_errors}\n")
            f.write(f"instr_coverage_pct={coverage_pct:.2f}\n")

          summary = []
          summary.append('## Android — UI/Instrumented Tests')
          summary.append('')
          summary.append(f"- Tests: {total_tests} (failures: {total_failures}, errors: {total_errors}, skipped: {total_skipped})")
          if total_lines > 0:
            summary.append(f"- Line coverage: {coverage_pct:.2f}%")
          summary.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
            s.write('\n'.join(summary) + '\n')
          PY

      - name: Publish instrumented test results (PR check)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Android UI Tests
          path: Android/**/build/outputs/androidTest-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-results
          path: Android/**/build/outputs/androidTest-results/
          retention-days: 7

      - name: Upload instrumented test coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-coverage
          path: Android/**/build/reports/coverage/
          retention-days: 7

  # Combined coverage summary job - runs after both test types complete
  coverage-summary:
    name: Android Combined Coverage
    runs-on: [self-hosted, macOS]
    needs: [test, instrumented-tests]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    steps:
      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-unit-coverage
          path: unit-coverage

      - name: Download instrumented test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-instrumented-coverage
          path: instrumented-coverage

      - name: Generate combined coverage summary
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          # Find all JaCoCo coverage reports
          unit_coverage_paths = sorted(glob.glob('unit-coverage/**/jacocoTestReport.xml', recursive=True))
          instr_coverage_paths = sorted(glob.glob('instrumented-coverage/**/report.xml', recursive=True))

          def parse_jacoco_coverage(paths):
            covered = missed = 0
            for p in paths:
              try:
                root = ET.parse(p).getroot()
              except Exception:
                continue
              for c in root.findall('.//counter'):
                if c.attrib.get('type') == 'LINE':
                  missed += int(c.attrib.get('missed', 0))
                  covered += int(c.attrib.get('covered', 0))
            total = covered + missed
            pct = (covered / total * 100.0) if total else 0.0
            return covered, missed, total, pct

          unit_covered, unit_missed, unit_total, unit_pct = parse_jacoco_coverage(unit_coverage_paths)
          instr_covered, instr_missed, instr_total, instr_pct = parse_jacoco_coverage(instr_coverage_paths)

          # Best coverage (since they test the same codebase)
          combined_pct = max(unit_pct, instr_pct) if (unit_total or instr_total) else 0.0

          summary = []
          summary.append('## Android — Combined Coverage Summary')
          summary.append('')
          summary.append('| Test Type | Lines Covered | Total Lines | Coverage |')
          summary.append('|-----------|---------------|-------------|----------|')
          if unit_total:
            summary.append(f'| Unit Tests | {unit_covered} | {unit_total} | {unit_pct:.2f}% |')
          if instr_total:
            summary.append(f'| Instrumented Tests | {instr_covered} | {instr_total} | {instr_pct:.2f}% |')
          summary.append(f'| **Combined (best)** | - | - | **{combined_pct:.2f}%** |')
          summary.append('')
          summary.append('> Note: Combined shows the better coverage of the two test types.')
          summary.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
            s.write('\n'.join(summary) + '\n')
          PY
