name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: Android

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('Android/**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Check runner architecture
        id: arch
        run: |
          echo "arch=$(uname -m)" >> $GITHUB_OUTPUT
          echo "Architecture: $(uname -m)"

      - name: Set up AAPT2 for ARM64 Linux
        if: steps.arch.outputs.arch == 'aarch64'
        run: |
          # Download ARM64 Linux AAPT2 from Google's Maven repository
          AAPT2_VERSION="8.5.0-11315950"
          mkdir -p $HOME/.android/aapt2
          curl -L "https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/${AAPT2_VERSION}/aapt2-${AAPT2_VERSION}-linux-aarch64.jar" -o /tmp/aapt2.jar
          unzip -o /tmp/aapt2.jar -d $HOME/.android/aapt2/
          chmod +x $HOME/.android/aapt2/aapt2
          echo "android.aapt2FromMavenOverride=$HOME/.android/aapt2/aapt2" >> Android/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport --stacktrace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: Android/**/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          name: android-coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: Android/**/build/test-results/
          retention-days: 7

  build:
    name: Build Debug APK
    runs-on: [self-hosted, linux]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('Android/**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Check runner architecture
        id: arch
        run: |
          echo "arch=$(uname -m)" >> $GITHUB_OUTPUT
          echo "Architecture: $(uname -m)"

      - name: Set up AAPT2 for ARM64 Linux
        if: steps.arch.outputs.arch == 'aarch64'
        run: |
          # Download ARM64 Linux AAPT2 from Google's Maven repository
          AAPT2_VERSION="8.5.0-11315950"
          mkdir -p $HOME/.android/aapt2
          curl -L "https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/${AAPT2_VERSION}/aapt2-${AAPT2_VERSION}-linux-aarch64.jar" -o /tmp/aapt2.jar
          unzip -o /tmp/aapt2.jar -d $HOME/.android/aapt2/
          chmod +x $HOME/.android/aapt2/aapt2
          echo "android.aapt2FromMavenOverride=$HOME/.android/aapt2/aapt2" >> Android/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Android/**/build/outputs/apk/debug/*.apk
          retention-days: 7
