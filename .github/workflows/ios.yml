# yamllint disable rule:line-length
name: iOS CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "iOS/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/ios-app-tests.yml"
      - "scripts/ci/ios_*.py"
  pull_request:
    branches:
      - main
    paths:
      - "iOS/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/ios-app-tests.yml"
      - "scripts/ci/ios_*.py"
  workflow_dispatch:
  schedule:
    # Weekly, not nightly. This schedule is the only thing that sets
    # extended-ui, i.e. builds and runs the pitchperfectUITests scheme, and
    # it is the single most expensive recurring item in this repo because
    # macOS minutes bill at 10x. Nothing changes between nightly runs that
    # the per-PR and per-push runs do not already cover.
    - cron: "0 4 * * 1"

# Serialize runs per branch. Superseded PR pushes are cancelled: this is by
# far the largest macOS consumer, and queueing a full 21-32 minute run for every
# intermediate push is the most wasteful thing this repo does. Pushes to main
# and scheduled runs are never cancelled, so their results stay complete.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number
    || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: iOS

jobs:
  apps:
    name: ${{ matrix.app }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        app: [pitchperfect, tagmaster]
    uses: ./.github/workflows/ios-app-tests.yml
    with:
      app: ${{ matrix.app }}
      extended-ui: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

  test:
    # Keep the existing aggregate check name for branch protection.
    name: iOS Unit Tests & Coverage
    needs: apps
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ios-test-results-*
          merge-multiple: true
          path: ios-test-results
      - name: Verify every expected suite and summarize coverage
        if: always()
        env:
          APPS_RESULT: ${{ needs.apps.result }}
          EXTENDED_UI: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          options=()
          if [ "$EXTENDED_UI" = true ]; then options+=(--extended); fi
          IOS_TEST_MATRIX="$(python3 scripts/ci/ios_suites.py matrix "${options[@]}")"
          export IOS_TEST_MATRIX
          python3 scripts/ci/ios_suites.py summarize ios-test-results
          test "$APPS_RESULT" = success
      - name: Publish native test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: iOS Unit Tests
          path: ios-test-results/*-junit.xml
          reporter: java-junit
          fail-on-error: true
      - name: Upload combined test summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-test-results
          path: ios-test-results/
          retention-days: 14
      - name: Find existing PR comment
        if: github.event_name == 'pull_request' && hashFiles('ios-ci-comment.md') != ''
        id: find_comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "### iOS CI"
      - name: Update PR test summary
        if: github.event_name == 'pull_request' && hashFiles('ios-ci-comment.md') != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          body-path: ios-ci-comment.md
          edit-mode: replace
