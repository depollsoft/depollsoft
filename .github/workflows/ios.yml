            echo "Removing old master CocoaPods repo (now using CDN)..."
            rm -rf "$HOME/.cocoapods/repos/master"
          fi
          
          pod install --repo-update

      - name: Build pitchperfect
        run: |
          xcodebuild build \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Build tagmaster
        run: |
          xcodebuild build \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color
