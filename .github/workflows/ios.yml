name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'iOS/**'
  pull_request:
    branches:
      - main
    paths:
      - 'iOS/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: iOS

jobs:
  test:
    name: Build and Test iOS Projects
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode Version
        run: |
          # List available Xcode versions
          ls /Applications/Xcode*.app/Contents/Developer || true
          # Use latest available Xcode
          sudo xcode-select -s "$(find /Applications -name 'Xcode*.app' | sort -V | tail -1)/Contents/Developer"
        
      - name: Show Xcode Version
        run: xcodebuild -version
        
      - name: List Available Simulators
        run: xcrun simctl list devices available
        
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: iOS/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
            
      - name: Install CocoaPods Dependencies
        run: |
          gem install cocoapods --no-document
          pod install --verbose
          echo "Workspace contents after pod install:"
          find . -name "*.xcworkspace" -exec ls -la {} \;
        continue-on-error: false
          
      - name: List Available Schemes
        run: |
          echo "Available schemes in workspace:"
          xcodebuild -workspace iOS.xcworkspace -list
          echo ""
          echo "Available simulators:"
          xcrun simctl list devices available | grep -E "(iPhone|iPad)"
          echo ""
          echo "Checking scheme configurations:"
          for scheme in depolllib pitchperfectlib pitchperfect tagmaster; do
            echo "--- Scheme: $scheme ---"
            xcodebuild -workspace iOS.xcworkspace -scheme $scheme -showBuildSettings | grep -E "(PRODUCT_NAME|TEST_BUNDLE_IDENTIFIER)" || echo "No build settings found"
          done
        
      - name: Select iOS Simulator
        run: |
          # Use generic iOS Simulator instead of specific device name
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator" >> $GITHUB_ENV
          echo "Using generic iOS Simulator destination"
        
      - name: Build and Test depolllib
        run: |
          echo "Building and testing depolllib..."
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme depolllib \
            -destination "$SIMULATOR_DESTINATION" \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test pitchperfectlib
        run: |
          echo "Building and testing pitchperfectlib..."
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme pitchperfectlib \
            -destination "$SIMULATOR_DESTINATION" \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test pitchperfect
        run: |
          echo "Building pitchperfect..."
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination "$SIMULATOR_DESTINATION" \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test tagmaster
        run: |
          echo "Building tagmaster..."
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination "$SIMULATOR_DESTINATION" \
            clean build test \
            CODE_SIGNING_ALLOWED=NO