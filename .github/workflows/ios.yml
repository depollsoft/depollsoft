name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: iOS

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        # Use Xcode 16.3 which includes iOS 18.4 SDK and simulator support
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache CocoaPods Specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-specs-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-specs-

      - name: Cache CocoaPods Pods
        uses: actions/cache@v4
        with:
          path: iOS/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-xcode16.3-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-xcode16.3-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run pitchperfect tests with coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' \
            -enableCodeCoverage YES \
            -resultBundlePath pitchperfect-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Run tagmaster tests with coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' \
            -enableCodeCoverage YES \
            -resultBundlePath tagmaster-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Generate coverage report for pitchperfect
        if: always()
        run: |
          if [ -d "pitchperfect-results.xcresult" ]; then
            xcrun xccov view --report pitchperfect-results.xcresult > pitchperfect-coverage.txt || true
            echo "## Pitch Perfect Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 pitchperfect-coverage.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No coverage data available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate coverage report for tagmaster
        if: always()
        run: |
          if [ -d "tagmaster-results.xcresult" ]; then
            xcrun xccov view --report tagmaster-results.xcresult > tagmaster-coverage.txt || true
            echo "## Tag Master Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 tagmaster-coverage.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No coverage data available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            iOS/*.xcresult
            iOS/*-coverage.txt
          retention-days: 14

  build:
    name: Build Debug
    runs-on: macos-15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        # Use Xcode 16.3 to match the test job and include iOS 18.4 SDK
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Cache CocoaPods Specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-specs-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-specs-

      - name: Cache CocoaPods Pods
        uses: actions/cache@v4
        with:
          path: iOS/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-xcode16.3-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-xcode16.3-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Build pitchperfect
        run: |
          xcodebuild build \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Build tagmaster
        run: |
          xcodebuild build \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color
