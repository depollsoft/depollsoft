name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'iOS/**'
  pull_request:
    branches:
      - main
    paths:
      - 'iOS/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: iOS

jobs:
  test:
    name: Build and Test iOS Projects
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
        
      - name: Show Xcode Version
        run: xcodebuild -version
        
      - name: List Available Simulators
        run: xcrun simctl list devices available
        
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: iOS/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
            
      - name: Install CocoaPods Dependencies
        run: |
          gem install cocoapods
          pod install --verbose
          
      - name: Build and Test depolllib
        run: |
          xcodebuild \
            -project depolllib/depolllib.xcodeproj \
            -scheme depolllib \
            -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' \
            clean build \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test pitchperfectlib
        run: |
          xcodebuild \
            -project pitchperfect/pitchperfectlib/pitchperfectlib.xcodeproj \
            -scheme pitchperfectlib \
            -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test pitchperfect
        run: |
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test tagmaster
        run: |
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO