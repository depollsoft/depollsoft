name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'iOS/**'
  pull_request:
    branches:
      - main
    paths:
      - 'iOS/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: iOS

jobs:
  test:
    name: Build and Test iOS Projects
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode Version
        run: |
          # List available Xcode versions
          ls /Applications/Xcode*.app/Contents/Developer || true
          # Use latest available Xcode
          sudo xcode-select -s "$(find /Applications -name 'Xcode*.app' | sort -V | tail -1)/Contents/Developer"
        
      - name: Show Xcode Version
        run: xcodebuild -version
        
      - name: List Available Simulators
        run: xcrun simctl list devices available
        
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: iOS/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
            
      - name: Install CocoaPods Dependencies
        run: |
          gem install cocoapods --no-document
          pod install --verbose
        continue-on-error: false
          
      - name: Build and Test depolllib
        run: |
          echo "Building depolllib..."
          xcodebuild \
            -project depolllib/depolllib.xcodeproj \
            -scheme depolllib \
            -destination 'platform=iOS Simulator,OS=latest' \
            clean build \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test pitchperfectlib
        run: |
          echo "Building pitchperfectlib..."
          xcodebuild \
            -project pitchperfect/pitchperfectlib/pitchperfectlib.xcodeproj \
            -scheme pitchperfectlib \
            -destination 'platform=iOS Simulator,OS=latest' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test pitchperfect
        run: |
          echo "Building pitchperfect..."
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination 'platform=iOS Simulator,OS=latest' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Build and Test tagmaster
        run: |
          echo "Building tagmaster..."
          xcodebuild \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination 'platform=iOS Simulator,OS=latest' \
            clean build test \
            CODE_SIGNING_ALLOWED=NO