name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: iOS

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      # Set Xcode path - will be refined in Select Xcode version step
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # Find available Xcode installation (prefer versioned, fall back to Xcode.app)
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_16.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          fi

      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          XCODE_VERSION=$(xcodebuild -version | head -1 | sed 's/Xcode //')
          echo "version=$XCODE_VERSION" >> $GITHUB_OUTPUT

      - name: Get iOS Simulator destination
        id: simulator
        run: |
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = data.get('devices', {})
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for device in devices[runtime]:
                if 'iPhone 16' in device['name'] and device['isAvailable']:
                  parts = runtime.split('iOS-')[-1].split('-')
                  ios_version = '.'.join(parts)
                  print(f\"platform=iOS Simulator,name={device['name']},OS={ios_version}\")
                  sys.exit(0)
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for device in devices[runtime]:
                if 'iPhone' in device['name'] and device['isAvailable']:
                  parts = runtime.split('iOS-')[-1].split('-')
                  ios_version = '.'.join(parts)
                  print(f\"platform=iOS Simulator,name={device['name']},OS={ios_version}\")
                  sys.exit(0)
          print('platform=iOS Simulator,name=iPhone 16,OS=18.4')
          " 2>/dev/null || echo "platform=iOS Simulator,name=iPhone 16,OS=18.4")
          echo "destination=$DESTINATION" >> $GITHUB_OUTPUT
          echo "Using simulator: $DESTINATION"

      - name: Cache CocoaPods Specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-specs-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-specs-

      - name: Cache CocoaPods Pods
        uses: actions/cache@v4
        with:
          path: iOS/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-xcode${{ steps.xcode.outputs.version }}-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run pitchperfect tests with coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -enableCodeCoverage YES \
            -resultBundlePath pitchperfect-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Run tagmaster tests with coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -enableCodeCoverage YES \
            -resultBundlePath tagmaster-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Generate coverage report for pitchperfect
        if: always()
        run: |
          if [ -d "pitchperfect-results.xcresult" ]; then
            xcrun xccov view --report pitchperfect-results.xcresult > pitchperfect-coverage.txt || true
            echo "## Pitch Perfect Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 pitchperfect-coverage.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No coverage data available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate coverage report for tagmaster
        if: always()
        run: |
          if [ -d "tagmaster-results.xcresult" ]; then
            xcrun xccov view --report tagmaster-results.xcresult > tagmaster-coverage.txt || true
            echo "## Tag Master Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 tagmaster-coverage.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No coverage data available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            iOS/*.xcresult
            iOS/*-coverage.txt
          retention-days: 14

  build:
    name: Build Debug
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    needs: test
    env:
      # Set Xcode path - will be refined in Select Xcode version step
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # Find available Xcode installation (prefer versioned, fall back to Xcode.app)
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_16.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          fi

      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          XCODE_VERSION=$(xcodebuild -version | head -1 | sed 's/Xcode //')
          echo "version=$XCODE_VERSION" >> $GITHUB_OUTPUT

      - name: Get iOS Simulator destination
        id: simulator
        run: |
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = data.get('devices', {})
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for device in devices[runtime]:
                if 'iPhone 16' in device['name'] and device['isAvailable']:
                  parts = runtime.split('iOS-')[-1].split('-')
                  ios_version = '.'.join(parts)
                  print(f\"platform=iOS Simulator,name={device['name']},OS={ios_version}\")
                  sys.exit(0)
          for runtime in sorted(devices.keys(), reverse=True):
            if 'iOS' in runtime:
              for device in devices[runtime]:
                if 'iPhone' in device['name'] and device['isAvailable']:
                  parts = runtime.split('iOS-')[-1].split('-')
                  ios_version = '.'.join(parts)
                  print(f\"platform=iOS Simulator,name={device['name']},OS={ios_version}\")
                  sys.exit(0)
          print('platform=iOS Simulator,name=iPhone 16,OS=18.4')
          " 2>/dev/null || echo "platform=iOS Simulator,name=iPhone 16,OS=18.4")
          echo "destination=$DESTINATION" >> $GITHUB_OUTPUT

      - name: Cache CocoaPods Specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-specs-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-specs-

      - name: Cache CocoaPods Pods
        uses: actions/cache@v4
        with:
          path: iOS/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('iOS/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-xcode${{ steps.xcode.outputs.version }}-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Build pitchperfect
        run: |
          xcodebuild build \
            -workspace iOS.xcworkspace \
            -scheme pitchperfect \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Build tagmaster
        run: |
          xcodebuild build \
            -workspace iOS.xcworkspace \
            -scheme tagmaster \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color
