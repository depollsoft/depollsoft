name: Self-hosted Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux runner
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Inspect Linux host
        run: |
          uname -a
          getconf _NPROCESSORS_ONLN
          free -h || true

  macos:
    name: macOS runner
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Inspect macOS host
        run: |
          sw_vers
          sysctl -n hw.ncpu
          sysctl -n hw.memsize
          xcodebuild -version

  windows:
    name: Windows runner
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: Inspect Windows host
        shell: powershell
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion,
              OsArchitecture, CsNumberOfLogicalProcessors,
              CsTotalPhysicalMemory
          dotnet --info
