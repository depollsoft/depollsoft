name: Build and test one iOS app
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      extended-ui:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: iOS
jobs:
  build:
    name: Build iOS test products
    runs-on: macos-26
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      IOS_APP: ${{ inputs.app }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout

        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode version
        id: select_xcode
        run: |
          DEVELOPER_DIR="$(xcode-select -p 2>/dev/null || true)"
          if [ -z "$DEVELOPER_DIR" ] || [ ! -d "$DEVELOPER_DIR" ]; then
            DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"
          fi
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "No Xcode installation found!"
            exit 1
          fi


          # Pin the active developer directory for subsequent steps.

          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "$DEVELOPER_DIR/usr/bin" >> "$GITHUB_PATH"

          # Expose tool paths as outputs so later steps can call the
          # intended toolchain even if the runner's global developer
          # directory points at CommandLineTools.
          {
            echo "developer_dir=$DEVELOPER_DIR"
            echo "xcrun=/usr/bin/xcrun"
            echo "xcodebuild=/usr/bin/xcodebuild"
          } >> "$GITHUB_OUTPUT"

          echo "Selected Xcode: $DEVELOPER_DIR"

      - name: Show Xcode version
        id: xcode
        run: |
          "${{ steps.select_xcode.outputs.xcodebuild }}" -version
          XCODE_VERSION=$(
            "${{ steps.select_xcode.outputs.xcodebuild }}" -version \
              | head -1 | sed 's/Xcode //')
          echo "version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install xcpretty
        run: |
          if ! command -v xcpretty >/dev/null 2>&1; then
            gem install xcpretty --user-install --no-document
            USER_GEM_BIN="$(ruby -e 'puts Gem.user_dir')/bin"

            echo "$USER_GEM_BIN" >> "$GITHUB_PATH"
          fi

      # Key prefix is shared with pr-preview.yml so whichever macOS job runs
      # first on a branch populates the cache for the others. restore-keys
      # matters more than the exact key: without them a single Package.resolved
      # bump forced a fully cold SPM resolve in every macOS job. The Xcode
      # version is part of the key because a manifest cache built by another
      # toolchain is not reusable.
      - name: Cache SPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('iOS/iOS.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-

      # The resolved checkout itself: 11 binary xcframeworks plus every source
      # package, which resolving from the shared cache alone re-extracted on
      # every run (2-6 minutes per job). The key is exact (Package.resolved +
      # Xcode), so a hit means the same packages at the same versions; the
      # artifact check below still runs and forces a clean resolve if
      # anything is missing.
      - name: Cache resolved SPM checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: iOS/SourcePackages
          key: spm-checkout-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('iOS/iOS.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve SPM dependencies
        run: |
          # SourcePackages/workspace-state.json embeds absolute paths, so a
          # checkout restored from a runner with a different work root is
          # unusable. Hosted runners share one root, but verify rather than
          # assume.
          if [ -f SourcePackages/workspace-state.json ] \
            && ! grep -q "\"$PWD/SourcePackages/" SourcePackages/workspace-state.json; then
            echo "Restored SourcePackages was resolved under another work root; resolving cleanly."
            rm -rf SourcePackages
          fi
          for attempt in 1 2; do
            echo "Resolving SPM dependencies (attempt $attempt/2)"
            "${{ steps.select_xcode.outputs.xcodebuild }}" -resolvePackageDependencies \
              -workspace iOS.xcworkspace \
              -scheme "$IOS_APP" \
              -clonedSourcePackagesDirPath SourcePackages
            missing=0
            for artifact in \
              facebook-ios-sdk/FBSDKCoreKit/FBSDKCoreKit.xcframework \
              facebook-ios-sdk/FBSDKCoreKit_Basics/FBSDKCoreKit_Basics.xcframework \
              facebook-ios-sdk/FBAEMKit/FBAEMKit.xcframework \
              facebook-ios-sdk/FBSDKLoginKit/FBSDKLoginKit.xcframework \
              firebase-ios-sdk/FirebaseFirestoreInternal/FirebaseFirestoreInternal.xcframework \
              swift-package-manager-google-mobile-ads/GoogleMobileAds/GoogleMobileAds.xcframework \
              swift-package-manager-google-user-messaging-platform/UserMessagingPlatform/UserMessagingPlatform.xcframework \
              grpc-binary/grpc/grpc.xcframework \
              grpc-binary/grpcpp/grpcpp.xcframework \
              grpc-binary/openssl_grpc/openssl_grpc.xcframework \
              abseil-cpp-binary/absl/absl.xcframework; do
              if [ ! -f "SourcePackages/artifacts/$artifact/Info.plist" ]; then
                echo "Missing SPM binary artifact: $artifact"
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              exit 0
            fi
            echo "SPM binary artifacts are incomplete; resolving cleanly."
            rm -rf SourcePackages
          done
          echo "SPM binary artifacts are still missing after a clean resolve." >&2
          exit 1

      # A concrete destination makes Xcode include coverage metadata. Do not
      # boot it; execution happens on independent test runners after packaging.
      - name: Create build destination
        id: build_simulator
        env:
          IOS_SIMULATOR_VERSION: '26.5'
        run: python3 ../scripts/ci/ios_simulator.py

      - name: Build app test targets
        run: |
          set -o pipefail
          schemes=("$IOS_APP")
          if [ "$IOS_APP" = pitchperfect ]; then schemes+=(pitchperfectlib); fi
          for scheme in "${schemes[@]}"; do
            xcodebuild build-for-testing -enableCodeCoverage YES -jobs 2 \
              -derivedDataPath DerivedData -workspace iOS.xcworkspace \
              -clonedSourcePackagesDirPath SourcePackages -scheme "$scheme" \
              -destination '${{ steps.build_simulator.outputs.destination }}' ARCHS=arm64 \
              CODE_SIGNING_ALLOWED=NO SDKROOT=iphonesimulator | xcpretty --color
          done

      # The behavioural XCUITest suites were migrated to in-process XCTest
      # unit tests (pitchperfectTests / tagmasterTests), which run on every
      # PR above. What remains in the UITests bundles is the residue that
      # needs a real app launch (launch metrics, software keyboard, rotation
      # hit targets, system sheets, store screenshot capture). Those run only
      # as the `pitchperfect-ui` / `tagmaster-ui` suites when `extended-ui`
      # is set (weekly schedule and workflow_dispatch), so this step only
      # builds the separate pitchperfectUITests scheme on those runs; the
      # tagmaster scheme already includes tagmasterUITests as a testable.
      #
      # Do NOT delete the pitchperfectUITests scheme or the tagmasterUITests
      # target: scripts/release/capture.py builds `-scheme pitchperfectUITests`
      # (scripts/release/apps.json ios_scheme) and runs
      # `-only-testing:<app>UITests/StoreScreenshotTests` for both apps, so
      # release-assets.yml -> release.yml depends on them for store screenshots.
      - name: Build optional Pitch Perfect UI tests
        if: inputs.app == 'pitchperfect' && inputs.extended-ui
        run: |
          set -o pipefail
          xcodebuild build-for-testing -enableCodeCoverage YES -jobs 2 \
            -derivedDataPath DerivedData -workspace iOS.xcworkspace \
            -clonedSourcePackagesDirPath SourcePackages -scheme pitchperfectUITests \
            -destination '${{ steps.build_simulator.outputs.destination }}' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO SDKROOT=iphonesimulator | xcpretty --color

      - name: Select independent test suites
        id: matrix
        env:
          EXTENDED_UI: ${{ inputs.extended-ui }}
        run: |
          options=()
          if [ "$EXTENDED_UI" = true ]; then options+=(--extended); fi
          python3 ../scripts/ci/ios_suites.py validate-products --app "$IOS_APP" "${options[@]}"
          echo "matrix=$(python3 ../scripts/ci/ios_suites.py matrix --app "$IOS_APP" "${options[@]}")" >> "$GITHUB_OUTPUT"

      - name: Package compiled tests
        run: |
          xcodebuild -version > xcode-version.txt
          # Tar preserves executable modes and framework symlinks across runners.
          tar -czf ios-test-products.tar.gz -C DerivedData/Build Products

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-test-products-${{ inputs.app }}
          path: |
            iOS/ios-test-products.tar.gz
            iOS/xcode-version.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Delete build destination
        if: always() && steps.build_simulator.outputs.udid != ''
        timeout-minutes: 2
        env:
          SIMULATOR_UDID: ${{ steps.build_simulator.outputs.udid }}
        run: python3 ../scripts/ci/ios_simulator.py --delete "$SIMULATOR_UDID"

  suites:
    name: iOS tests (${{ matrix.job }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Keep this >= the largest per-app job count so no job waits for a
      # second wave (PRs: one job per app; extended runs add one UI job per
      # app). GitHub's own macOS concurrency limit still
      # applies on top of this, so raising it can only help, never hurt.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      IOS_SIMULATOR_VERSION: '26.5'
      IOS_SIMULATOR_DEVICE: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
      IOS_MAX_TEST_SECONDS: ${{ matrix.timeout }}
      # Space-separated suites that share this runner (scripts/ci/ios_suites.py JOBS).
      IOS_SUITES: ${{ matrix.suites }}
      IOS_JOB: ${{ matrix.job }}
      IOS_APP: ${{ inputs.app }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ios-test-products-${{ inputs.app }}
          path: iOS
      - name: Restore matching native test products
        run: |
          diff -u xcode-version.txt <(xcodebuild -version)
          mkdir -p DerivedData/Build
          tar -xzf ios-test-products.tar.gz -C DerivedData/Build
      - name: Create owned iOS Simulator
        id: simulator
        run: python3 ../scripts/ci/ios_simulator.py
      - name: Run native suites
        env:
          SIMULATOR_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          for suite in $IOS_SUITES; do
            echo "::group::$suite"
            python3 ../scripts/ci/ios_suites.py run "$suite" "$SIMULATOR_DESTINATION" \
              | tee "$suite-test.log"
            echo "::endgroup::"
          done
      - name: Verify actual XCTest results
        if: always()
        run: |
          read -ra suites <<< "$IOS_SUITES"
          python3 ../scripts/ci/ios_test_results.py "${suites[@]}"
      - name: Export suite coverage
        if: always()
        run: |
          for suite in $IOS_SUITES; do
            if [ -d "$suite-results.xcresult" ]; then
              xcrun xccov view --report --json "$suite-results.xcresult" > "$suite-coverage.json"
              xcrun xccov view --report "$suite-results.xcresult" > "$suite-coverage.txt"
            fi
          done
      - name: Upload test summaries and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-test-results-${{ matrix.job }}
          path: |
            iOS/*-summary.json
            iOS/*-junit.xml
            iOS/*-coverage.json
            iOS/*-coverage.txt
            iOS/*-test.log
            iOS/simulator-*.txt
          retention-days: 14
      - name: Archive raw failure results
        if: failure()
        run: |
          for suite in $IOS_SUITES; do
            if [ -d "$suite-results.xcresult" ]; then
              tar -czf "$suite-xcresults.tgz" "$suite-results.xcresult"
            fi
          done
      - name: Upload raw failure results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-xcresults-${{ matrix.job }}
          path: iOS/*-xcresults.tgz
          retention-days: 7
      - name: Delete owned iOS Simulator
        if: always() && steps.simulator.outputs.udid != ''
        timeout-minutes: 2
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: python3 ../scripts/ci/ios_simulator.py --delete "$SIMULATOR_UDID"

