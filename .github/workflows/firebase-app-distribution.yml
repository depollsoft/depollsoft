name: Firebase App Distribution

on:
  workflow_run:
    workflows: ["PR Preview"]
    types: [completed]

concurrency:
  group: firebase-app-distribution-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Resolve PR Preview metadata
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, heavy]
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      pr-title: ${{ steps.resolve.outputs.pr-title }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      commit-message: ${{ steps.resolve.outputs.commit-message }}
    steps:
      - name: Resolve source pull request
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PAYLOAD_PR_NUMBER: >-
            ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$PAYLOAD_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.base.ref == "main")][0].number // empty')"
          fi
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
              --jq '.artifacts[].name
                | select(startswith("android-preview-"))
                | split("-")[2]' | head -1)"
          fi
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve source pull request number." >&2
            exit 1
          fi
          pr_title="$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .title)"
          commit_message="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" \
            --jq '.commit.message | split("\n")[0]')"
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr-title=$pr_title" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "commit-message=$commit_message" >> "$GITHUB_OUTPUT"

  android:
    name: Android — ${{ matrix.app }}
    needs: metadata
    if: needs.metadata.result == 'success'
    runs-on: [self-hosted, Linux, heavy]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: PitchPerfect
            apk: PitchPerfect-private.apk
            firebase_app_id: "1:402153260205:android:76066360519819b891f224"
          - app: TagMaster
            apk: TagMaster-private.apk
            firebase_app_id: "1:572337670650:android:50e818820a9098fb4bbc43"

    steps:
      - name: Download private APKs from PR Preview
        uses: actions/download-artifact@v4
        with:
          pattern: "android-preview-*"
          path: preview-artifacts/android
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Firebase credentials
        id: firebase
        env:
          FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          credentials="$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          if [[ "$app" == "PitchPerfect" ]]; then
            value="$FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON"
          else
            value="$FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON"
          fi
          if [[ -z "$value" ]]; then
            echo "Missing Firebase credentials for $app." >&2
            exit 1
          fi
          printf '%s' "$value" > "$credentials"
          chmod 600 "$credentials"
          echo "credentials_file=$credentials" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: >-
            ${{ steps.firebase.outputs.credentials_file }}
          PR_NUMBER: ${{ needs.metadata.outputs.pr-number }}
          PR_TITLE: ${{ needs.metadata.outputs.pr-title }}
          COMMIT_SHA: ${{ needs.metadata.outputs.head-sha }}
          COMMIT_MESSAGE: ${{ needs.metadata.outputs.commit-message }}
          TESTER_GROUPS: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
        shell: bash
        run: |
          set -euo pipefail
          apk="preview-artifacts/android/${{ matrix.apk }}"
          test -f "$apk"
          release_notes="$(printf 'PR #%s: %s\nLatest commit: %s\nCommit: %s' \
            "$PR_NUMBER" "$PR_TITLE" "$COMMIT_MESSAGE" "$COMMIT_SHA")"
          npx --yes firebase-tools@15.28.2 \
            appdistribution:distribute "$apk" \
            --app "${{ matrix.firebase_app_id }}" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$release_notes"

      - name: Remove Firebase credentials and artifacts
        if: always()
        shell: bash
        run: |
          app="${{ matrix.app }}"
          rm -f "$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          rm -rf preview-artifacts

  ios-build:
    name: Build iOS — ${{ matrix.app }}
    needs: metadata
    if: needs.metadata.result == 'success'
    runs-on: [self-hosted, macOS, heavy]
    timeout-minutes: 40
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: PitchPerfect
            archive: PitchPerfect-private.xcarchive
            ipa: PitchPerfect-private.ipa
            firebase_app_id: "1:402153260205:ios:9eb7589d0e3abe5b91f224"
          - app: TagMaster
            archive: TagMaster-private.xcarchive
            ipa: TagMaster-private.ipa
            firebase_app_id: "1:572337670650:ios:5a5295f5bb91237e4bbc43"

    steps:
      - name: Checkout trusted distribution tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Download unsigned archives from PR Preview
        uses: actions/download-artifact@v4
        with:
          pattern: "ios-preview-*"
          path: preview-artifacts/ios
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          zip="preview-artifacts/ios/${{ matrix.archive }}.zip"
          test -f "$zip"
          ditto -x -k "$zip" preview-artifacts/ios
          test -d "preview-artifacts/ios/${{ matrix.archive }}"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode.app/Contents/Developer
          if [[ ! -d "$developer_dir" ]]; then
            developer_dir="$(xcode-select -p 2>/dev/null || true)"
          fi
          if [[ -z "$developer_dir" || ! -d "$developer_dir" ]]; then
            echo "No usable Xcode installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iOS

      - name: Restore readonly signing repository
        env:
          MATCH_REPOSITORY_ARCHIVE_PART_1: >-
            ${{ secrets.MATCH_REPOSITORY_ARCHIVE_PART_1 }}
          MATCH_REPOSITORY_ARCHIVE_PART_2: >-
            ${{ secrets.MATCH_REPOSITORY_ARCHIVE_PART_2 }}
        shell: bash
        run: |
          set -euo pipefail
          run_key="$GITHUB_RUN_ID-${{ matrix.app }}"
          source="$RUNNER_TEMP/match-source-$run_key"
          remote="$RUNNER_TEMP/match-remote-$run_key.git"
          archive="$RUNNER_TEMP/match-$run_key.tgz"
          rm -rf "$source" "$remote" "$archive"
          mkdir -p "$source"
          export MATCH_ARCHIVE_PATH="$archive"
          python3 - <<'PY'
          import base64
          import os

          encoded = (
              os.environ["MATCH_REPOSITORY_ARCHIVE_PART_1"]
              + os.environ["MATCH_REPOSITORY_ARCHIVE_PART_2"]
          )
          with open(os.environ["MATCH_ARCHIVE_PATH"], "wb") as output:
              output.write(base64.b64decode(encoded, validate=True))
          PY
          tar -xzf "$archive" -C "$source"
          git -C "$source" init -b master
          git -C "$source" config user.name 'github-actions[bot]'
          git -C "$source" config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$source" add .
          git -C "$source" commit -m 'Restore encrypted signing assets'
          git clone --bare "$source" "$remote"
          echo "MATCH_GIT_URL=file://$remote" >> "$GITHUB_ENV"

      - name: Export signed private IPA
        working-directory: iOS
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        shell: bash
        run: >-
          bundle exec fastlane export_firebase_private
          app:${{ matrix.app }}
          archive:"$GITHUB_WORKSPACE/preview-artifacts/ios/${{
            matrix.archive
          }}"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: >-
            firebase-ios-${{ github.event.workflow_run.id }}-${{ matrix.app }}
          path: iOS/build/${{ matrix.ipa }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing material and build artifacts
        if: always()
        shell: bash
        run: |
          app="${{ matrix.app }}"
          run_key="$GITHUB_RUN_ID-${app}"
          rm -f "$RUNNER_TEMP/match-${run_key}.tgz"
          rm -rf \
            "$RUNNER_TEMP/match-source-${run_key}" \
            "$RUNNER_TEMP/match-remote-${run_key}.git" \
            preview-artifacts \
            iOS/build

  ios-publish:
    name: Publish iOS — ${{ matrix.app }}
    needs: [metadata, ios-build]
    if: needs.ios-build.result == 'success'
    runs-on: [self-hosted, macOS, light]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: PitchPerfect
            ipa: PitchPerfect-private.ipa
            firebase_app_id: "1:402153260205:ios:9eb7589d0e3abe5b91f224"
          - app: TagMaster
            ipa: TagMaster-private.ipa
            firebase_app_id: "1:572337670650:ios:5a5295f5bb91237e4bbc43"

    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: >-
            firebase-ios-${{ github.event.workflow_run.id }}-${{ matrix.app }}
          path: signed-ios

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Firebase credentials
        id: firebase
        env:
          FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          credentials="$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          if [[ "$app" == "PitchPerfect" ]]; then
            value="$FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON"
          else
            value="$FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON"
          fi
          if [[ -z "$value" ]]; then
            echo "Missing Firebase credentials for $app." >&2
            exit 1
          fi
          printf '%s' "$value" > "$credentials"
          chmod 600 "$credentials"
          echo "credentials_file=$credentials" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: >-
            ${{ steps.firebase.outputs.credentials_file }}
          PR_NUMBER: ${{ needs.metadata.outputs.pr-number }}
          PR_TITLE: ${{ needs.metadata.outputs.pr-title }}
          COMMIT_SHA: ${{ needs.metadata.outputs.head-sha }}
          COMMIT_MESSAGE: ${{ needs.metadata.outputs.commit-message }}
          TESTER_GROUPS: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="signed-ios/${{ matrix.ipa }}"
          test -f "$ipa"
          release_notes="$(printf 'PR #%s: %s\nLatest commit: %s\nCommit: %s' \
            "$PR_NUMBER" "$PR_TITLE" "$COMMIT_MESSAGE" "$COMMIT_SHA")"
          npx --yes firebase-tools@15.28.2 \
            appdistribution:distribute "$ipa" \
            --app "${{ matrix.firebase_app_id }}" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$release_notes"

      - name: Remove Firebase credentials and IPA
        if: always()
        shell: bash
        run: |
          app="${{ matrix.app }}"
          rm -f "$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          rm -rf signed-ios

  update-comments:
    name: Update Firebase distribution comments
    needs: [metadata, android, ios-publish]
    if: always() && needs.metadata.result == 'success'
    runs-on: [self-hosted, Linux, heavy]
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update preview and deploy comments
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ needs.metadata.outputs.pr-number }}
          SOURCE_SHA: ${{ needs.metadata.outputs.head-sha }}
          PR_TITLE: ${{ needs.metadata.outputs.pr-title }}
          COMMIT_MESSAGE: ${{ needs.metadata.outputs.commit-message }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios-publish.result }}
          RUN_URL: >-
            https://github.com/${{ github.repository }}/actions/runs/${{
              github.run_id
            }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const sourceSha = process.env.SOURCE_SHA;
            const succeeded =
              process.env.ANDROID_RESULT === 'success' &&
              process.env.IOS_RESULT === 'success';
            const status = succeeded ? '✅ Published' : '❌ Failed';
            const runLink = `[View run](${process.env.RUN_URL})`;
            const contextLine =
              `${process.env.PR_TITLE} · ${process.env.COMMIT_MESSAGE}`;
            const value = `${status} · ${runLink}<br>${contextLine}`;
            const previewMarker =
              '<!-- Sticky Pull Request Commentpreview-build -->';
            const deployMarker = '<!-- preview-deploy-status -->';
            const firebaseMarker = '<!-- firebase-app-distribution -->';
            const readMeta = (body, key) => {
              const match = body.match(new RegExp(`<!-- ${key}:(.*?) -->`));
              return match?.[1]?.trim() || '';
            };
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 },
            );

            for (const comment of comments) {
              const body = comment.body || '';
              const isPreview =
                body.includes(previewMarker) &&
                readMeta(body, 'preview-build-source-sha') === sourceSha;
              const isDeploy =
                body.includes(deployMarker) &&
                readMeta(body, 'preview-deploy-source-sha') === sourceSha;
              if (!isPreview && !isDeploy) continue;

              let updated = body;
              if (isPreview) {
                const row = `| **Firebase App Distribution** | ${value} |`;
                const pattern = new RegExp(
                  '^\\| \\*\\*Firebase App Distribution\\*\\* \\|.*\\|$',
                  'm',
                );
                if (pattern.test(updated)) {
                  updated = updated.replace(pattern, row);
                } else {
                  const iOSRow = /^(\| \*\*iOS Status\*\* \|.*\|)$/m;
                  updated = updated.replace(iOSRow, `$1\n${row}`);
                }
              } else {
                const section = [
                  '### Firebase App Distribution',
                  '',
                  value,
                  '',
                  firebaseMarker,
                ].join('\n');
                const pattern = new RegExp(
                  '### Firebase App Distribution[\\s\\S]*?' +
                    '<!-- firebase-app-distribution -->',
                );
                updated = pattern.test(updated)
                  ? updated.replace(pattern, section)
                  : `${updated}\n\n${section}`;
              }

              if (updated !== body) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                  body: updated,
                });
              }
            }
