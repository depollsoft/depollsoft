name: Firebase App Distribution

on:
  workflow_run:
    workflows: ["PR Preview"]
    types: [completed]

concurrency:
  group: firebase-app-distribution-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Resolve PR Preview metadata
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux]
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
    steps:
      - name: Resolve source pull request
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PAYLOAD_PR_NUMBER: >-
            ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$PAYLOAD_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.base.ref == "main")][0].number // empty')"
          fi
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
              --jq '.artifacts[].name
                | select(startswith("android-preview-"))
                | split("-")[2]' | head -1)"
          fi
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Unable to resolve source pull request number." >&2
            exit 1
          fi
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  android:
    name: Android — ${{ matrix.app }}
    needs: metadata
    if: needs.metadata.result == 'success'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: PitchPerfect
            apk: PitchPerfect-private.apk
            firebase_app_id: "1:402153260205:android:76066360519819b891f224"
          - app: TagMaster
            apk: TagMaster-private.apk
            firebase_app_id: "1:572337670650:android:50e818820a9098fb4bbc43"

    steps:
      - name: Download private APKs from PR Preview
        uses: actions/download-artifact@v4
        with:
          pattern: "android-preview-*"
          path: preview-artifacts/android
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Firebase credentials
        id: firebase
        env:
          FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          credentials="$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          if [[ "$app" == "PitchPerfect" ]]; then
            value="$FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON"
          else
            value="$FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON"
          fi
          if [[ -z "$value" ]]; then
            echo "Missing Firebase credentials for $app." >&2
            exit 1
          fi
          printf '%s' "$value" > "$credentials"
          chmod 600 "$credentials"
          echo "credentials_file=$credentials" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: >-
            ${{ steps.firebase.outputs.credentials_file }}
          PR_NUMBER: ${{ needs.metadata.outputs.pr-number }}
          COMMIT_SHA: ${{ needs.metadata.outputs.head-sha }}
          TESTER_GROUPS: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
        shell: bash
        run: |
          set -euo pipefail
          apk="preview-artifacts/android/${{ matrix.apk }}"
          test -f "$apk"
          release_notes="$(printf 'PR #%s\nCommit: %s' \
            "$PR_NUMBER" "$COMMIT_SHA")"
          npx --yes firebase-tools@15.28.2 \
            appdistribution:distribute "$apk" \
            --app "${{ matrix.firebase_app_id }}" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$release_notes"

      - name: Remove Firebase credentials and artifacts
        if: always()
        shell: bash
        run: |
          app="${{ matrix.app }}"
          rm -f "$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          rm -rf preview-artifacts

  ios:
    name: iOS — ${{ matrix.app }}
    needs: metadata
    if: needs.metadata.result == 'success'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: PitchPerfect
            archive: PitchPerfect-private.xcarchive
            ipa: PitchPerfect-private.ipa
            firebase_app_id: "1:402153260205:ios:9eb7589d0e3abe5b91f224"
          - app: TagMaster
            archive: TagMaster-private.xcarchive
            ipa: TagMaster-private.ipa
            firebase_app_id: "1:572337670650:ios:5a5295f5bb91237e4bbc43"

    steps:
      - name: Checkout trusted distribution tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Download unsigned archives from PR Preview
        uses: actions/download-artifact@v4
        with:
          pattern: "ios-preview-*"
          path: preview-artifacts/ios
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          zip="preview-artifacts/ios/${{ matrix.archive }}.zip"
          test -f "$zip"
          ditto -x -k "$zip" preview-artifacts/ios
          test -d "preview-artifacts/ios/${{ matrix.archive }}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode.app/Contents/Developer
          if [[ ! -d "$developer_dir" ]]; then
            developer_dir="$(xcode-select -p 2>/dev/null || true)"
          fi
          if [[ -z "$developer_dir" || ! -d "$developer_dir" ]]; then
            echo "No usable Xcode installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iOS

      - name: Configure persistent signing repository
        env:
          MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
          MATCH_GIT_BASIC_AUTHORIZATION: >-
            ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MATCH_GIT_BASIC_AUTHORIZATION:-}" ]]; then
            auth_url="$(python3 - <<'PY'
          import base64
          import binascii
          import os
          import urllib.parse

          raw = os.environ["MATCH_GIT_BASIC_AUTHORIZATION"].strip()
          for prefix in ("authorization: basic ", "basic "):
              if raw.lower().startswith(prefix):
                  raw = raw[len(prefix):].strip()
          try:
              decoded = base64.b64decode(raw, validate=True).decode()
          except (binascii.Error, UnicodeDecodeError):
              decoded = ""
          credential = decoded if ":" in decoded else raw
          if ":" not in credential:
              credential = f"x-access-token:{credential}"
          username, password = credential.split(":", 1)
          print(
              "https://"
              f"{urllib.parse.quote(username, safe='')}:"
              f"{urllib.parse.quote(password, safe='')}"
              "@github.com/depollsoft/certificates.git"
          )
          PY
            )"
            echo "::add-mask::$auth_url"
            echo "MATCH_GIT_URL=$auth_url" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z "${MATCH_GIT_SSH_KEY:-}" ]]; then
            echo "Missing Match repository credentials." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/match-git-key-${GITHUB_RUN_ID}"
          printf '%s\n' "$MATCH_GIT_SSH_KEY" > "$key_path"
          chmod 600 "$key_path"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh_opts='-o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          echo "GIT_SSH_COMMAND=ssh -i $key_path $ssh_opts" \
            >> "$GITHUB_ENV"
          echo "MATCH_GIT_URL=git@github.com:depollsoft/certificates.git" \
            >> "$GITHUB_ENV"

      - name: Export signed private IPA
        working-directory: iOS
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: >-
            ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        shell: bash
        run: >-
          bundle exec fastlane export_firebase_private
          app:${{ matrix.app }}
          archive:"$GITHUB_WORKSPACE/preview-artifacts/ios/${{
            matrix.archive
          }}"

      - name: Configure Firebase credentials
        id: firebase
        env:
          FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          credentials="$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          if [[ "$app" == "PitchPerfect" ]]; then
            value="$FIREBASE_PITCHPERFECT_SERVICE_ACCOUNT_JSON"
          else
            value="$FIREBASE_TAGMASTER_SERVICE_ACCOUNT_JSON"
          fi
          if [[ -z "$value" ]]; then
            echo "Missing Firebase credentials for $app." >&2
            exit 1
          fi
          printf '%s' "$value" > "$credentials"
          chmod 600 "$credentials"
          echo "credentials_file=$credentials" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: >-
            ${{ steps.firebase.outputs.credentials_file }}
          PR_NUMBER: ${{ needs.metadata.outputs.pr-number }}
          COMMIT_SHA: ${{ needs.metadata.outputs.head-sha }}
          TESTER_GROUPS: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="iOS/build/${{ matrix.ipa }}"
          test -f "$ipa"
          release_notes="$(printf 'PR #%s\nCommit: %s' \
            "$PR_NUMBER" "$COMMIT_SHA")"
          npx --yes firebase-tools@15.28.2 \
            appdistribution:distribute "$ipa" \
            --app "${{ matrix.firebase_app_id }}" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$release_notes"

      - name: Remove signing material, credentials, and artifacts
        if: always()
        shell: bash
        run: |
          app="${{ matrix.app }}"
          rm -f \
            "$RUNNER_TEMP/match-git-key-${GITHUB_RUN_ID}" \
            "$RUNNER_TEMP/firebase-${GITHUB_RUN_ID}-${app}.json"
          rm -rf preview-artifacts iOS/build
