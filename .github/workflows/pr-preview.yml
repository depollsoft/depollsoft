name: PR Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - 'Android/**'
      - 'iOS/**'
      - '.github/workflows/pr-preview.yml'
      - '.github/workflows/preview-deploy-command.yml'
      - '.github/workflows/deploy-pr-preview.yml'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  compute-version:
    name: Compute Preview Build
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - id: version
        run: echo "build-number=$(( $(date +%s) / 10 ))" >> "$GITHUB_OUTPUT"

  comment-initial:
    name: PR Comment (Queued)
    runs-on: ubuntu-latest
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: marocchino/sticky-pull-request-comment@d4d6b0936434b21bc8345ad45a440c5f7d2c40ff # v3
        with:
          header: preview-build
          recreate: true
          message: |
            ## 📱 Preview Build

            | | Details |
            |---|---|
            | **PR** | #${{ github.event.pull_request.number }} |
            | **Build** | `${{ needs.compute-version.outputs.build-number }}` |
            | **Android Status** | ⏳ Building |
            | **iOS Status** | ⏳ Building |

            ### Install
            | Platform | Link |
            |----------|------|
            | 🍎 **iOS** | Available after a `/deploy` preview promotion |
            | 🤖 **Android (APK)** | [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ### Promote
            Comment `/deploy` on this PR to build and upload the current PR head to TestFlight and the Play Store internal track.

            > Build triggered by `${{ github.event.pull_request.head.sha }}`
            <!-- preview-build-source-sha:${{ github.event.pull_request.head.sha }} -->
            <!-- preview-build-number:${{ needs.compute-version.outputs.build-number }} -->
            <!-- preview-build-run-id:${{ github.run_id }} -->

  build-android:
    name: Build Android Preview
    runs-on: ubuntu-latest
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      artifact-id: ${{ steps.upload_apks.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'

      - name: Build private preview APKs
        working-directory: Android
        run: ./gradlew :PitchPerfect:assemblePrivate :TagMaster:assemblePrivate --stacktrace --console=plain --no-daemon

      - name: Collect preview APKs
        run: |
          mkdir -p preview-artifacts/android
          find Android -path '*/build/outputs/apk/private/*.apk' -type f -exec cp {} preview-artifacts/android/ \;
          ls -l preview-artifacts/android

      - name: Upload preview APKs
        id: upload_apks
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.event.pull_request.number }}-${{ needs.compute-version.outputs.build-number }}
          path: preview-artifacts/android/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Preview
    runs-on: [self-hosted, macOS]
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p 2>/dev/null || echo /Applications/Xcode.app/Contents/Developer)" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iOS

      - name: Install CocoaPods
        working-directory: iOS
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: pod install"
            if bundle exec pod install --repo-update; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Build preview apps
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild -workspace iOS.xcworkspace -scheme pitchperfect -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=depollsoft.pitchperfect.private ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Private INFOPLIST_KEY_CFBundleDisplayName='Pitch Perfect β' build | bundle exec xcpretty --color
          xcodebuild -workspace iOS.xcworkspace -scheme tagmaster -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=depollsoft.tagmaster.private ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Private INFOPLIST_KEY_CFBundleDisplayName='Tag Master β' build | bundle exec xcpretty --color

  comment-final:
    name: PR Comment (Final)
    runs-on: ubuntu-latest
    needs: [compute-version, build-android, build-ios]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - id: preview-status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statusFor = (result) => {
              switch (result) {
                case 'success':
                  return '✅ Built';
                case 'skipped':
                  return '⏭️ Skipped';
                case 'cancelled':
                  return '⛔ Cancelled';
                default:
                  return '❌ Failed';
              }
            };

            const artifactId = `${{ needs.build-android.outputs.artifact-id }}`.trim();
            const androidResult = '${{ needs.build-android.result }}';
            const iosResult = '${{ needs.build-ios.result }}';

            const androidLink = artifactId && androidResult === 'success'
              ? `[Download APKs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifactId})`
              : `[View workflow run](${runUrl})`;

            core.setOutput('android-status', statusFor(androidResult));
            core.setOutput('ios-status', statusFor(iosResult));
            core.setOutput('android-link', androidLink);

      - uses: marocchino/sticky-pull-request-comment@d4d6b0936434b21bc8345ad45a440c5f7d2c40ff # v3
        with:
          header: preview-build
          recreate: true
          message: |
            ## 📱 Preview Build

            | | Details |
            |---|---|
            | **PR** | #${{ github.event.pull_request.number }} |
            | **Build** | `${{ needs.compute-version.outputs.build-number }}` |
            | **Android Status** | ${{ steps.preview-status.outputs.android-status }} |
            | **iOS Status** | ${{ steps.preview-status.outputs.ios-status }} |

            ### Install
            | Platform | Link |
            |----------|------|
            | 🍎 **iOS** | Available after a `/deploy` preview promotion |
            | 🤖 **Android (APK)** | ${{ steps.preview-status.outputs.android-link }} |

            ### Promote
            Comment `/deploy` on this PR to build and upload the current PR head to TestFlight and the Play Store internal track.

            > Build triggered by `${{ github.event.pull_request.head.sha }}`
            <!-- preview-build-source-sha:${{ github.event.pull_request.head.sha }} -->
            <!-- preview-build-number:${{ needs.compute-version.outputs.build-number }} -->
            <!-- preview-build-run-id:${{ github.run_id }} -->
