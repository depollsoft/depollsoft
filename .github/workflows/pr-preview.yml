# yamllint disable rule:line-length
name: PR Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - "Android/**"
      - "iOS/**"
      - ".github/workflows/pr-preview.yml"
      - ".github/workflows/preview-deploy-command.yml"
      - ".github/workflows/deploy-pr-preview.yml"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  compute-version:
    name: Compute Preview Build
    runs-on: [self-hosted, Linux]
    outputs:
      build-number: ${{ steps.version.outputs.build-number }}
      commits-list: ${{ steps.commits.outputs.list }}
    steps:
      - id: version
        run: echo "build-number=$(( $(date +%s) / 10 ))" >> "$GITHUB_OUTPUT"

      - name: List PR commits
        id: commits
        continue-on-error: true
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const maxDisplay = 25;
            const sanitize = (value) =>
              value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/@/g, '@\u200b');

            const count = ${{ github.event.pull_request.commits }};
            const lastPage = Math.max(1, Math.ceil(count / 100));
            const {data: page} = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
              per_page: 100,
              page: lastPage,
            });
            page.reverse();
            const displayed = page.slice(0, maxDisplay);
            const lines = displayed.map((commit) => {
              const sha = commit.sha.substring(0, 7);
              const message = sanitize(commit.commit.message.split('\n')[0]);
              return `- \`${sha}\` ${message}`;
            });
            if (count > displayed.length) {
              lines.push(`- *... and ${count - displayed.length} more*`);
            }
            const summary =
              `${count} commit${count !== 1 ? 's' : ''} (newest first)`;
            const body = lines.join('\n');
            core.setOutput(
              'list',
              `### Commits\n\n<details>\n<summary>${summary}</summary>` +
                `\n\n${body}\n\n</details>`,
            );

  comment-initial:
    name: PR Comment (Queued)
    runs-on: [self-hosted, Linux]
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: write
      pull-requests: write
    env:
      RUN_URL: >-
        https://github.com/${{ github.repository }}/actions/runs/${{
        github.run_id }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BUILD_NUMBER: ${{ needs.compute-version.outputs.build-number }}
      PROMOTE_TEXT: >-
        Comment `/deploy` on this PR to build and upload the current PR head
        to TestFlight and the Play Store internal track.
    steps:
      # v3
      - uses: "marocchino/sticky-pull-request-comment@\
          d4d6b0936434b21bc8345ad45a440c5f7d2c40ff"
        with:
          header: preview-build
          recreate: true
          message: |
            ## 📱 Preview Build

            | | Details |
            |---|---|
            | **PR** | #${{ github.event.pull_request.number }} |
            | **Preview SHA** | `${{ github.event.pull_request.head.sha }}` |
            | **Build** | `${{ needs.compute-version.outputs.build-number }}` |
            | **Android Status** | ⏳ Building |
            | **iOS Status** | ⏳ Building |

            ### Install
            | Platform | Link |
            |----------|------|
            | 🍎 **iOS** | Available after a `/deploy` preview promotion |
            | 🤖 **Android (APK)** | [View workflow run](${{ env.RUN_URL }}) |

            ### Promote
            ${{ env.PROMOTE_TEXT }}

            ${{ needs.compute-version.outputs.commits-list }}

            > Build triggered by `${{ github.event.pull_request.head.sha }}`
            <!-- preview-build-source-sha:${{ env.HEAD_SHA }} -->
            <!-- preview-build-number:${{ env.BUILD_NUMBER }} -->
            <!-- preview-build-run-id:${{ github.run_id }} -->

  build-android:
    name: Build Android Preview
    runs-on: [self-hosted, Linux]
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      artifact-id: ${{ steps.upload_apks.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37.0 build-tools;36.0.0"

      - name: Build private preview APKs
        working-directory: Android
        run: >-
          ./gradlew
          :PitchPerfect:assemblePrivate
          :PitchPerfectWear:assemblePrivate
          :TagMaster:assemblePrivate
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          --max-workers=2
          -PDEPOLLSOFT_PRIVATE_BUILD_NUMBER=${{
            needs.compute-version.outputs.build-number
          }}
          -PDEPOLLSOFT_PRIVATE_PR_NUMBER=${{
            github.event.pull_request.number
          }}
          --stacktrace --console=plain --no-daemon

      - name: Collect preview APKs
        run: |
          mkdir -p preview-artifacts/android
          find Android \
            -path '*/build/outputs/apk/private/*.apk' \
            -type f \
            -exec cp {} preview-artifacts/android/ \;
          ls -l preview-artifacts/android

      - name: Upload preview APKs
        id: upload_apks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: >-
            ${{ format(
              'android-preview-{0}-{1}',
              github.event.pull_request.number,
              needs.compute-version.outputs.build-number
            ) }}
          path: preview-artifacts/android/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Preview
    runs-on: [self-hosted, macOS, heavy]
    needs: compute-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Select Xcode
        run: |
          developer_dir=/Applications/Xcode.app/Contents/Developer
          if [ ! -d "$developer_dir" ]; then
            developer_dir="$(xcode-select -p 2>/dev/null || true)"
          fi
          if [ -z "$developer_dir" ] || [ ! -d "$developer_dir" ]; then
            echo "No usable Xcode installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iOS

      - name: Cache SPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: >-
            preview-spm-v3-${{ runner.os }}-${{
              hashFiles('iOS/iOS.xcworkspace/xcshareddata/swiftpm/Package.resolved')
            }}

      - name: Resolve SPM dependencies
        working-directory: iOS
        run: |
          # SourcePackages/workspace-state.json embeds absolute paths. Never
          # reuse it across self-hosted runners with different work roots.
          rm -rf SourcePackages
          for attempt in 1 2; do
            xcodebuild -resolvePackageDependencies \
              -workspace iOS.xcworkspace \
              -scheme pitchperfect \
              -clonedSourcePackagesDirPath SourcePackages
            missing=0
            for artifact in \
              facebook-ios-sdk/FBSDKCoreKit/FBSDKCoreKit.xcframework \
              facebook-ios-sdk/FBSDKCoreKit_Basics/FBSDKCoreKit_Basics.xcframework \
              facebook-ios-sdk/FBAEMKit/FBAEMKit.xcframework \
              facebook-ios-sdk/FBSDKLoginKit/FBSDKLoginKit.xcframework \
              firebase-ios-sdk/FirebaseFirestoreInternal/FirebaseFirestoreInternal.xcframework \
              swift-package-manager-google-mobile-ads/GoogleMobileAds/GoogleMobileAds.xcframework \
              swift-package-manager-google-user-messaging-platform/UserMessagingPlatform/UserMessagingPlatform.xcframework \
              grpc-binary/grpc/grpc.xcframework \
              grpc-binary/grpcpp/grpcpp.xcframework \
              grpc-binary/openssl_grpc/openssl_grpc.xcframework \
              abseil-cpp-binary/absl/absl.xcframework; do
              if [ ! -f "SourcePackages/artifacts/$artifact/Info.plist" ]; then
                echo "Missing SPM binary artifact: $artifact"
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              exit 0
            fi
            echo "SPM binary artifacts are incomplete; resolving cleanly."
            rm -rf SourcePackages
          done
          echo "SPM binary artifacts are still missing after a clean resolve." >&2
          exit 1

      - name: Build unsigned private archives
        working-directory: iOS
        env:
          PRIVATE_BUILD_NUMBER: >-
            ${{ needs.compute-version.outputs.build-number }}
          PRIVATE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/preview-artifacts/ios"
          mkdir -p "$artifact_dir"

          cp pitchperfect/GoogleService-Info-Private.plist \
            pitchperfect/GoogleService-Info.plist
          cp tagmaster/GoogleService-Info-Private.plist \
            tagmaster/GoogleService-Info.plist
          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleDisplayName Pitch Perfect β' \
            pitchperfect/pitchperfect/pitchperfect-Info.plist
          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleDisplayName Tag Master β' \
            tagmaster/tagmaster/tagmaster-Info.plist
          for plist in \
            pitchperfect/pitchperfect/pitchperfect-Info.plist \
            tagmaster/tagmaster/tagmaster-Info.plist; do
            /usr/libexec/PlistBuddy \
              -c "Add :PrivateBuildNumber string $PRIVATE_BUILD_NUMBER" \
              "$plist"
            /usr/libexec/PlistBuddy \
              -c "Add :PrivatePRNumber string $PRIVATE_PR_NUMBER" \
              "$plist"
          done
          PRIVATE_BUILD_NUMBER="$PRIVATE_BUILD_NUMBER" bundle exec ruby <<'RUBY'
          require "xcodeproj"

          apps = {
            "pitchperfect/pitchperfect.xcodeproj" => [
              "pitchperfect",
              "depollsoft.pitchperfect.private",
            ],
            "tagmaster/tagmaster.xcodeproj" => [
              "tagmaster",
              "depollsoft.tagmaster.private",
            ],
          }
          apps.each do |path, (target_name, bundle_id)|
            project = Xcodeproj::Project.open(path)
            target = project.targets.find { |item| item.name == target_name }
            abort("Missing target #{target_name}") unless target
            target.build_configurations.each do |configuration|
              next unless configuration.name == "Release"
              settings = configuration.build_settings
              settings["PRODUCT_BUNDLE_IDENTIFIER"] = bundle_id
              settings["ASSETCATALOG_COMPILER_APPICON_NAME"] = "AppIcon-Private"
              settings["CURRENT_PROJECT_VERSION"] = ENV.fetch(
                "PRIVATE_BUILD_NUMBER",
              )
            end
            if target_name == "pitchperfect"
              widget = project.targets.find { |item| item.name == "PitchPerfectWidget" }
              abort("Missing PitchPerfectWidget target") unless widget
              widget.build_configurations.each do |configuration|
                next unless configuration.name == "Release"
                configuration.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] =
                  "depollsoft.pitchperfect.private.widget"
                configuration.build_settings["CURRENT_PROJECT_VERSION"] =
                  ENV.fetch("PRIVATE_BUILD_NUMBER")
              end
            end
            project.save
          end
          RUBY

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          apps = (
              (
                  Path("pitchperfect/pitchperfect/pitchperfect.entitlements"),
                  "depollsoft.pitchperfect",
              ),
              (
                  Path("pitchperfect/PitchPerfectWidget/PitchPerfectWidget.entitlements"),
                  "depollsoft.pitchperfect",
              ),
              (
                  Path("tagmaster/tagmaster/tagmaster.entitlements"),
                  "depollsoft.tagmaster",
              ),
          )

          def privatize(value, bundle_id):
              if isinstance(value, str):
                  return value.replace(bundle_id, f"{bundle_id}.private")
              if isinstance(value, list):
                  return [privatize(item, bundle_id) for item in value]
              return value

          for path, bundle_id in apps:
              data = plistlib.loads(path.read_bytes())
              data.pop("aps-environment", None)
              for key, value in tuple(data.items()):
                  data[key] = privatize(value, bundle_id)
              path.write_bytes(plistlib.dumps(data))
          PY

          # Several runners share one macOS host and, by default, one
          # ~/Library/Developer/Xcode/DerivedData. Concurrent archives then race
          # on the explicit-module cache and fail in PrecompileModule with no
          # diagnostic. Build in a per-run DerivedData instead, keep the raw
          # xcodebuild log (xcpretty hides the real error), and retry once from
          # a clean cache for anything transient.
          derived_data="$RUNNER_TEMP/DerivedData"
          archive_app() {
            scheme="$1"
            archive="$artifact_dir/$2.xcarchive"
            raw_log="$RUNNER_TEMP/$scheme-archive.log"
            set -o pipefail
            for attempt in 1 2; do
              rm -rf "$archive"
              if xcodebuild archive \
                -jobs 2 \
                -workspace iOS.xcworkspace \
                -clonedSourcePackagesDirPath SourcePackages \
                -derivedDataPath "$derived_data" \
                -scheme "$scheme" \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath "$archive" \
                CODE_SIGNING_ALLOWED=NO 2>&1 |
                  tee "$raw_log" |
                  bundle exec xcpretty --color; then
                break
              fi
              echo "::group::xcodebuild diagnostics ($scheme, attempt $attempt)"
              grep -nE "error:|fatal error|PrecompileModule|\*\* ARCHIVE FAILED" "$raw_log" | tail -40 || true
              echo "::endgroup::"
              if [ "$attempt" -eq 2 ]; then
                echo "Archiving $scheme failed twice." >&2
                exit 65
              fi
              echo "Archiving $scheme failed; retrying from a clean DerivedData."
              rm -rf "$derived_data"
            done
            ditto -c -k --sequesterRsrc --keepParent \
              "$archive" "$artifact_dir/$2.xcarchive.zip"
            rm -rf "$archive"
          }

          archive_app pitchperfect PitchPerfect-private
          archive_app tagmaster TagMaster-private

      - name: Upload unsigned iOS archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: >-
            ${{ format(
              'ios-preview-{0}-{1}',
              github.event.pull_request.number,
              needs.compute-version.outputs.build-number
            ) }}
          path: preview-artifacts/ios/*.xcarchive.zip
          if-no-files-found: error

  publish-android-sharing:
    name: Publish Android Internal App Sharing
    runs-on: [self-hosted, Linux]
    needs: [compute-version, build-android]
    if: >-
      needs.build-android.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      pitchperfect-url: ${{ steps.upload.outputs.pitchperfect-url }}
      wear-url: ${{ steps.upload.outputs.wear-url }}
      tagmaster-url: ${{ steps.upload.outputs.tagmaster-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Isolate Ruby gems
        run: |
          mkdir -p "$RUNNER_TEMP/ruby-gems"
          echo "GEM_HOME=$RUNNER_TEMP/ruby-gems" >> "$GITHUB_ENV"
          echo "GEM_PATH=$RUNNER_TEMP/ruby-gems" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ruby-gems/bin" >> "$GITHUB_PATH"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: Android

      - name: Download preview APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: >-
            ${{ format(
              'android-preview-{0}-{1}',
              github.event.pull_request.number,
              needs.compute-version.outputs.build-number
            ) }}
          path: preview-artifacts/android

      - name: Decode Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: >-
            ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="${RUNNER_TEMP}/play.json"
          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import sys

          raw = os.environ.get("PLAY_SERVICE_ACCOUNT_JSON", "").strip()
          if not raw:
              print("PLAY_SERVICE_ACCOUNT_JSON is empty.", file=sys.stderr)
              sys.exit(1)

          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError:
              try:
                  decoded = base64.b64decode(raw).decode("utf-8")
                  parsed = json.loads(decoded)
              except (
                  binascii.Error,
                  UnicodeDecodeError,
                  json.JSONDecodeError,
              ):
                  print(
                      "PLAY_SERVICE_ACCOUNT_JSON must be JSON or base64 JSON.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          with open(
              os.environ["PLAY_SERVICE_ACCOUNT_JSON_PATH"],
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(parsed, handle)
          PY
          printf 'PLAY_SERVICE_ACCOUNT_JSON_PATH=%s\n' \
            "$PLAY_SERVICE_ACCOUNT_JSON_PATH" >> "$GITHUB_ENV"

      - name: Upload preview APKs to Internal App Sharing
        id: upload
        working-directory: Android
        run: |
          set -euo pipefail

          upload_apk() {
            output_name="$1"
            package_name="$2"
            apk_name="$3"
            apk_path="${GITHUB_WORKSPACE}/preview-artifacts/android/${apk_name}"
            url_file="${RUNNER_TEMP}/${output_name}.txt"

            if [ ! -f "$apk_path" ]; then
              echo "Missing preview APK: $apk_path" >&2
              exit 1
            fi

            INTERNAL_APP_SHARING_URL_FILE="$url_file" \
              bundle exec fastlane internal_app_sharing \
                package_name:"$package_name" \
                apk_path:"$apk_path"

            url="$(tr -d '\r\n' < "$url_file")"
            if [ -z "$url" ]; then
              echo "Internal App Sharing returned no URL for $apk_name" >&2
              exit 1
            fi
            echo "${output_name}=${url}" >> "$GITHUB_OUTPUT"
          }

          upload_apk \
            pitchperfect-url \
            depollsoft.pitchperfect.private \
            PitchPerfect-private.apk
          upload_apk \
            wear-url \
            depollsoft.pitchperfect.private \
            PitchPerfectWear-private.apk
          upload_apk \
            tagmaster-url \
            depollsoft.tagmaster.private \
            TagMaster-private.apk

      - name: Clean up Play credentials
        if: always()
        run: rm -f "$PLAY_SERVICE_ACCOUNT_JSON_PATH"

  comment-finish:
    name: PR Comment (Complete)
    runs-on: [self-hosted, Linux]
    needs:
      - compute-version
      - comment-initial
      - build-android
      - build-ios
      - publish-android-sharing
    if: >-
      always() &&
      needs.compute-version.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish preview result
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ANDROID_RESULT: ${{ needs.build-android.result }}
          SHARING_RESULT: ${{ needs.publish-android-sharing.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          ANDROID_ARTIFACT_ID: ${{ needs.build-android.outputs.artifact-id }}
          PITCHPERFECT_URL: >-
            ${{ needs.publish-android-sharing.outputs.pitchperfect-url }}
          WEAR_URL: ${{ needs.publish-android-sharing.outputs.wear-url }}
          TAGMASTER_URL: >-
            ${{ needs.publish-android-sharing.outputs.tagmaster-url }}
        with:
          script: |
            const marker = '<!-- Sticky Pull Request Commentpreview-build -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.pull_request.number;
            const runUrl =
              `https://github.com/${owner}/${repo}` +
              `/actions/runs/${context.runId}`;
            const listComments = github.rest.issues.listComments;
            const comments = await github.paginate(listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const runMarker =
              `<!-- preview-build-run-id:${context.runId} -->`;
            const comment = comments.find(
              (candidate) =>
                candidate.user?.type === 'Bot' &&
                candidate.body?.includes(marker) &&
                candidate.body?.includes(runMarker),
            );

            if (!comment) {
              core.setFailed(
                'Could not find the queued preview comment for this run.',
              );
              return;
            }

            const status = (result, successText) => {
              switch (result) {
                case 'success':
                  return `✅ ${successText}`;
                case 'cancelled':
                  return '⛔ Cancelled';
                case 'skipped':
                  return '⏭️ Skipped';
                default:
                  return '❌ Failed';
              }
            };

            const artifactId = process.env.ANDROID_ARTIFACT_ID || '';
            const links = [
              ['Install Pitch Perfect', process.env.PITCHPERFECT_URL],
              ['Install Pitch Perfect Wear', process.env.WEAR_URL],
              ['Install Tag Master', process.env.TAGMASTER_URL],
            ]
              .filter(([, url]) => url)
              .map(([label, url]) => `[${label}](${url})`);
            if (artifactId) {
              links.push(
                '[Download all APKs]' +
                  `(${runUrl}/artifacts/${artifactId})`,
              );
            }
            const androidLink = links.length
              ? links.join('<br>')
              : `[View workflow run](${runUrl})`;

            let androidStatus = status(
              process.env.ANDROID_RESULT,
              'APKs ready',
            );
            if (process.env.ANDROID_RESULT === 'success') {
              androidStatus = status(
                process.env.SHARING_RESULT,
                'Internal App Sharing published',
              );
            }
            const iosStatus = status(
              process.env.IOS_RESULT,
              'builds validated',
            );

            const body = comment.body
              .replace(
                /\| \*\*Android Status\*\* \|.*\|/,
                `| **Android Status** | ${androidStatus} |`,
              )
              .replace(
                /\| \*\*iOS Status\*\* \|.*\|/,
                `| **iOS Status** | ${iosStatus} |`,
              )
              .replace(
                /\| 🤖 \*\*Android \(APK\)\*\* \|.*\|/,
                `| 🤖 **Android (APK)** | ${androidLink} |`,
              );

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: comment.id,
              body,
            });
