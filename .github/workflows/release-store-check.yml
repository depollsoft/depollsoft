name: Check production store history
on:
  pull_request:
    branches: [main]
    paths:
      - 'releases/**/release.json'
      - 'scripts/release/store_check.rb'
      - '.github/workflows/release-store-check.yml'
permissions:
  contents: read
jobs:
  stores:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iOS
      - name: Check selected production apps and unpublished builds
        working-directory: iOS
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          mapfile -t apps < <(git diff --name-only "$BASE_SHA" HEAD -- '../releases/*/release.json' | sed -n 's@^releases/\([^/]*\)/release.json$@\1@p')
          if [ "${#apps[@]}" -eq 0 ]; then
            echo 'No release plans changed.'
            exit 0
          fi
          bundle exec ruby ../scripts/release/store_check.rb "${apps[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: production-store-history
          path: build/release/store-history.json
          if-no-files-found: ignore
