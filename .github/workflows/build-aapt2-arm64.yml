name: Build AAPT2 ARM64

on:
  workflow_dispatch:
  schedule:
    # Rebuild monthly to get updates
    - cron: '0 0 1 * *'

jobs:
  build:
    name: Build AAPT2 for ARM64 Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build AAPT2 in ARM64 container
        run: |
          docker run --platform linux/arm64 --rm -v $PWD:/work ubuntu:22.04 bash -c "
            apt-get update && 
            apt-get install -y wget unzip openjdk-17-jdk-headless &&
            cd /work &&
            # Download Android command line tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip &&
            unzip -q commandlinetools-linux-11076708_latest.zip &&
            mkdir -p android-sdk/cmdline-tools &&
            mv cmdline-tools android-sdk/cmdline-tools/latest &&
            # Accept licenses and install build-tools
            yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses &&
            android-sdk/cmdline-tools/latest/bin/sdkmanager 'build-tools;35.0.0' &&
            # Extract AAPT2
            cp android-sdk/build-tools/35.0.0/aapt2 aapt2-arm64-linux &&
            chmod +x aapt2-arm64-linux &&
            ./aapt2-arm64-linux version || echo 'Binary built for ARM64'
          "
      
      - name: Verify AAPT2 binary
        run: |
          ls -lh aapt2-arm64-linux
          file aapt2-arm64-linux
      
      - name: Upload AAPT2 ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-arm64-linux
          path: aapt2-arm64-linux
          retention-days: 90
      
      - name: Create Release (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: aapt2-arm64-${{ github.run_number }}
          name: AAPT2 ARM64 Linux Binary
          files: aapt2-arm64-linux
          body: |
            AAPT2 binary built for ARM64 Linux
            Built from Android SDK Build Tools 35.0.0
            
            Usage: Download and use with android.aapt2FromMavenOverride property
