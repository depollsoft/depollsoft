# yamllint disable rule:line-length
name: API CI

permissions:
  contents: read

# Two pushes to main in quick succession would otherwise race two Cloud Run
# deploys; queue them so the last push is the last deploy.
concurrency:
  group: api-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
  workflow_dispatch:
  schedule:
    - cron: 30 0 * * 3

defaults:
  run:
    working-directory: api

jobs:
  deploy:
    name: Cloud Run Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: "auth"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup GCP Service Account
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Create geoip folder structure
        run: mkdir -p node_modules/geoip-lite/data

      - name: Download geoip data using gsutil
        run: gsutil -m cp -r gs://depollsoft-build-data/node_modules/geoip-lite/data node_modules/geoip-lite/

      - uses: whoan/docker-build-with-cache-action@79574702d64f46f39ecaf1f1d771d45230e10b93
        with:
          username: _json_key
          password: "${{ secrets.GCP_SA_KEY }}"
          registry: gcr.io
          image_name: api
          context: api

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d
        with:
          service: api
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/api
          region: us-west1
