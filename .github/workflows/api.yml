name: API CI

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  workflow_dispatch:


defaults:
  run:
    working-directory: api

jobs:
  update-geoip:
    name: Update geoip data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: NPM install
        run: npm install --production
      - name: Download data
        uses: actions/download-artifact@v2
        with:
          name: geo-data
          path: node_modules/geoip-lite/data
        continue-on-error: true
      - name: Update
        run: cd node_modules/geoip-lite && npm run-script updatedb license_key=${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Upload data
        uses: actions/upload-artifact@v2
        with:
          name: geo-data
          path: node_modules/geoip-lite/data
        retention-days: 400


  deploy:
    name: Cloud Run Deployment
    runs-on: ubuntu-latest
    needs: update-geoip
    steps:

      - name: Checkout
        uses: actions/checkout@master

      - name: Setup GCP Service Account
        uses: google-github-actions/setup-gcloud@master
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Download geoip data
        uses: actions/download-artifact@v2
        with:
          name: geo-data
          path: node_modules/geoip-lite/data

      - uses: whoan/docker-build-with-cache-action@v5
        with:
          username: _json_key
          password: "${{ secrets.GCP_SA_KEY }}"
          registry: gcr.io
          image_name: api
          context: api

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@main
        with:
          service: api
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/api
          region: us-west1
