# yamllint disable rule:line-length
name: GeoIP update

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * 3

jobs:
  update-geoip:
    name: Update geoip data
    runs-on: [self-hosted, Linux]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "16"
      - id: "auth"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Setup GCP Service Account
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: NPM install
        run: npm install geoip-lite
      - name: Download using gsutil
        run: gsutil -m cp -r gs://depollsoft-build-data/node_modules/geoip-lite/data node_modules/geoip-lite/
        continue-on-error: true
      - name: Update
        run: cd node_modules/geoip-lite && npm run-script updatedb license_key=${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Upload using gsutil
        run: gsutil -m cp -r node_modules/geoip-lite/data gs://depollsoft-build-data/node_modules/geoip-lite/
