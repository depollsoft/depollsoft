org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m
# The Kotlin compile daemon is shared by every module in one build. 512m was enough only
# while the build cache hid most compiles; a cold PitchPerfect + TagMaster compile on the
# 7 GB GitHub runners died with "Not enough memory to run compilation".
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.daemon=false
# Enable parallel project execution for faster builds
org.gradle.parallel=true
# Use all available cores (GitHub Actions runners have 2-4 cores)
org.gradle.workers.max=4
# Enable configuration cache for faster subsequent builds
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.enableJetifier=true
# Enable non-transitive R classes for faster builds
android.nonTransitiveRClass=true
# Use relative paths for reproducible builds and better caching
android.experimental.cacheCompileLibResources=true
# Disable automatic SDK component downloads during builds to prevent race conditions
# on self-hosted runners. All SDK components must be pre-installed before running Gradle.
android.builder.sdkDownload=false
