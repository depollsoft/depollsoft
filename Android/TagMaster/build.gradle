buildscript {
    repositories {
        google()
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

repositories {
    maven { url = 'https://maven.fabric.io/public' }
    google()
    mavenCentral()
}

ext {
    parseVersion = "1.26.0"
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:30.3.2')
    implementation project(':DepollSoftCommon')
    implementation project(':PitchPerfectLib')
    implementation project(':DepollSoftCommon.Compat')
    implementation project(':depollsoft.lib.kotlin')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "com.github.parse-community.Parse-SDK-Android:parse:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:facebook:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:ktx:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:coroutines:$parseVersion"
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
    implementation 'com.facebook.android:facebook-login:13.2.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'
    implementation 'com.firebaseui:firebase-ui-auth:8.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.1'
    implementation 'com.google.android.gms:play-services-auth:20.2.0'
    implementation 'com.firebaseui:firebase-ui-auth:8.0.1'
    implementation 'com.github.chrisbanes:PhotoView:2.0.0'
    implementation project(':bindroid')
    implementation project(':bindroid-kotlin')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.9.2'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    // Espresso UI Testing Dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.fragment:fragment-testing:1.6.0'
}

android {
    namespace = 'depollsoft.tagmaster'
    compileSdkVersion 34

    defaultConfig {
        multiDexEnabled = true
        applicationId "depollsoft.tagmaster"
        vectorDrawables.useSupportLibrary = true
        minSdkVersion 21
        targetSdkVersion 34
        resourceConfigurations += ['en']
        versionCode getVersionCode(build: 0, suffix: 1)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        // Disable animations for faster/more reliable UI tests in CI
        animationsDisabled = true
        
        managedDevices {
            localDevices {
                // ATD (Automated Test Device) - optimized for testing, no bloatware
                pixel2api30atd {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp-atd"
                }
                // Standard AOSP device for fallback
                pixel2api30 {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp"
                }
            }
            groups {
                // Default group for CI - uses ATD for faster execution
                ciDevices {
                    targetDevices.add(devices.pixel2api30atd)
                }
            }
        }
    }
}

apply plugin: 'com.google.gms.google-services'
