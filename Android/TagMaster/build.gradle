buildscript {
    repositories {
        google()
    }
}

apply plugin: 'com.android.application'

repositories {
    maven { url = 'https://maven.fabric.io/public' }
    google()
    mavenCentral()
}

ext {
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation project(':DepollSoftCommon')
    implementation project(':PitchPerfectLib')
    implementation project(':DepollSoftCommon.Compat')
    implementation project(':depollsoft.lib.kotlin')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
    implementation 'com.facebook.android:facebook-login:18.3.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.firebaseui:firebase-ui-auth:9.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation project(':bindroid')
    implementation project(':bindroid-kotlin')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    // Espresso UI Testing Dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.fragment:fragment-testing:1.9.0'
}

android {
    buildFeatures {
        buildConfig = true
    }

    namespace = 'depollsoft.tagmaster'
    compileSdk 37

    defaultConfig {
        multiDexEnabled = true
        applicationId "depollsoft.tagmaster"
        vectorDrawables.useSupportLibrary = true
        minSdk 24
        targetSdk 36
        resourceConfigurations += ['en']
        def privateBuildNumber = findProperty('DEPOLLSOFT_PRIVATE_BUILD_NUMBER')
        versionCode(privateBuildNumber == null
                ? getVersionCode(build: 0, suffix: 1)
                : (privateBuildNumber as Integer) * 10 + 1)
        buildConfigField "String", "PRIVATE_BUILD_NUMBER", '""'
        buildConfigField "String", "PRIVATE_PR_NUMBER", '""'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS") ?: 'depollsoft'
            keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD") ?: 'depollsoft'
            storeFile file(System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH") ?: '../debug.jks')
            storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD") ?: 'depollsoft'
        }
    }

    testOptions {
        // Disable animations for faster/more reliable UI tests in CI
        animationsDisabled = true

        // Robolectric needs the merged resources to inflate real layouts, which
        // is how the adaptive navigation and large-text behaviour are tested.
        unitTests {
            includeAndroidResources = true
        }

        managedDevices {
            localDevices {
                // ATD (Automated Test Device) - optimized for testing, no bloatware
                pixel2api30atd {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp-atd"
                }
                // Standard AOSP device for fallback
                pixel2api30 {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp"
                }
            }
            groups {
                // Default group for CI - uses ATD for faster execution
                ciDevices {
                    targetDevices.add(localDevices.pixel2api30atd)
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        create("private") {
            initWith release
            signingConfig signingConfigs.release
            applicationIdSuffix ".private"
            def privateNumber = findProperty("DEPOLLSOFT_PRIVATE_BUILD_NUMBER") ?: ""
            def privatePr = findProperty("DEPOLLSOFT_PRIVATE_PR_NUMBER") ?: ""
            buildConfigField "String", "PRIVATE_BUILD_NUMBER", "\"${privateNumber}\""
            buildConfigField "String", "PRIVATE_PR_NUMBER", "\"${privatePr}\""
            matchingFallbacks = ['release']
        }
    }
}

apply plugin: 'com.google.gms.google-services'
