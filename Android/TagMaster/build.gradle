buildscript {
    repositories {
        google()
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

repositories {
    maven { url 'https://maven.fabric.io/public' }
    google()
    mavenCentral()
}

ext {
    parseVersion = "1.26.0"
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:30.3.2')
    implementation project(':DepollSoftCommon')
    implementation project(':PitchPerfectLib')
    implementation project(':DepollSoftCommon.Compat')
    implementation project(':depollsoft.lib.kotlin')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "com.github.parse-community.Parse-SDK-Android:parse:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:facebook:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:ktx:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:coroutines:$parseVersion"
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
    implementation 'com.facebook.android:facebook-login:16.1.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'
    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.2'
    implementation 'com.google.android.gms:play-services-auth:20.6.0'
    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation project(':bindroid')
    implementation project(':bindroid-kotlin')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    def composeBom = platform('androidx.compose:compose-bom:2023.06.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Choose one of the following:
    // Material Design 3
    implementation 'androidx.compose.material3:material3'
    // or Material Design 2
    // implementation 'androidx.compose.material:material'
    // or skip Material Design and build directly on top of foundational components
    // implementation 'androidx.compose.foundation:foundation'
    // or only import the main APIs for the underlying toolkit systems,
    // such as input and measurement/layout
    // implementation 'androidx.compose.ui:ui'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Optional - Included automatically by material, only add when you need
    // the icons but not the material library (e.g. when using Material3 or a
    // custom design system based on Foundation)
    implementation 'androidx.compose.material:material-icons-core'
    // Optional - Add full set of material icons
    implementation 'androidx.compose.material:material-icons-extended'
    // Optional - Add window size utils
    implementation 'androidx.compose.material3:material3-window-size-class'

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.7.2'
    // Optional - Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    // Optional - Integration with LiveData
    implementation 'androidx.compose.runtime:runtime-livedata'
    // Optional - Integration with RxJava
    implementation 'androidx.compose.runtime:runtime-rxjava2'
}

android {
    compileSdkVersion 33

    defaultConfig {
        multiDexEnabled true
        applicationId "depollsoft.tagmaster"
        vectorDrawables.useSupportLibrary = true
        minSdkVersion 21
        targetSdkVersion 33
        resourceConfigurations += ['en']
        versionCode getVersionCode(build: 0, suffix: 1)
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }

        // Move the tests to tests/java, tests/res, etc...
        androidTest.setRoot('tests')

        // Move the build types to build-types/<type>
        // For instance, build-types/debug/java, build-types/debug/AndroidManifest.xml, ...
        // This moves them out of them default location under src/<type>/... which would
        // conflict with src/ being used by the main source set.
        // Adding new build types or product flavors should be accompanied
        // by a similar customization.
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    buildFeatures {
        compose true
        renderScript true
        aidl true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.8"
    }

    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    namespace "depollsoft.tagmaster"
}

apply plugin: 'com.google.gms.google-services'
