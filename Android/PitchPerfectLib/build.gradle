apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

dependencies {
    api fileTree(include: '*.jar', dir: 'libs')
    api project(':DepollSoftCommon')
    implementation platform(compose_bom)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

android {
    namespace = 'depollsoft.pitchperfect.lib'
    compileSdk 37

    buildFeatures {
        compose = true
    }

    defaultConfig {
        minSdk 23
    }
}

// Ships shared/pitchperfect/instrument-tuning.json as an asset (docs/pitchperfect-note-sounds.md).
// Only that file: the SoundFont beside it is for iOS, since Android plays its own MIDI synth.
abstract class InstrumentTuningAsset extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getSource()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        def target = outputDir.get().file('instrument-tuning.json').asFile
        target.parentFile.mkdirs()
        target.bytes = source.get().asFile.bytes
    }
}

def instrumentTuningAsset = tasks.register('instrumentTuningAsset', InstrumentTuningAsset) {
    source = rootProject.file('../shared/pitchperfect/instrument-tuning.json')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(instrumentTuningAsset) { it.outputDir }
    }
}
