# Robolectric configuration
# SDK version to use for all tests (API 28 = Android 9.0)
sdk=28

# Use legacy resources mode for compatibility
qualifiers=w360dp-h640dp-mdpi

# Note: Do NOT set includeAndroidResources=true in build.gradle as it causes
# the Application class to be initialized, which fails due to SDK dependencies.
# Individual tests use @Config(manifest = Config.NONE) to avoid this.
