buildscript {
    repositories {
        google()
    }
}
apply plugin: 'com.android.application'

repositories {
    mavenCentral()
}

ext {
    parseVersion = "3.0.0"
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.8.0')
    def billing_version = "7.1.1"
    implementation "com.android.billingclient:billing:$billing_version"
    implementation "com.android.billingclient:billing-ktx:$billing_version"
    implementation fileTree(include: '*.jar', dir: 'libs')
    implementation project(':PitchPerfectLib')
    implementation project(':DepollSoftCommon')
    implementation project(':DepollSoftCommon.Compat')
    implementation project(':depollsoft.lib.kotlin')
    implementation project(':bindroid')
    implementation project(':bindroid-kotlin')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
    implementation 'com.facebook.android:facebook-android-sdk:17.0.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation "com.github.parse-community.Parse-SDK-Android:parse:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:facebook:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:ktx:$parseVersion"
    implementation "com.github.parse-community.Parse-SDK-Android:coroutines:$parseVersion"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.firebaseui:firebase-ui-auth:9.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test:rules:1.6.1'
    testImplementation 'androidx.test:runner:1.6.2'
    testImplementation 'androidx.fragment:fragment-testing:1.8.5'

    // Espresso UI Testing Dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-idling-resource:3.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.fragment:fragment-testing:1.8.5'
    
    // Test Orchestrator for isolated test execution (prevents state leakage between tests)
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
}

android {
    signingConfigs {
        debug {
            keyAlias 'depollsoft'
            keyPassword 'depollsoft'
            storeFile file('../debug.jks')
            storePassword 'depollsoft'
        }
    }
    namespace = 'depollsoft.pitchperfect'
    compileSdk 35

    sourceSets {
        // Build type specific resources (e.g., ad unit IDs)
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    defaultConfig {
        applicationId "depollsoft.pitchperfect"
        minSdk 24
        targetSdk 35
        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true
        versionCode getVersionCode(build: 0, suffix: 0)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Enable Test Orchestrator for isolated test execution
        // This prevents state leakage between tests and improves reliability
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    testOptions {
        // NOTE: Test Orchestrator disabled for faster execution (was adding ~30s+ per test)
        // Re-enable if test isolation issues occur with more tests:
        // execution 'ANDROIDX_TEST_ORCHESTRATOR'
        
        // Animation settings for faster/more reliable UI tests
        animationsDisabled = true
        
        managedDevices {
            localDevices {
                // ATD (Automated Test Device) - optimized for testing, no bloatware
                pixel2api30atd {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp-atd"
                }
                // Standard AOSP device for fallback
                pixel2api30 {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp"
                }
            }
            groups {
                // Default group for CI - uses ATD for faster execution
                ciDevices {
                    targetDevices.add(localDevices.pixel2api30atd)
                }
            }
        }
    }
}

apply plugin: 'com.google.gms.google-services'
