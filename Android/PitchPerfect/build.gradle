import com.android.build.api.instrumentation.FramesComputationMode
import com.android.build.api.instrumentation.InstrumentationScope
import depollsoft.instrumentation.FirebaseUiNullEmailClassVisitorFactory

buildscript {
    repositories {
        google()
    }
}
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'io.github.takahirom.roborazzi'

repositories {
    mavenCentral()
}

ext {
}

dependencies {
    implementation platform(compose_bom)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    // Material (not Material 3): the plate theme was built on MaterialComponents, and these are
    // the controls whose metrics match it (switch, radio button, ripple, menus).
    implementation 'androidx.compose.material:material'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation platform(compose_bom)
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation "io.github.takahirom.roborazzi:roborazzi:$roborazzi_version"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:$roborazzi_version"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:$roborazzi_version"
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    def billing_version = "9.1.0"
    implementation "com.android.billingclient:billing:$billing_version"
    implementation "com.android.billingclient:billing-ktx:$billing_version"
    implementation fileTree(include: '*.jar', dir: 'libs')
    implementation project(':PitchPerfectLib')
    implementation project(':DepollSoftCommon')
    implementation project(':DepollSoftCompose')
    implementation project(':depollsoft.lib.kotlin')
    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear:wear-remote-interactions:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-crashlytics'
    // play-services-auth 22.0.0 removed the legacy GoogleSignIn API that firebase-ui-auth 9.x
    // still calls from GoogleSignInHandler, so tapping "Sign in with Google" crashed with
    // NoClassDefFoundError (Crashlytics issue 588e5ce8). Stay on the last 21.x until FirebaseUI
    // moves Google sign-in to Credential Manager.
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.firebaseui:firebase-ui-auth:9.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0'
    // Ships an ahead-of-time compile profile so sideloaded builds do not run interpreted.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.test:core:1.7.0'

    // Store captures, FirebaseUI compatibility, and privacy consent still run on a device.
    // PrivacyConsentTest uses Espresso to exercise the consent controls.
    androidTestImplementation platform(compose_bom)
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    
    // Test Orchestrator for isolated test execution (prevents state leakage between tests)
    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

android {
    sourceSets.androidTest.kotlin.directories.add(rootProject.file('store-screenshot-tests/src').path)
    buildFeatures {
        compose = true
        buildConfig = true
    }

    signingConfigs {
        debug {
            keyAlias 'depollsoft'
            keyPassword 'depollsoft'
            storeFile file('../debug.jks')
            storePassword 'depollsoft'
        }
        release {
            keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
            def uploadKeystore = System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH")
            if (uploadKeystore) {
                storeFile file(uploadKeystore)
            }
            storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
        }
    }
    namespace = 'depollsoft.pitchperfect'
    compileSdk 37

    sourceSets {
        // Build type specific resources (e.g., ad unit IDs)
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    defaultConfig {
        applicationId "depollsoft.pitchperfect"
        minSdk 24
        targetSdk 36
        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true
        // Release plans provide independent app/platform versions. Preview builds
        // retain their existing numbering when no production override is present.
        def releaseSelected = findProperty('DEPOLLSOFT_RELEASE_APP') == project.name
        def releaseVersion = releaseSelected ? findProperty('DEPOLLSOFT_RELEASE_VERSION') : null
        def releaseBuild = releaseSelected ? findProperty('DEPOLLSOFT_RELEASE_BUILD') : null
        if ((releaseVersion == null) != (releaseBuild == null)) {
            throw new GradleException('Provide both production version and build')
        }
        if (releaseVersion != null) {
            versionName releaseVersion.toString()
        }
        def privateBuildNumber = findProperty('DEPOLLSOFT_PRIVATE_BUILD_NUMBER')
        versionCode(releaseBuild != null ? (releaseBuild as Integer) : privateBuildNumber == null
                ? getVersionCode(build: 0, suffix: 0)
                : (privateBuildNumber as Integer) * 10)
        buildConfigField "String", "PRIVATE_BUILD_NUMBER", '""'
        buildConfigField "String", "PRIVATE_PR_NUMBER", '""'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Enable Test Orchestrator for isolated test execution
        // This prevents state leakage between tests and improves reliability
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.release
        }
        create("private") {
            initWith release
            // Sideloaded previews opt in explicitly; store uploads require credentials.
            signingConfig findProperty('DEPOLLSOFT_PRIVATE_DEBUG_SIGNING') == 'true'
                    ? signingConfigs.debug : signingConfigs.release
            applicationIdSuffix ".private"
            def privateNumber = findProperty("DEPOLLSOFT_PRIVATE_BUILD_NUMBER") ?: ""
            def privatePr = findProperty("DEPOLLSOFT_PRIVATE_PR_NUMBER") ?: ""
            buildConfigField "String", "PRIVATE_BUILD_NUMBER", "\"${privateNumber}\""
            buildConfigField "String", "PRIVATE_PR_NUMBER", "\"${privatePr}\""
            matchingFallbacks = ['release']
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true

        // Robolectric holds one sandbox, and one instrumented android-all jar, per distinct
        // @Config. The migrated screen tests add several, so the default test heap is no longer
        // enough. This only sizes the test JVM; nothing about the app changes.
        unitTests.all { test ->
            test.maxHeapSize = '4g'
        }

        // NOTE: Test Orchestrator disabled for faster execution (was adding ~30s+ per test)
        // Re-enable if test isolation issues occur with more tests:
        // execution 'ANDROIDX_TEST_ORCHESTRATOR'
        
        // Animation settings for faster/more reliable UI tests
        animationsDisabled = true
        
        managedDevices {
            localDevices {
                // ATD (Automated Test Device) - optimized for testing, no bloatware
                pixel2api30atd {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp-atd"
                }
                // Standard AOSP device for fallback
                pixel2api30 {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp"
                }
            }
            groups {
                // Default group for CI - uses ATD for faster execution
                ciDevices {
                    targetDevices.add(localDevices.pixel2api30atd)
                }
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(
                FirebaseUiNullEmailClassVisitorFactory,
                InstrumentationScope.ALL) { }
        variant.instrumentation.setAsmFramesComputationMode(
                FramesComputationMode.COMPUTE_FRAMES_FOR_INSTRUMENTED_METHODS)
    }
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

// Screenshot goldens live beside the tests so a port can be diffed against the View-era
// rendering: `recordRoborazziDebug` writes them, `compareRoborazziDebug` diffs against them.
roborazzi {
    outputDir = file("src/test/screenshots")
}
