import com.android.build.api.instrumentation.FramesComputationMode
import com.android.build.api.instrumentation.InstrumentationScope
import depollsoft.instrumentation.FirebaseUiNullEmailClassVisitorFactory

buildscript {
    repositories {
        google()
    }
}
apply plugin: 'com.android.application'

repositories {
    mavenCentral()
}

ext {
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    def billing_version = "9.1.0"
    implementation "com.android.billingclient:billing:$billing_version"
    implementation "com.android.billingclient:billing-ktx:$billing_version"
    implementation fileTree(include: '*.jar', dir: 'libs')
    implementation project(':PitchPerfectLib')
    implementation project(':DepollSoftCommon')
    implementation project(':DepollSoftCommon.Compat')
    implementation project(':depollsoft.lib.kotlin')
    implementation project(':bindroid')
    implementation project(':bindroid-kotlin')
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.firebaseui:firebase-ui-auth:9.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'
    // Ships an ahead-of-time compile profile so sideloaded builds do not run interpreted.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test:rules:1.7.0'
    testImplementation 'androidx.test:runner:1.7.0'
    testImplementation 'androidx.fragment:fragment-testing:1.9.0'

    // Espresso UI Testing Dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-idling-resource:3.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.fragment:fragment-testing:1.9.0'
    
    // Test Orchestrator for isolated test execution (prevents state leakage between tests)
    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

android {
    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        debug {
            keyAlias 'depollsoft'
            keyPassword 'depollsoft'
            storeFile file('../debug.jks')
            storePassword 'depollsoft'
        }
        release {
            keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS") ?: 'depollsoft'
            keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD") ?: 'depollsoft'
            storeFile file(System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH") ?: '../debug.jks')
            storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD") ?: 'depollsoft'
        }
    }
    namespace = 'depollsoft.pitchperfect'
    compileSdk 37

    sourceSets {
        // Build type specific resources (e.g., ad unit IDs)
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    defaultConfig {
        applicationId "depollsoft.pitchperfect"
        minSdk 24
        targetSdk 36
        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true
        def privateBuildNumber = findProperty('DEPOLLSOFT_PRIVATE_BUILD_NUMBER')
        versionCode(privateBuildNumber == null
                ? getVersionCode(build: 0, suffix: 0)
                : (privateBuildNumber as Integer) * 10)
        buildConfigField "String", "PRIVATE_BUILD_NUMBER", '""'
        buildConfigField "String", "PRIVATE_PR_NUMBER", '""'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Enable Test Orchestrator for isolated test execution
        // This prevents state leakage between tests and improves reliability
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.release
        }
        create("private") {
            initWith release
            signingConfig signingConfigs.release
            applicationIdSuffix ".private"
            def privateNumber = findProperty("DEPOLLSOFT_PRIVATE_BUILD_NUMBER") ?: ""
            def privatePr = findProperty("DEPOLLSOFT_PRIVATE_PR_NUMBER") ?: ""
            buildConfigField "String", "PRIVATE_BUILD_NUMBER", "\"${privateNumber}\""
            buildConfigField "String", "PRIVATE_PR_NUMBER", "\"${privatePr}\""
            matchingFallbacks = ['release']
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true

        // NOTE: Test Orchestrator disabled for faster execution (was adding ~30s+ per test)
        // Re-enable if test isolation issues occur with more tests:
        // execution 'ANDROIDX_TEST_ORCHESTRATOR'
        
        // Animation settings for faster/more reliable UI tests
        animationsDisabled = true
        
        managedDevices {
            localDevices {
                // ATD (Automated Test Device) - optimized for testing, no bloatware
                pixel2api30atd {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp-atd"
                }
                // Standard AOSP device for fallback
                pixel2api30 {
                    device = "Pixel 2"
                    apiLevel = 30
                    systemImageSource = "aosp"
                }
            }
            groups {
                // Default group for CI - uses ATD for faster execution
                ciDevices {
                    targetDevices.add(localDevices.pixel2api30atd)
                }
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(
                FirebaseUiNullEmailClassVisitorFactory,
                InstrumentationScope.ALL) { }
        variant.instrumentation.setAsmFramesComputationMode(
                FramesComputationMode.COMPUTE_FRAMES_FOR_INSTRUMENTED_METHODS)
    }
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
