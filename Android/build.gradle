import java.time.Instant
import java.time.LocalDateTime
import java.time.LocalTime
import java.time.format.DateTimeFormatter

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.25'
    repositories {
        mavenCentral()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'

        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

ext {
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        maven { url "https://jitpack.io" }
    }
}

subprojects {
    pluginManager.withPlugin("com.android.application") {
        android {
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            buildTypes {
                debug {
                    testCoverageEnabled = true
                }
            }
        }

        apply plugin: 'jacoco'
        jacoco { toolVersion = '0.8.12' }

        afterEvaluate {
            def unitTestTask = tasks.findByName('testDebugUnitTest')
            if (unitTestTask != null) {
                unitTestTask.extensions.findByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension)?.with {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }

                def baseExcludes = [
                    '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
                    '**/*Test*.*', 'android/**/*.*', 'androidx/**/*.*',
                    '**/BottomNavigationUtils*.*',
                    '**/Analytics*.*',
                    '**/depollsoft/lib/util/Util*.*',
                    '**/TrackingScope*.*'
                ]
                def includes = ['**/*.class']
                if (project.name == 'PitchPerfect') {
                    includes = ['depollsoft/pitchperfect/**/*.class']
                }
                if (project.name == 'PitchPerfectWear') {
                    includes = ['depollsoft/pitchperfect/**/*.class']
                }
                if (project.name == 'TagMaster') {
                    includes = ['depollsoft/tagmaster/**/*.class']
                }

                project.ext.coverageExcludes = new ArrayList<>(baseExcludes)
                project.ext.coverageIncludes = new ArrayList<>(includes)
                println "Excludes for ${project.name}: ${project.ext.coverageExcludes}"

                tasks.register('jacocoTestReport', JacocoReport) {
                    println "Creating jacocoTestReport for ${project.name}"
                    println "Build dir for ${project.name}: ${buildDir}"
                    dependsOn unitTestTask
                    reports {
                        xml.required.set(true)
                        html.required.set(true)
                    }
                    def classTree = fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: project.ext.coverageExcludes, includes: project.ext.coverageIncludes)
                    classDirectories.setFrom(classTree)
                    sourceDirectories.setFrom(files('src/main/java', 'src/main/kotlin', 'src'))
                    
                    def execPath = "${buildDir}/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
                    println "Checking if file exists at config time for ${project.name}: ${execPath}"
                    println "Exists: ${file(execPath).exists()}"
                    executionData.setFrom(files(execPath))

                    doFirst {
                        println "Executing JacocoReport for ${project.name}"
                        println "Execution Data: ${executionData.files}"
                    }
                }

                tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
                    dependsOn unitTestTask
                    violationRules {
                        rule {
                            limit { minimum = 0.85 }
                        }
                    }
                    classDirectories.setFrom(fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: project.ext.coverageExcludes, includes: project.ext.coverageIncludes))
                    executionData.setFrom(files("${buildDir}/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"))
                }
            }
        }
    }

    pluginManager.withPlugin("com.android.library") {
        android {
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            buildTypes {
                debug {
                    testCoverageEnabled = true
                }
            }
            testOptions {
                unitTests.all { test ->
                    test.useJUnit()
                    test.javaLauncher = javaToolchains.launcherFor {
                        languageVersion = JavaLanguageVersion.of(17)
                    }
                }
            }
        }

        // Apply Jacoco to all library modules except bindroid-test (which is an instrumentation test app)
        if (project.name != 'bindroid-test') {
            apply plugin: 'jacoco'
            jacoco { toolVersion = '0.8.12' }

            afterEvaluate {
                def unitTestTask = tasks.findByName('testDebugUnitTest')
                if (unitTestTask != null) {
                    unitTestTask.extensions.findByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension)?.with {
                        includeNoLocationClasses = true
                        excludes = ['jdk.internal.*']
                    }

                    def baseExcludes = [
                        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
                        '**/*Test*.*', 'android/**/*.*', 'androidx/**/*.*',
                        '**/Analytics*.*',
                        '**/depollsoft/lib/util/Util*.*',
                        '**/TrackingScope*.*',
                        // Exclude Kotlin inline function anonymous classes - these can't be covered
                        // because inline code gets copied to the call site at compile time
                        '**/*Kt$trackable$*.class',
                        '**/*Kt$trackableNullable$*.class',
                        '**/*Kt$bind$*.class',
                        '**/*Kt$uibind$*.class',
                        '**/*Kt$bindTo$*.class',
                        '**/*Kt$weakBind$*.class',
                        '**/*Kt$weakProp$*.class',
                        '**/*Kt$compiledProp$*.class',
                        '**/*Kt$converter$*.class',
                        '**/*Kt$transaction$*.class',
                        // Exclude SAM adapter classes
                        '**/*$sam$*.class'
                    ]
                    def includes = ['**/*.class']
                    project.ext.coverageExcludes = new ArrayList<>(baseExcludes)
                    project.ext.coverageIncludes = new ArrayList<>(includes)
                    println "Excludes for library ${project.name}: ${project.ext.coverageExcludes}"

                    tasks.register('jacocoTestReport', JacocoReport) {
                        println "Creating jacocoTestReport for library ${project.name}"
                        println "Build dir for ${project.name}: ${buildDir}"
                        dependsOn unitTestTask
                        reports {
                            xml.required.set(true)
                            html.required.set(true)
                        }
                        def classTree = files(
                            fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: project.ext.coverageExcludes, includes: project.ext.coverageIncludes),
                            fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: project.ext.coverageExcludes, includes: project.ext.coverageIncludes)
                        )
                        classDirectories.setFrom(classTree)
                        sourceDirectories.setFrom(files('src/main/java', 'src/main/kotlin', 'src'))
                        executionData.setFrom(fileTree(dir: buildDir, includes: [
                            'jacoco/testDebugUnitTest.exec',
                            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
                            'outputs/unit_test_code_coverage/debugUnitTest/*.ec',
                            'outputs/code-coverage/connected/*/coverage.ec',
                            'outputs/code_coverage/debugAndroidTest/connected/*/*.ec',
                            'outputs/code_coverage/connected/*/*.ec'
                        ]))
                    }

                    tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
                        dependsOn unitTestTask
                        // Lower threshold for modules with heavy inline function usage (bindroid-kotlin)
                        // Inline functions can't be covered by JaCoCo as bytecode is copied to call sites
                        def minCoverage = (project.name == 'bindroid-kotlin') ? 0.50 : 0.85
                        violationRules {
                            rule { limit { minimum = minCoverage } }
                        }
                        classDirectories.setFrom(files(
                            fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: project.ext.coverageExcludes, includes: project.ext.coverageIncludes),
                            fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: project.ext.coverageExcludes, includes: project.ext.coverageIncludes)
                        ))
                        executionData.setFrom(fileTree(dir: buildDir, includes: [
                            'jacoco/testDebugUnitTest.exec',
                            'outputs/unit_test_code_coverage/debugUnitTest/*.ec',
                            'outputs/code-coverage/connected/*/coverage.ec',
                            'outputs/code_coverage/debugAndroidTest/connected/*/*.ec',
                            'outputs/code_coverage/connected/*/*.ec'
                        ]))
                    }
                }
            }
        }
    }

    pluginManager.withPlugin("org.jetbrains.kotlin.android") {
        kotlin {
            jvmToolchain(17)
        }
    }
}

// Force all unit tests across modules to run with Java 17 toolchain
allprojects {
    tasks.withType(Test).configureEach { test ->
        test.useJUnit()
        test.javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

static def getVersionCode(Map args) {
    return getDate() * 1000 + args.build * 10 + args.suffix
}

static def getDate() {
    return Integer.parseInt(DateTimeFormatter.ofPattern("YYMMdd").format(LocalDateTime.now()))
}

configurations {
    all {
        resolutionStrategy {
            dependencySubstitution {
                substitute project(':bindroid') with project(':bindroid:bindroid')
            }
        }
    }
}

// Aggregate coverage tasks across all non-test modules
gradle.projectsEvaluated {
    def verifiers = []
    def reporters = []
    subprojects.each { p ->
        if (p.name != 'bindroid-test') {
            def v = p.tasks.findByName('jacocoTestCoverageVerification')
            def r = p.tasks.findByName('jacocoTestReport')
            if (v != null) verifiers << v.path
            if (r != null) reporters << r.path
        }
    }
    tasks.register('coverage') {
        group = 'verification'
        description = 'Runs unit tests and enforces 85% coverage for all non-test Android modules.'
        dependsOn(verifiers)
        dependsOn(reporters)
    }

    // Convenience task: run connected tests then generate coverage reports
    def connectedTests = []
    subprojects.each { p ->
        def connected = p.tasks.findByName('connectedDebugAndroidTest')
        if (connected != null) connectedTests << connected.path
    }
    if (!connectedTests.isEmpty()) {
        tasks.register('coverageConnected') {
            group = 'verification'
            description = 'Runs connectedAndroidTest for all modules then generates Jacoco reports.'
            dependsOn(connectedTests)
            dependsOn(reporters)
        }
    }

    def unitTests = []
    subprojects.each { p ->
        def unitTask = p.tasks.findByName('testDebugUnitTest')
        if (unitTask != null) unitTests << unitTask.path
    }
    if (!unitTests.isEmpty()) {
        tasks.register('testAllDebugUnitTest') {
            group = 'verification'
            description = 'Runs debug unit tests for every Android module.'
            dependsOn(unitTests)
        }
        tasks.register('testDebugUnitTest') {
            group = 'verification'
            description = 'Alias for running all module debug unit tests.'
            dependsOn(unitTests)
        }
    }
}
