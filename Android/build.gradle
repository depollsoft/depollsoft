import java.time.Instant
import java.time.LocalDateTime
import java.time.LocalTime
import java.time.format.DateTimeFormatter

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.3.0'
    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.google.com/'
            name = 'Google'
        }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'

        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.0"
        classpath "io.github.takahirom.roborazzi:roborazzi-gradle-plugin:1.75.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

ext {
    compose_bom = 'androidx.compose:compose-bom:2026.09.00'
    roborazzi_version = '1.75.0'
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven {
            url = 'https://maven.google.com/'
            name = 'Google'
        }
        maven { url = "https://jitpack.io" }
    }
}

// Resolve runtimes before the test JVM starts. Robolectric's Android security providers can
// break HTTPS downloads when a later test first requests another SDK in the same process.
// Keep these aligned with Robolectric 4.16.1 and the SDKs used by our @Config annotations.
def robolectricSdks = ['6.0.1_r3-robolectric-r1-i7', '7.0.0_r1-robolectric-r1-i7',
 '8.0.0_r4-robolectric-r1-i7',
 '9-robolectric-4913185-2-i7', '13-robolectric-9030017-i7',
 '15-robolectric-13954326-i7'].collect { version ->
    // Separate configurations prevent Gradle from selecting only the newest runtime version.
    def sdk = configurations.create("robolectricSdk${version.replaceAll('[^a-zA-Z0-9]', '_')}") {
        canBeConsumed = false
        transitive = false
    }
    dependencies.add(sdk.name, "org.robolectric:android-all-instrumented:$version")
    sdk
}
def robolectricSdkDirectory = layout.buildDirectory.dir('robolectric-sdks')
def downloadRobolectricSdks = tasks.register('downloadRobolectricSdks', Sync) {
    from robolectricSdks
    into robolectricSdkDirectory
}

// The task wiring is shared; app filters and library execution-data paths remain explicit.
def configureAndroidCoverage = { Project target, boolean application ->
    target.android {
        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        buildTypes {
            debug { testCoverageEnabled = true }
        }
    }
    target.pluginManager.apply('jacoco')
    target.jacoco { toolVersion = '0.8.15' }

    target.afterEvaluate {
        def unitTestTask = target.tasks.findByName('testDebugUnitTest')
        if (unitTestTask == null) return

        unitTestTask.extensions.findByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension)?.with {
            includeNoLocationClasses = true
            excludes = ['jdk.internal.*']
        }
        def excludes = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', 'android/**/*.*', 'androidx/**/*.*',
        ]
        if (!application) {
            excludes += [
                // Firebase/platform glue and compiler-generated SAM adapters.
                '**/Analytics*.*', '**/depollsoft/lib/util/Util*.*', '**/*$sam$*.class',
            ]
        }
        def includes = ['**/*.class']
        if (application && target.name in ['PitchPerfect', 'PitchPerfectWear']) {
            includes = ['depollsoft/pitchperfect/**/*.class']
        } else if (application && target.name == 'TagMaster') {
            includes = ['depollsoft/tagmaster/**/*.class']
        }
        target.ext.coverageExcludes = excludes
        target.ext.coverageIncludes = includes

        def classTree = target.files(
            target.fileTree(dir: "${target.buildDir}/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes", excludes: excludes, includes: includes),
            target.fileTree(dir: "${target.buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: excludes, includes: includes)
        )
        def executionData = application
            ? target.files("${target.buildDir}/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec")
            : target.fileTree(dir: target.buildDir, includes: [
                'jacoco/testDebugUnitTest.exec',
                'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
                'outputs/unit_test_code_coverage/debugUnitTest/*.ec',
                'outputs/code-coverage/connected/*/coverage.ec',
                'outputs/code_coverage/debugAndroidTest/connected/*/*.ec',
                'outputs/code_coverage/connected/*/*.ec',
            ])

        target.tasks.register('jacocoTestReport', JacocoReport) {
            dependsOn unitTestTask
            reports {
                xml.required.set(true)
                html.required.set(true)
            }
            classDirectories.setFrom(classTree)
            sourceDirectories.setFrom(target.files('src/main/java', 'src/main/kotlin', 'src'))
            getExecutionData().setFrom(executionData)
        }
        target.tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
            dependsOn unitTestTask
            violationRules {
                rule { limit { minimum = application && target.name == 'TagMaster' ? 0.15 : 0.85 } }
            }
            classDirectories.setFrom(classTree)
            getExecutionData().setFrom(executionData)
        }
    }
}

subprojects {
    tasks.withType(Test).configureEach {
        dependsOn downloadRobolectricSdks
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', robolectricSdkDirectory.get().asFile.absolutePath
    }

    ['com.android.application', 'com.android.library'].each { id ->
        pluginManager.withPlugin(id) {
            configureAndroidCoverage(project, id == 'com.android.application')
        }
    }

    pluginManager.withPlugin("org.jetbrains.kotlin.android") {
        kotlin {
            jvmToolchain(17)
        }
    }

    // CI's API-level gate: `-PlintNewApiOnly` narrows lint to calls newer than a module's minSdk
    // and fails on them. The unit tests run on SDK 35, where such a call can't fail.
    if (project.hasProperty('lintNewApiOnly')) {
        ['com.android.application', 'com.android.library'].each { id ->
            pluginManager.withPlugin(id) {
                android {
                    lint {
                        checkOnly.add('NewApi')
                        abortOnError = true
                        checkDependencies = false
                    }
                }
            }
        }
    }
}

// Force all unit tests across modules to run with Java 17 toolchain
allprojects {
    tasks.withType(Test).configureEach { test ->
        test.useJUnit()
        test.javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

static def getVersionCode(Map args) {
    return getDate() * 1000 + args.build * 10 + args.suffix
}

static def getDate() {
    return Integer.parseInt(DateTimeFormatter.ofPattern("YYMMdd").format(LocalDateTime.now()))
}

// Aggregate coverage tasks across all non-test modules
gradle.projectsEvaluated {
    def verifiers = []
    def reporters = []
    subprojects.each { p ->
        def v = p.tasks.findByName('jacocoTestCoverageVerification')
        def r = p.tasks.findByName('jacocoTestReport')
        if (v != null) verifiers << v.path
        if (r != null) reporters << r.path
    }
    tasks.register('coverage') {
        group = 'verification'
        description = 'Runs unit tests and enforces 85% coverage for all non-test Android modules.'
        dependsOn(verifiers)
        dependsOn(reporters)
    }

    // Convenience task: run connected tests then generate coverage reports
    def connectedTests = []
    subprojects.each { p ->
        def connected = p.tasks.findByName('connectedDebugAndroidTest')
        if (connected != null) connectedTests << connected.path
    }
    if (!connectedTests.isEmpty()) {
        tasks.register('coverageConnected') {
            group = 'verification'
            description = 'Runs connectedAndroidTest for all modules then generates Jacoco reports.'
            dependsOn(connectedTests)
            dependsOn(reporters)
        }
    }

    def unitTests = []
    subprojects.each { p ->
        def unitTask = p.tasks.findByName('testDebugUnitTest')
        if (unitTask != null) unitTests << unitTask.path
    }
    if (!unitTests.isEmpty()) {
        tasks.register('testAllDebugUnitTest') {
            group = 'verification'
            description = 'Runs debug unit tests for every Android module.'
            dependsOn(unitTests)
        }
        tasks.register('testDebugUnitTest') {
            group = 'verification'
            description = 'Alias for running all module debug unit tests.'
            dependsOn(unitTests)
        }
    }
}
