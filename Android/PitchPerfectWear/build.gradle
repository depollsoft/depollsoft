apply plugin: 'com.android.application'


android {
    namespace = 'depollsoft.pitchperfect'
    compileSdk 37

    signingConfigs {
        preview {
            keyAlias 'depollsoft'
            keyPassword 'depollsoft'
            storeFile file('../debug.jks')
            storePassword 'depollsoft'
        }
        release {
            keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
            def uploadKeystore = System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH")
            if (uploadKeystore) {
                storeFile file(uploadKeystore)
            }
            storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "depollsoft.pitchperfect"
        minSdk 26

        targetSdk 36
        def releaseSelected = findProperty('DEPOLLSOFT_RELEASE_APP') == project.name
        def releaseVersion = releaseSelected ? findProperty('DEPOLLSOFT_RELEASE_VERSION') : null
        def releaseBuild = releaseSelected ? findProperty('DEPOLLSOFT_RELEASE_BUILD') : null
        if ((releaseVersion == null) != (releaseBuild == null)) {
            throw new GradleException('Provide both production version and build')
        }
        def privateBuildNumber = findProperty('DEPOLLSOFT_PRIVATE_BUILD_NUMBER')
        versionCode(releaseBuild != null ? (releaseBuild as Integer) : privateBuildNumber == null
                ? getVersionCode(build: 0, suffix: 1)
                : (privateBuildNumber as Integer) * 10 + 1)

        versionName(releaseVersion != null ? releaseVersion.toString() : "3.0.0")
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        create("private") {
            initWith release
            // Sideloaded previews opt in explicitly; store uploads require credentials.
            signingConfig findProperty('DEPOLLSOFT_PRIVATE_DEBUG_SIGNING') == 'true'
                    ? signingConfigs.preview : signingConfigs.release
            applicationIdSuffix ".private"
            matchingFallbacks = ['release']
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    sourceSets {
        test {
            java.srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.customview:customview:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation project(':bindroid')
    implementation project(':PitchPerfectLib')
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
