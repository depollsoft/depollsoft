apply plugin: 'com.android.application'


android {
    namespace = 'depollsoft.pitchperfect'
    compileSdk 37

    signingConfigs {
        release {
            keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS") ?: 'depollsoft'
            keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD") ?: 'depollsoft'
            storeFile file(System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH") ?: '../debug.jks')
            storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD") ?: 'depollsoft'
        }
    }

    defaultConfig {
        applicationId "depollsoft.pitchperfect"
        minSdk 26

        targetSdk 36
        def privateBuildNumber = findProperty('DEPOLLSOFT_PRIVATE_BUILD_NUMBER')
        versionCode(privateBuildNumber == null
                ? getVersionCode(build: 0, suffix: 1)
                : (privateBuildNumber as Integer) * 10 + 1)

        versionName "3.0.0"
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        create("private") {
            initWith release
            signingConfig signingConfigs.release
            applicationIdSuffix ".private"
            matchingFallbacks = ['release']
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    sourceSets {
        test {
            java.srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.customview:customview:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation project(':bindroid')
    implementation project(':PitchPerfectLib')
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
